name: project-lumi

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumi}
      POSTGRES_USER: ${POSTGRES_USER:-lumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumi_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  schema-migrate:
    image: postgres:17.7-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumi}
      POSTGRES_USER: ${POSTGRES_USER:-lumi}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lumi_local_only}
    volumes:
      - ../../apps/web/migrations:/migrations/auth:ro
      - ../../packages/profiles/migrations:/migrations/profile:ro
      - ../../packages/world/migrations:/migrations/world:ro
      - ../../packages/npc-intelligence/migrations:/migrations/npc:ro
      - ../../packages/story/migrations:/migrations/story:ro
    command:
      - sh
      - -ec
      - |
        apply_dir() {
          label="$$1"
          dir="$$2"
          for file in "$$dir"/*.sql; do
            [ -f "$$file" ] || continue
            echo "Applying $$label migration: $${file##*/}"
            psql \
              -h postgres \
              -U "$${POSTGRES_USER}" \
              -d "$${POSTGRES_DB}" \
              -v ON_ERROR_STOP=1 \
              -f "$$file"
            echo "Migration $${file##*/} applied successfully"
          done
        }
        apply_dir auth /migrations/auth
        apply_dir profile /migrations/profile
        apply_dir world /migrations/world
        apply_dir npc /migrations/npc
        apply_dir story /migrations/story
        echo "All canonical schema migrations applied successfully"
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://172.41.42.51:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi_local_only}@postgres:5432/${POSTGRES_DB:-lumi}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://172.41.42.51:3001}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      LUMI_SETTINGS_ENCRYPTION_KEY: ${LUMI_SETTINGS_ENCRYPTION_KEY}
    ports:
      - "${WEB_PORT:-3001}:3000"
    restart: unless-stopped
    init: true

  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumi}:${POSTGRES_PASSWORD:-lumi_local_only}@postgres:5432/${POSTGRES_DB:-lumi}
      REDIS_URL: redis://redis:6379
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      WORKER_MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-2}
      WORKER_OUTBOX_BATCH_SIZE: ${WORKER_OUTBOX_BATCH_SIZE:-25}
      WORKER_OUTBOX_HOUSEHOLD_LIMIT: ${WORKER_OUTBOX_HOUSEHOLD_LIMIT:-100}
      SIMULATION_SEED: ${SIMULATION_SEED:-lumi-sim-v1}
      WORKER_WORLD_CANDIDATES_JSON: ${WORKER_WORLD_CANDIDATES_JSON:-[]}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true

volumes:
  postgres-data:
