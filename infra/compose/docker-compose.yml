name: project-lumi

services:
  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  schema-migrate:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.migrations
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command:
      - sh
      - -ec
      - |
        apply_dir() {
          label="$$1"
          dir="$$2"
          for file in "$$dir"/*.sql; do
            [ -f "$$file" ] || continue
            echo "Applying $$label migration: $${file##*/}"
            psql \
              "$${DATABASE_URL}" \
              -v ON_ERROR_STOP=1 \
              -f "$$file"
            echo "Migration $${file##*/} applied successfully"
          done
        }
        apply_dir auth /migrations/auth
        apply_dir profile /migrations/profile
        apply_dir world /migrations/world
        apply_dir npc /migrations/npc
        apply_dir story /migrations/story
        echo "All canonical schema migrations applied successfully"
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://172.41.42.51:3001}
    depends_on:
      redis:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-2}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://172.41.42.51:3001}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      LUMI_SETTINGS_ENCRYPTION_KEY: ${LUMI_SETTINGS_ENCRYPTION_KEY}
      LUMI_DEMO_CONFIRM: ${LUMI_DEMO_CONFIRM:-}
      LUMI_DEMO_PARENT_PASSWORD: ${LUMI_DEMO_PARENT_PASSWORD:-}
      LUMI_DEMO_WEB_CONTROL_TOKEN: ${LUMI_DEMO_WEB_CONTROL_TOKEN:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
    ports:
      - "${WEB_PORT:-3001}:3000"
    restart: unless-stopped
    init: true

  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-2}
      REDIS_URL: redis://redis:6379
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      WORKER_MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-2}
      WORKER_OUTBOX_BATCH_SIZE: ${WORKER_OUTBOX_BATCH_SIZE:-25}
      WORKER_OUTBOX_HOUSEHOLD_LIMIT: ${WORKER_OUTBOX_HOUSEHOLD_LIMIT:-100}
      SIMULATION_SEED: ${SIMULATION_SEED:-lumi-sim-v1}
      WORKER_WORLD_CANDIDATES_JSON: ${WORKER_WORLD_CANDIDATES_JSON:-[]}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true
