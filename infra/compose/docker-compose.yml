name: project-lumi

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumi}
      POSTGRES_USER: ${POSTGRES_USER:-lumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumi_local_only}
    ports:
      - "${POSTGRES_PORT:-15432}:15432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-16379}:16379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
