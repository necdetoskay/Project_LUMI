version: 2
updates:
  - package-ecosystem: npm-pnpm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
      runtime-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
