name: Temporary exact child age patch

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-long-horizon-playwright-pack
          fetch-depth: 0
      - name: Apply exact-age production wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          p = "packages/profiles/src/domain/validation.ts"
          replace_once(p,
          "export function validateMembershipRole(value: string): MembershipRole {",
          "export function validateAgeYears(value: number): number {\n  if (!Number.isInteger(value) || value < 3 || value > 17) {\n    throw new ValidationError(\n      \"INVALID_AGE_YEARS\",\n      \"Age must be an integer between 3 and 17\",\n      \"ageYears\",\n    );\n  }\n  return value;\n}\n\nexport function ageBandForAgeYears(value: number): AgeBand {\n  const age = validateAgeYears(value);\n  if (age <= 5) return \"3-5\";\n  if (age <= 8) return \"6-8\";\n  if (age <= 12) return \"9-12\";\n  return \"13+\";\n}\n\nexport function validateMembershipRole(value: string): MembershipRole {")

          p = "packages/profiles/src/application/child-profile.service.ts"
          replace_once(p,
          'import { validateAgeBand, validateDisplayName } from "../domain/validation";',
          'import {\n  ageBandForAgeYears,\n  validateAgeBand,\n  validateAgeYears,\n  validateDisplayName,\n} from "../domain/validation";')
          replace_once(p,
          "  ageBand: string;\n}",
          "  ageBand?: string;\n  ageYears?: number;\n}")
          replace_once(p,
          "  ageBand?: string;\n}\n\nexport interface ChildProfileResult",
          "  ageBand?: string;\n  ageYears?: number;\n}\n\nexport interface ChildProfileResult")
          replace_once(p,
          "  ageBand: string;\n  locale: string;",
          "  ageBand: string;\n  ageYears: number | null;\n  locale: string;")
          replace_once(p,
          "  validateDisplayName(input.displayName);\n  validateAgeBand(input.ageBand);\n\n  const { childRepo } = getRepos();",
          "  validateDisplayName(input.displayName);\n  const ageYears =\n    input.ageYears === undefined ? undefined : validateAgeYears(input.ageYears);\n  const ageBand =\n    ageYears === undefined\n      ? validateAgeBand(input.ageBand ?? \"\")\n      : ageBandForAgeYears(ageYears);\n\n  const { childRepo } = getRepos();")
          replace_once(p,
          "    ageBand: input.ageBand,\n    locale: \"tr-TR\",",
          "    ageBand,\n    locale: \"tr-TR\",\n    metadata: ageYears === undefined ? {} : { ageYears },")
          replace_once(p,
          "    ageBand: profile.ageBand,\n    locale: profile.locale,",
          "    ageBand: profile.ageBand,\n    ageYears: profile.metadata.ageYears ?? null,\n    locale: profile.locale,")
          # Three remaining result mappings use the same fields.
          text = Path(p).read_text()
          old = "    ageBand: p.ageBand,\n    locale: p.locale,"
          if text.count(old) != 1:
              raise SystemExit(f"{p}: list mapping match count {text.count(old)}")
          text = text.replace(old, "    ageBand: p.ageBand,\n    ageYears: p.metadata.ageYears ?? null,\n    locale: p.locale,", 1)
          old = "    ageBand: profile.ageBand,\n    locale: profile.locale,"
          if text.count(old) != 2:
              raise SystemExit(f"{p}: expected two remaining profile mappings, got {text.count(old)}")
          text = text.replace(old, "    ageBand: profile.ageBand,\n    ageYears: profile.metadata.ageYears ?? null,\n    locale: profile.locale,")
          # Update preserves metadata and synchronizes ageBand when exact age changes.
          old = "  if (input.ageBand !== undefined) {\n    validateAgeBand(input.ageBand);\n  }\n\n  const { childRepo } = getRepos();\n  const profile = await childRepo.update(profileId, householdId, input);"
          new = "  if (input.ageBand !== undefined) {\n    validateAgeBand(input.ageBand);\n  }\n  if (input.ageYears !== undefined) {\n    validateAgeYears(input.ageYears);\n  }\n\n  const { childRepo } = getRepos();\n  const existing = await childRepo.findById(profileId, householdId);\n  if (!existing) throw new Error(\"Child profile not found for update\");\n  const ageYears = input.ageYears;\n  const profile = await childRepo.update(profileId, householdId, {\n    displayName: input.displayName,\n    ageBand:\n      ageYears === undefined\n        ? input.ageBand\n        : ageBandForAgeYears(ageYears),\n    metadata:\n      ageYears === undefined\n        ? existing.metadata\n        : { ...existing.metadata, ageYears },\n  });"
          if text.count(old) != 1:
              raise SystemExit(f"{p}: update block count {text.count(old)}")
          Path(p).write_text(text.replace(old, new, 1))

          p = "packages/profiles/src/application/generation-context.service.ts"
          replace_once(p,
          "  ageBand: string;\n  locale: string;",
          "  ageBand: string;\n  ageYears: number | null;\n  locale: string;")
          replace_once(p,
          "      ageBand: child.ageBand,\n      locale: child.locale,",
          "      ageBand: child.ageBand,\n      ageYears: child.ageYears,\n      locale: child.locale,")

          p = "packages/profiles/src/application/onboarding.service.ts"
          replace_once(p,
          "    ageBand: string;\n  }>;",
          "    ageBand: string;\n    ageYears: number | null;\n  }>;")
          replace_once(p,
          "      ageBand: p.ageBand,\n    })),",
          "      ageBand: p.ageBand,\n      ageYears: p.metadata.ageYears ?? null,\n    })),")

          p = "apps/web/app/api/child-profiles/route.ts"
          replace_once(p,
          '      typeof parsed.displayName !== "string" ||\n      typeof parsed.ageBand !== "string"',
          '      typeof parsed.displayName !== "string" ||\n      (typeof parsed.ageYears !== "number" && typeof parsed.ageBand !== "string")')
          replace_once(p,
          '          message: "householdId, displayName, and ageBand are required",',
          '          message: "householdId, displayName, and ageYears (or legacy ageBand) are required",')
          replace_once(p,
          "        displayName: parsed.displayName,\n        ageBand: parsed.ageBand,",
          "        displayName: parsed.displayName,\n        ageYears:\n          typeof parsed.ageYears === \"number\" ? parsed.ageYears : undefined,\n        ageBand:\n          typeof parsed.ageBand === \"string\" ? parsed.ageBand : undefined,")

          p = "apps/web/app/app/onboarding/page.tsx"
          replace_once(p,
          "  childProfiles: { id: string; displayName: string; ageBand: string }[];",
          "  childProfiles: {\n    id: string;\n    displayName: string;\n    ageBand: string;\n    ageYears: number | null;\n  }[];")
          replace_once(p,
          "  profiles: { id: string; displayName: string; ageBand: string }[];",
          "  profiles: {\n    id: string;\n    displayName: string;\n    ageBand: string;\n    ageYears: number | null;\n  }[];")
          replace_once(p,
          "    ageBand: string;\n  }) => void;",
          "    ageBand: string;\n    ageYears: number | null;\n  }) => void;")
          replace_once(p,
          '  const [ageBand, setAgeBand] = useState("");',
          '  const [ageYears, setAgeYears] = useState(6);')
          replace_once(p,
          "      if (!ageBand) return;\n      setSubmitting(true);",
          "      setSubmitting(true);")
          replace_once(p,
          "          body: JSON.stringify({ householdId, displayName, ageBand }),",
          "          body: JSON.stringify({ householdId, displayName, ageYears }),")
          replace_once(p,
          '        setAgeBand("");',
          "        setAgeYears(6);")
          replace_once(p,
          "    [householdId, displayName, ageBand, onProfileAdded, onError],",
          "    [householdId, displayName, ageYears, onProfileAdded, onError],")
          replace_once(p,
          "                <span className=\"ml-3 text-muted text-sm\">{p.ageBand}</span>",
          "                <span className=\"ml-3 text-muted text-sm\">\n                  {p.ageYears === null ? p.ageBand : `${p.ageYears} yaş`}\n                </span>")
          old = '''          <label
            className="font-label-bold text-on-surface-variant"
            htmlFor="ageBand"
          >
            Yaş grubu
          </label>
          <select
            className="w-full px-[0.9rem] py-[0.8rem] rounded-lg border border-border bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body text-body"
            id="ageBand"
            required
            value={ageBand}
            onChange={(e) => setAgeBand(e.target.value)}
          >
            <option value="">Seçin</option>
            <option value="3-5">3–5 yaş</option>
            <option value="6-8">6–8 yaş</option>
            <option value="9-12">9–12 yaş</option>
          </select>'''
          new = '''          <label
            className="font-label-bold text-on-surface-variant"
            htmlFor="ageYears"
          >
            Yaş
          </label>
          <input
            className="w-full px-[0.9rem] py-[0.8rem] rounded-lg border border-border bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body text-body"
            id="ageYears"
            min={3}
            max={17}
            required
            type="number"
            value={ageYears}
            onChange={(e) => setAgeYears(Number(e.target.value))}
          />
          <p className="text-[12px] text-secondary">
            Hikâye dili ve öneriler çocuğun tam yaşına göre kişiselleştirilir.
          </p>'''
          replace_once(p, old, new)

          Path(".github/workflows/tmp-exact-child-age-patch.yml").unlink()
          PY
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(profiles): carry exact child age into generation context"
          git push origin HEAD:agent/live-long-horizon-playwright-pack
