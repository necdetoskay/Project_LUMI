name: Temporary exact child age patch

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-long-horizon-playwright-pack
          fetch-depth: 0
      - name: Apply exact-age backend wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {n}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          p = "packages/profiles/src/domain/validation.ts"
          once(p,
            "export function validateMembershipRole(value: string): MembershipRole {",
            "export function validateAgeYears(value: number): number {\n  if (!Number.isInteger(value) || value < 3 || value > 17) {\n    throw new ValidationError(\n      \"INVALID_AGE_YEARS\",\n      \"Age must be an integer between 3 and 17\",\n      \"ageYears\",\n    );\n  }\n  return value;\n}\n\nexport function ageBandForAgeYears(value: number): AgeBand {\n  const age = validateAgeYears(value);\n  if (age <= 5) return \"3-5\";\n  if (age <= 8) return \"6-8\";\n  if (age <= 12) return \"9-12\";\n  return \"13+\";\n}\n\nexport function validateMembershipRole(value: string): MembershipRole {")

          p = "packages/profiles/src/application/child-profile.service.ts"
          once(p,
            'import { validateAgeBand, validateDisplayName } from "../domain/validation";',
            'import {\n  ageBandForAgeYears,\n  validateAgeBand,\n  validateAgeYears,\n  validateDisplayName,\n} from "../domain/validation";')
          once(p,
            "export interface CreateChildProfileInput {\n  householdId: string;\n  displayName: string;\n  ageBand: string;\n}",
            "export interface CreateChildProfileInput {\n  householdId: string;\n  displayName: string;\n  ageBand?: string;\n  ageYears?: number;\n}")
          once(p,
            "export interface UpdateChildProfileInput {\n  displayName?: string;\n  ageBand?: string;\n}",
            "export interface UpdateChildProfileInput {\n  displayName?: string;\n  ageBand?: string;\n  ageYears?: number;\n}")
          once(p,
            "  ageBand: string;\n  locale: string;",
            "  ageBand: string;\n  ageYears: number | null;\n  locale: string;")
          once(p,
            "  validateDisplayName(input.displayName);\n  validateAgeBand(input.ageBand);\n\n  const { childRepo } = getRepos();",
            "  validateDisplayName(input.displayName);\n  const ageYears =\n    input.ageYears === undefined ? undefined : validateAgeYears(input.ageYears);\n  const ageBand =\n    ageYears === undefined\n      ? validateAgeBand(input.ageBand ?? \"\")\n      : ageBandForAgeYears(ageYears);\n\n  const { childRepo } = getRepos();")
          once(p,
            "    ageBand: input.ageBand,\n    locale: \"tr-TR\",",
            "    ageBand,\n    locale: \"tr-TR\",\n    metadata: ageYears === undefined ? {} : { ageYears },")
          text = Path(p).read_text()
          old = "    ageBand: profile.ageBand,\n    locale: profile.locale,"
          if text.count(old) != 3:
              raise SystemExit(f"{p}: expected 3 profile result mappings, got {text.count(old)}")
          text = text.replace(old, "    ageBand: profile.ageBand,\n    ageYears: profile.metadata.ageYears ?? null,\n    locale: profile.locale,")
          old = "    ageBand: p.ageBand,\n    locale: p.locale,"
          if text.count(old) != 1:
              raise SystemExit(f"{p}: expected 1 list mapping, got {text.count(old)}")
          text = text.replace(old, "    ageBand: p.ageBand,\n    ageYears: p.metadata.ageYears ?? null,\n    locale: p.locale,", 1)
          old = "  if (input.ageBand !== undefined) {\n    validateAgeBand(input.ageBand);\n  }\n\n  const { childRepo } = getRepos();\n  const profile = await childRepo.update(profileId, householdId, input);"
          new = "  if (input.ageBand !== undefined) {\n    validateAgeBand(input.ageBand);\n  }\n  if (input.ageYears !== undefined) {\n    validateAgeYears(input.ageYears);\n  }\n\n  const { childRepo } = getRepos();\n  const existing = await childRepo.findById(profileId, householdId);\n  if (!existing) throw new Error(\"Child profile not found for update\");\n  const profile = await childRepo.update(profileId, householdId, {\n    displayName: input.displayName,\n    ageBand:\n      input.ageYears === undefined\n        ? input.ageBand\n        : ageBandForAgeYears(input.ageYears),\n    metadata:\n      input.ageYears === undefined\n        ? existing.metadata\n        : { ...existing.metadata, ageYears: input.ageYears },\n  });"
          if text.count(old) != 1:
              raise SystemExit(f"{p}: update block match count {text.count(old)}")
          Path(p).write_text(text.replace(old, new, 1))

          p = "packages/profiles/src/application/generation-context.service.ts"
          once(p, "  ageBand: string;\n  locale: string;", "  ageBand: string;\n  ageYears: number | null;\n  locale: string;")
          once(p, "      ageBand: child.ageBand,\n      locale: child.locale,", "      ageBand: child.ageBand,\n      ageYears: child.ageYears,\n      locale: child.locale,")

          p = "packages/profiles/src/application/onboarding.service.ts"
          once(p, "    ageBand: string;\n  }>;", "    ageBand: string;\n    ageYears: number | null;\n  }>;")
          once(p, "      ageBand: p.ageBand,\n    })),", "      ageBand: p.ageBand,\n      ageYears: p.metadata.ageYears ?? null,\n    })),")

          p = "apps/web/app/api/child-profiles/route.ts"
          once(p,
            '      typeof parsed.displayName !== "string" ||\n      typeof parsed.ageBand !== "string"',
            '      typeof parsed.displayName !== "string" ||\n      (typeof parsed.ageYears !== "number" && typeof parsed.ageBand !== "string")')
          once(p,
            '          message: "householdId, displayName, and ageBand are required",',
            '          message: "householdId, displayName, and ageYears (or legacy ageBand) are required",')
          once(p,
            "        displayName: parsed.displayName,\n        ageBand: parsed.ageBand,",
            "        displayName: parsed.displayName,\n        ageYears:\n          typeof parsed.ageYears === \"number\" ? parsed.ageYears : undefined,\n        ageBand:\n          typeof parsed.ageBand === \"string\" ? parsed.ageBand : undefined,")

          Path(".github/workflows/tmp-exact-child-age-patch.yml").unlink()
          PY
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(profiles): carry exact child age into generation context"
          git push origin HEAD:agent/live-long-horizon-playwright-pack
