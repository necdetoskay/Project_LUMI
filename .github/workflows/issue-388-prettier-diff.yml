name: Issue 388 Prettier Diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/web/app/api/settings/test-lab/genesis/first-story-context/route.ts \
            apps/web/app/api/settings/test-lab/genesis/validation/route.ts \
            apps/web/app/app/settings/test-lab/genesis-derived-stage-panel.tsx \
            apps/web/app/app/settings/test-lab/genesis-qualification-panel.tsx
          git diff -- \
            apps/web/app/api/settings/test-lab/genesis/first-story-context/route.ts \
            apps/web/app/api/settings/test-lab/genesis/validation/route.ts \
            apps/web/app/app/settings/test-lab/genesis-derived-stage-panel.tsx \
            apps/web/app/app/settings/test-lab/genesis-qualification-panel.tsx
          exit 1
