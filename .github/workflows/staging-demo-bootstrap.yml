name: Staging Demo Bootstrap

on:
  workflow_dispatch:
    inputs:
      database_name_confirmation:
        description: "Type the exact Neon development database name (for example: neondb)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.LUMI_DEV_DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.LUMI_DEV_DATABASE_DIRECT_URL }}
      DATABASE_POOL_MAX: "2"
      NODE_ENV: test
      LUMI_DEMO_CONFIRM: lumi-demo-v1
      LUMI_DEMO_ALLOWED_DATABASE_NAME: ${{ inputs.database_name_confirmation }}
      LUMI_DEMO_PARENT_PASSWORD: ${{ secrets.LUMI_DEV_DEMO_PARENT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate staging secrets and explicit database confirmation
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "LUMI_DEV_DATABASE_URL is missing"; exit 1; }
          test -n "$DATABASE_DIRECT_URL" || { echo "LUMI_DEV_DATABASE_DIRECT_URL is missing"; exit 1; }
          test -n "$LUMI_DEMO_PARENT_PASSWORD" || { echo "LUMI_DEV_DEMO_PARENT_PASSWORD is missing"; exit 1; }
          test -n "$LUMI_DEMO_ALLOWED_DATABASE_NAME" || { echo "database_name_confirmation is required"; exit 1; }
          ACTUAL_DATABASE_NAME="$(node -e 'const u=new URL(process.env.DATABASE_URL); process.stdout.write(u.pathname.replace(/^\//, ""))')"
          test "$ACTUAL_DATABASE_NAME" = "$LUMI_DEMO_ALLOWED_DATABASE_NAME" || {
            echo "Database confirmation mismatch: expected exact database name";
            exit 1;
          }
          echo "Confirmed staging database: $ACTUAL_DATABASE_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical migrations
        run: |
          pnpm --filter @lumi/web auth:migrate
          pnpm --filter @lumi/profiles profile:migrate
          pnpm --filter @lumi/world world:migrate
          pnpm --filter @lumi/npc-intelligence npc:migrate
          pnpm --filter @lumi/story story:migrate

      - name: Seed deterministic demo universe
        run: pnpm demo:seed

      - name: Re-run seed to prove idempotency
        run: pnpm demo:seed

      - name: Verify demo status
        run: pnpm demo:status

      - name: Verify managed PostgreSQL compatibility
        run: pnpm --filter @lumi/web db:compatibility-smoke
