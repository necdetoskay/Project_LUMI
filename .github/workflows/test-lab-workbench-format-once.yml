name: Test Lab Workbench Format Once

on:
  push:
    branches:
      - feat/test-lab-workbench-runs
    paths:
      - .github/workflows/test-lab-workbench-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/test-lab-workbench-runs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format workbench files
        run: >-
          pnpm exec prettier --write
          apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx
          packages/profiles/src/application/onboarding-suggestion-generation-core.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx packages/profiles/src/application/onboarding-suggestion-generation-core.ts
          git commit -m "style(test-lab): apply prettier to workbench"
          git push origin HEAD:feat/test-lab-workbench-runs
