name: Temporary Fix PR171

on:
  push:
    branches:
      - feat/stories-ux-v2-adventure-hub

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[story-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stories-ux-v2-adventure-hub
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix Turkish possessive heading and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('apps/web/components/story/profile-stories-section.tsx')
          source = component.read_text(encoding='utf-8')
          source = source.replace(
              '  const characterName = character?.name ?? "Karakterinin";\n',
              '  const characterName = character?.name ?? "Karakterinin";\n  const adventureHeading = character\n    ? turkishPossessiveAdventureTitle(character.name)\n    : "Karakterinin Maceraları";\n',
          )
          source = source.replace(
              '              {characterName}\n              {character ? "’ın Maceraları" : " Maceraları"}\n',
              '              {adventureHeading}\n',
          )
          marker = '\nfunction AdventureHubSkeleton() {'
          helper = '''\nfunction turkishPossessiveAdventureTitle(name: string): string {\n  const lower = name.toLocaleLowerCase("tr-TR");\n  const vowels = [...lower].filter((character) =>\n    "aeıioöuü".includes(character),\n  );\n  const lastVowel = vowels.at(-1) ?? "a";\n  const suffix =\n    lastVowel === "e" || lastVowel === "i"\n      ? "in"\n      : lastVowel === "ö" || lastVowel === "ü"\n        ? "ün"\n        : lastVowel === "o" || lastVowel === "u"\n          ? "un"\n          : "ın";\n  const buffer = "aeıioöuü".includes(lower.at(-1) ?? "") ? "n" : "";\n\n  return `${name}’${buffer}${suffix} Maceraları`;\n}\n'''
          if 'function turkishPossessiveAdventureTitle' not in source:
              source = source.replace(marker, helper + marker)
          component.write_text(source, encoding='utf-8')

          test = Path('apps/web/tests/profile-stories-section.test.tsx')
          test_source = test.read_text(encoding='utf-8')
          test_source = test_source.replace('Lina’ın Maceraları', 'Lina’nın Maceraları')
          test.write_text(test_source, encoding='utf-8')
          PY
      - name: Format Stories files
        run: pnpm exec prettier --write apps/web/components/story/profile-stories-section.tsx apps/web/tests/profile-stories-section.test.tsx
      - name: Run focused Stories test
        run: pnpm --filter @lumi/web exec vitest run tests/profile-stories-section.test.tsx
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/story/profile-stories-section.tsx apps/web/tests/profile-stories-section.test.tsx
          git commit -m "fix(stories): format adventure hub and Turkish heading [story-fix-bot]"
          git push origin HEAD:feat/stories-ux-v2-adventure-hub
