name: LUMI Long-Horizon Repair Loop

on:
  push:
    branches:
      - agent/long-horizon-repair
    paths:
      - .github/workflows/lumi-long-horizon-repair.yml
      - apps/web/tests/e2e/long-horizon/**
      - apps/web/playwright.long-horizon-live.config.ts

permissions:
  contents: read

jobs:
  repair-live-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      LUMI_LONG_HORIZON_LIVE: "1"
      LUMI_LONG_HORIZON_BASE_URL: https://project-lumi-47djmdws3-necdetoskay-8234s-projects.vercel.app
      LUMI_LONG_HORIZON_CHILD_AGE: "6"
      LUMI_LONG_HORIZON_RNG_SEED: ""
      LUMI_LONG_HORIZON_RUN_ID: ""
      LUMI_LONG_HORIZON_PARENT_EMAIL: ${{ secrets.LUMI_LONG_HORIZON_PARENT_EMAIL }}
      LUMI_LONG_HORIZON_PARENT_PASSWORD: ${{ secrets.LUMI_LONG_HORIZON_PARENT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard repair credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LUMI_LONG_HORIZON_PARENT_EMAIL}"
          test -n "${LUMI_LONG_HORIZON_PARENT_PASSWORD}"
          test -n "${VERCEL_TOKEN}"
      - name: Patch first brittle locator for repair run
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts')
          text = path.read_text()
          old = '''      const newChildLink = page\n        .locator('a[href="/app/onboarding?addProfile=1"]')\n        .first();'''
          new = '''      const newChildLink = page\n        .locator('a[href^="/app/onboarding"]')\n        .filter({ hasText: /Yeni çocuk profili|New child profile/i })\n        .first();'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Create temporary Vercel automation bypass
        id: bypass
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          request="$RUNNER_TEMP/vercel-automation-bypass-generate.json"
          response="$RUNNER_TEMP/vercel-automation-bypass-response.json"
          jq -n --arg secret "$secret" '{generate:{secret:$secret,note:"Temporary LUMI long-horizon repair run"}}' > "$request"
          curl --fail-with-body --silent --show-error --request PATCH --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$request" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium
      - name: Run persistent age-6 repair acceptance
        env:
          LUMI_LONG_HORIZON_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
        run: pnpm --filter @lumi/web exec playwright test --config playwright.long-horizon-live.config.ts tests/e2e/long-horizon/baseline-onboarding.live.spec.ts
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-long-horizon-repair-6-${{ github.run_id }}
          path: apps/web/tests/e2e/long-horizon/evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Revoke temporary Vercel automation bypass
        if: always() && steps.bypass.outputs.secret != ''
        shell: bash
        env:
          AUTOMATION_SECRET: ${{ steps.bypass.outputs.secret }}
        run: |
          revoke="$RUNNER_TEMP/vercel-automation-bypass-revoke.json"
          jq -n --arg secret "$AUTOMATION_SECRET" '{revoke:{secret:$secret,regenerate:false}}' > "$revoke"
          curl --silent --show-error --request PATCH --output /dev/null \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$revoke" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" || true
