name: S38 Prettier Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format S38 files and print exact diff
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/web/tests/ultef-s38-template-versioning.v3.integration.test.ts \
            packages/story/src/application/story-template-authoring.service.ts
          git diff -- \
            apps/web/tests/ultef-s38-template-versioning.v3.integration.test.ts \
            packages/story/src/application/story-template-authoring.service.ts
