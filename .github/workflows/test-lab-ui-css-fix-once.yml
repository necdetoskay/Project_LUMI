name: Test Lab UI CSS Fix Once

on:
  push:
    branches:
      - agent/test-lab-canonical-ui-1
    paths:
      - .github/workflows/test-lab-ui-css-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-lab-canonical-ui-1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fold visual tuning into local CSS module
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path("apps/web/app/app/settings/test-lab/canonical-dashboard.module.css")
          text = css.read_text()
          marker = "/* canonical visual acceptance tuning */"
          if marker not in text:
              text += r'''

/* canonical visual acceptance tuning */
.dashboardMain {
  padding-top: 25px;
}

.pageHeader {
  min-height: 78px;
  padding-right: 0;
  padding-left: 9px;
}

.headerActions {
  padding-top: 12px;
}

.kpiGrid {
  margin-right: 62px;
  margin-left: 3px;
}

.workspaceGrid {
  grid-template-columns:
    minmax(285px, 0.99fr) minmax(570px, 1.89fr)
    minmax(290px, 1.05fr);
  margin-right: 41px;
  margin-left: 3px;
}

.recentPanel {
  margin-right: 41px;
  margin-left: 3px;
}

.recentPanel table tr {
  height: 30px;
}

.advancedLink {
  display: none;
}

.brandMark {
  position: relative;
  width: 38px;
  height: 38px;
  transform: none;
  color: transparent;
  font-size: 0;
}

.brandMark::before {
  position: absolute;
  inset: 1px;
  background: repeating-conic-gradient(
    from 0deg,
    #6d32e8 0deg 11deg,
    transparent 11deg 45deg
  );
  -webkit-mask: radial-gradient(
    circle,
    transparent 0 5px,
    #000 6px 18px,
    transparent 19px
  );
  mask: radial-gradient(
    circle,
    transparent 0 5px,
    #000 6px 18px,
    transparent 19px
  );
  content: "";
}

.brandMark::after {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #6d32e8;
  content: "";
  transform: translate(-50%, -50%);
}
'''
          css.write_text(text)

          page = Path("apps/web/app/app/settings/test-lab/page.tsx")
          page_text = page.read_text().replace(
              'import "./canonical-dashboard-tuning.module.css";\n', ""
          )
          page.write_text(page_text)

          tuning = Path("apps/web/app/app/settings/test-lab/canonical-dashboard-tuning.module.css")
          if tuning.exists():
              tuning.unlink()
          PY
          pnpm exec prettier --write \
            apps/web/app/app/settings/test-lab/canonical-dashboard.module.css \
            apps/web/app/app/settings/test-lab/page.tsx
          rm .github/workflows/test-lab-ui-css-fix-once.yml
      - name: Commit production-safe CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(test-lab): make canonical tuning production-safe"
          git push origin HEAD:agent/test-lab-canonical-ui-1
