name: Temporary Staging LLM Config Diagnostic

on:
  push:
    branches:
      - agent/live-long-horizon-fix-prep

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.LUMI_DEV_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate staging DB
        run: |
          test -n "$DATABASE_URL" || { echo "LUMI_DEV_DATABASE_URL missing"; exit 1; }
          DB_NAME="$(node -e 'const u=new URL(process.env.DATABASE_URL);process.stdout.write(u.pathname.replace(/^\//,""))')"
          test "$DB_NAME" = "neondb" || { echo "Refusing diagnostic outside neondb"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect canonical prompt and task metadata only
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';

          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
          const canonicalPromptKeys = new Set([
            'character_onboarding.character_first_identity_suggestions',
            'character_onboarding.world_suggestions',
            'character_onboarding.compatibility',
            'character_onboarding.region_suggestions',
            'character_onboarding.character_origin_suggestions',
            'character_onboarding.core_saga',
          ]);
          const canonicalTaskTypes = new Set([
            'character_identity_suggestions',
            'character_world_suggestions',
            'character_world_compatibility',
            'character_region_suggestions',
            'character_origin_suggestions',
            'character_core_saga',
          ]);

          try {
            const tables = await pool.query(`
              SELECT table_name
              FROM information_schema.tables
              WHERE table_schema = 'profile'
                AND (table_name ILIKE '%prompt%' OR table_name ILIKE '%llm_task%')
              ORDER BY table_name
            `);
            console.log('Relevant profile tables:', tables.rows.map((row) => row.table_name).join(', '));

            for (const table of tables.rows.map((row) => row.table_name)) {
              const cols = await pool.query(
                `SELECT column_name FROM information_schema.columns WHERE table_schema='profile' AND table_name=$1 ORDER BY ordinal_position`,
                [table],
              );
              const columnNames = cols.rows.map((row) => row.column_name);
              const safeColumns = columnNames.filter((name) =>
                /(^id$|key|scope|active|status|version|model|enabled|task_type|provider|household_id|user_id)/i.test(name) &&
                !/secret|encrypted|api_key/i.test(name),
              );
              console.log(`TABLE ${table} SAFE_COLUMNS ${safeColumns.join(',')}`);
              if (safeColumns.length === 0) continue;

              const quoted = safeColumns.map((name) => `"${name.replaceAll('"', '""')}"`).join(', ');
              const result = await pool.query(`SELECT ${quoted} FROM profile."${table.replaceAll('"', '""')}" LIMIT 500`);
              const filtered = result.rows.filter((row) => {
                const key = String(row.prompt_key ?? row.key ?? '');
                const task = String(row.task_type ?? '');
                return canonicalPromptKeys.has(key) || canonicalTaskTypes.has(task);
              });
              if (filtered.length > 0) {
                console.log(`TABLE ${table} CANONICAL_ROWS ${JSON.stringify(filtered)}`);
              }
            }
          } finally {
            await pool.end();
          }
          NODE
