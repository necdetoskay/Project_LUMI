name: Referential Integrity Inventory

on:
  push:
    branches:
      - audit/referential-integrity-inventory

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumi_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumi_integrity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap exact effective schema from zero
        env:
          VERCEL_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs

      - name: PostgreSQL PK FK UNIQUE inventory
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off
          \pset border 0
          \pset footer off

          \echo '=== AUDIT_SUMMARY ==='
          WITH user_tables AS (
            SELECT c.oid, n.nspname AS schema_name, c.relname AS table_name
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind = 'r'
              AND n.nspname NOT IN ('pg_catalog', 'information_schema')
              AND n.nspname !~ '^pg_toast'
          ), relation_columns AS (
            SELECT t.oid, t.schema_name, t.table_name, a.attnum, a.attname AS column_name
            FROM user_tables t
            JOIN pg_attribute a ON a.attrelid = t.oid
            WHERE a.attnum > 0
              AND NOT a.attisdropped
              AND a.attname ~ '_id$'
          )
          SELECT jsonb_pretty(jsonb_build_object(
            'tables', (SELECT count(*) FROM user_tables),
            'tables_without_pk', (
              SELECT count(*) FROM user_tables t
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_constraint c
                WHERE c.conrelid = t.oid AND c.contype = 'p'
              )
            ),
            'relation_like_id_columns', (SELECT count(*) FROM relation_columns),
            'relation_like_id_columns_without_fk', (
              SELECT count(*) FROM relation_columns r
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_constraint c
                WHERE c.conrelid = r.oid
                  AND c.contype = 'f'
                  AND r.attnum = ANY(c.conkey)
              )
            )
          ));

          \echo '=== TABLES_WITHOUT_PRIMARY_KEY ==='
          WITH user_tables AS (
            SELECT c.oid, n.nspname AS schema_name, c.relname AS table_name
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind = 'r'
              AND n.nspname NOT IN ('pg_catalog', 'information_schema')
              AND n.nspname !~ '^pg_toast'
          )
          SELECT schema_name || '.' || table_name AS table_name
          FROM user_tables t
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_constraint c
            WHERE c.conrelid = t.oid AND c.contype = 'p'
          )
          ORDER BY 1;

          \echo '=== RELATION_LIKE_ID_COLUMNS_WITHOUT_FK ==='
          WITH user_tables AS (
            SELECT c.oid, n.nspname AS schema_name, c.relname AS table_name
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind = 'r'
              AND n.nspname NOT IN ('pg_catalog', 'information_schema')
              AND n.nspname !~ '^pg_toast'
          ), relation_columns AS (
            SELECT
              t.oid,
              t.schema_name,
              t.table_name,
              a.attnum,
              a.attname AS column_name,
              format_type(a.atttypid, a.atttypmod) AS data_type,
              NOT a.attnotnull AS nullable
            FROM user_tables t
            JOIN pg_attribute a ON a.attrelid = t.oid
            WHERE a.attnum > 0
              AND NOT a.attisdropped
              AND a.attname ~ '_id$'
          )
          SELECT
            r.schema_name || '.' || r.table_name AS table_name,
            r.column_name,
            r.data_type,
            r.nullable,
            EXISTS (
              SELECT 1 FROM pg_index i
              WHERE i.indrelid = r.oid
                AND r.attnum = ANY(i.indkey::smallint[])
            ) AS indexed
          FROM relation_columns r
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_constraint c
            WHERE c.conrelid = r.oid
              AND c.contype = 'f'
              AND r.attnum = ANY(c.conkey)
          )
          ORDER BY 1, 2;

          \echo '=== ALL_FOREIGN_KEYS ==='
          SELECT
            n.nspname || '.' || cl.relname AS table_name,
            c.conname AS constraint_name,
            pg_get_constraintdef(c.oid, true) AS definition
          FROM pg_constraint c
          JOIN pg_class cl ON cl.oid = c.conrelid
          JOIN pg_namespace n ON n.oid = cl.relnamespace
          WHERE c.contype = 'f'
            AND n.nspname NOT IN ('pg_catalog', 'information_schema')
          ORDER BY 1, 2;

          \echo '=== UNIQUE_AND_PRIMARY_INDEXES ==='
          SELECT
            n.nspname || '.' || t.relname AS table_name,
            i.relname AS index_name,
            ix.indisprimary AS is_primary,
            pg_get_indexdef(ix.indexrelid) AS definition
          FROM pg_index ix
          JOIN pg_class t ON t.oid = ix.indrelid
          JOIN pg_class i ON i.oid = ix.indexrelid
          JOIN pg_namespace n ON n.oid = t.relnamespace
          WHERE ix.indisunique
            AND n.nspname NOT IN ('pg_catalog', 'information_schema')
            AND n.nspname !~ '^pg_toast'
          ORDER BY 1, 2;

          \echo '=== MULTI_SCOPE_TABLES_WITHOUT_COMPOSITE_FK ==='
          WITH scope_columns(column_name) AS (
            VALUES
              ('household_id'),
              ('child_profile_id'),
              ('world_id'),
              ('npc_id'),
              ('character_id'),
              ('region_id'),
              ('location_id'),
              ('story_session_id')
          ), table_scope_columns AS (
            SELECT
              c.oid AS table_oid,
              n.nspname AS schema_name,
              c.relname AS table_name,
              a.attnum,
              a.attname AS column_name
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_attribute a ON a.attrelid = c.oid
            JOIN scope_columns s ON s.column_name = a.attname
            WHERE c.relkind = 'r'
              AND a.attnum > 0
              AND NOT a.attisdropped
              AND n.nspname NOT IN ('pg_catalog', 'information_schema')
              AND n.nspname !~ '^pg_toast'
          ), pairs AS (
            SELECT
              a.table_oid,
              a.schema_name,
              a.table_name,
              a.attnum AS left_attnum,
              b.attnum AS right_attnum,
              a.column_name AS left_column,
              b.column_name AS right_column
            FROM table_scope_columns a
            JOIN table_scope_columns b
              ON b.table_oid = a.table_oid
             AND b.attnum > a.attnum
          )
          SELECT
            p.schema_name || '.' || p.table_name AS table_name,
            p.left_column,
            p.right_column,
            EXISTS (
              SELECT 1
              FROM pg_constraint c
              WHERE c.conrelid = p.table_oid
                AND c.contype = 'f'
                AND p.left_attnum = ANY(c.conkey)
                AND p.right_attnum = ANY(c.conkey)
            ) AS protected_by_same_fk
          FROM pairs p
          WHERE NOT EXISTS (
            SELECT 1
            FROM pg_constraint c
            WHERE c.conrelid = p.table_oid
              AND c.contype = 'f'
              AND p.left_attnum = ANY(c.conkey)
              AND p.right_attnum = ANY(c.conkey)
          )
          ORDER BY 1, 2, 3;
          SQL
