name: Referential Integrity Inventory

on:
  push:
    branches:
      - audit/referential-integrity-inventory

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumi_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumi_integrity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap exact effective schema from zero
        env:
          VERCEL_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs

      - name: Classify FK-less UUID relation candidates
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off
          \pset border 0
          \pset footer off

          \echo '=== UUID_MISSING_FK_BY_SCHEMA ==='
          WITH missing AS (
            SELECT
              c.oid AS table_oid,
              n.nspname AS schema_name,
              c.relname AS table_name,
              a.attnum,
              a.attname AS column_name,
              regexp_replace(a.attname, '_id$', '') AS base_name
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_attribute a ON a.attrelid = c.oid
            WHERE c.relkind = 'r'
              AND n.nspname NOT IN ('pg_catalog', 'information_schema')
              AND n.nspname !~ '^pg_toast'
              AND a.attnum > 0
              AND NOT a.attisdropped
              AND a.atttypid = 'uuid'::regtype
              AND a.attname ~ '_id$'
              AND NOT EXISTS (
                SELECT 1 FROM pg_constraint fk
                WHERE fk.conrelid = c.oid
                  AND fk.contype = 'f'
                  AND a.attnum = ANY(fk.conkey)
              )
          ), classified AS (
            SELECT m.*,
              EXISTS (
                SELECT 1 FROM pg_attribute d
                WHERE d.attrelid = m.table_oid
                  AND d.attnum > 0
                  AND NOT d.attisdropped
                  AND d.attname IN (m.base_name || '_type', m.base_name || '_kind')
              ) AS has_discriminator
            FROM missing m
          )
          SELECT
            schema_name,
            count(*) AS uuid_columns_without_fk,
            count(*) FILTER (WHERE has_discriminator) AS polymorphic_with_discriminator,
            count(*) FILTER (WHERE NOT has_discriminator) AS direct_or_unclassified
          FROM classified
          GROUP BY schema_name
          ORDER BY uuid_columns_without_fk DESC, schema_name;

          \echo '=== UUID_MISSING_FK_CANDIDATES ==='
          WITH missing AS (
            SELECT
              c.oid AS table_oid,
              n.nspname AS schema_name,
              c.relname AS table_name,
              a.attnum,
              a.attname AS column_name,
              NOT a.attnotnull AS nullable,
              regexp_replace(a.attname, '_id$', '') AS base_name
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_attribute a ON a.attrelid = c.oid
            WHERE c.relkind = 'r'
              AND n.nspname NOT IN ('pg_catalog', 'information_schema')
              AND n.nspname !~ '^pg_toast'
              AND a.attnum > 0
              AND NOT a.attisdropped
              AND a.atttypid = 'uuid'::regtype
              AND a.attname ~ '_id$'
              AND NOT EXISTS (
                SELECT 1 FROM pg_constraint fk
                WHERE fk.conrelid = c.oid
                  AND fk.contype = 'f'
                  AND a.attnum = ANY(fk.conkey)
              )
          )
          SELECT
            m.schema_name || '.' || m.table_name AS table_name,
            m.column_name,
            m.nullable,
            EXISTS (
              SELECT 1 FROM pg_index i
              WHERE i.indrelid = m.table_oid
                AND m.attnum = ANY(i.indkey::smallint[])
            ) AS indexed,
            EXISTS (
              SELECT 1 FROM pg_attribute d
              WHERE d.attrelid = m.table_oid
                AND d.attnum > 0
                AND NOT d.attisdropped
                AND d.attname IN (m.base_name || '_type', m.base_name || '_kind')
            ) AS has_discriminator
          FROM missing m
          ORDER BY 1, 2;

          \echo '=== LIKELY_DIRECT_INTERNAL_RELATIONS_WITHOUT_FK ==='
          WITH missing AS (
            SELECT
              c.oid AS table_oid,
              n.nspname AS schema_name,
              c.relname AS table_name,
              a.attnum,
              a.attname AS column_name,
              NOT a.attnotnull AS nullable
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_attribute a ON a.attrelid = c.oid
            WHERE c.relkind = 'r'
              AND n.nspname NOT IN ('pg_catalog', 'information_schema')
              AND n.nspname !~ '^pg_toast'
              AND a.attnum > 0
              AND NOT a.attisdropped
              AND a.atttypid = 'uuid'::regtype
              AND a.attname IN (
                'household_id', 'actor_household_id',
                'child_profile_id',
                'world_id',
                'npc_id', 'source_npc_id', 'target_npc_id',
                'character_id',
                'location_id', 'from_location_id', 'to_location_id', 'active_location_id',
                'home_id',
                'story_session_id',
                'scene_id', 'evidence_scene_id', 'generated_scene_id',
                'current_published_version_id',
                'supersedes_memory_id', 'memory_id',
                'trace_id',
                'user_id', 'consumed_by_user_id', 'actor_user_id',
                'source_hook_id',
                'active_branch_id', 'created_by_run_id'
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_constraint fk
                WHERE fk.conrelid = c.oid
                  AND fk.contype = 'f'
                  AND a.attnum = ANY(fk.conkey)
              )
          )
          SELECT
            schema_name || '.' || table_name AS table_name,
            column_name,
            nullable,
            CASE
              WHEN column_name IN ('household_id', 'actor_household_id') THEN 'profile.households(id)'
              WHEN column_name = 'child_profile_id' THEN 'profile.child_profiles(id)'
              WHEN column_name = 'world_id' THEN 'profile.worlds(id)'
              WHEN column_name IN ('npc_id', 'source_npc_id', 'target_npc_id') THEN 'profile.world_npcs(character_id)'
              WHEN column_name = 'character_id' THEN 'profile.lumi_characters(id)'
              WHEN column_name IN ('location_id', 'from_location_id', 'to_location_id', 'active_location_id') THEN 'profile.world_locations(id)'
              WHEN column_name = 'home_id' THEN 'profile.world_homes(id)'
              WHEN column_name = 'story_session_id' THEN 'story.story_sessions(id)'
              WHEN column_name IN ('scene_id', 'evidence_scene_id', 'generated_scene_id') THEN 'story.story_scenes(id)'
              WHEN column_name = 'current_published_version_id' THEN 'story.story_versions(id)'
              WHEN column_name IN ('supersedes_memory_id', 'memory_id') THEN 'npc_intelligence.memories(id)'
              WHEN column_name = 'trace_id' THEN 'npc_intelligence.decision_traces(id)'
              WHEN column_name IN ('user_id', 'consumed_by_user_id', 'actor_user_id') THEN 'public.parent_accounts(id)'
              WHEN column_name = 'source_hook_id' THEN 'story.story_hooks(id)'
              WHEN column_name = 'active_branch_id' THEN 'ai.test_lab_branches(id)'
              WHEN column_name = 'created_by_run_id' THEN 'ai.test_lab_runs(id)'
              ELSE '?'
            END AS likely_target
          FROM missing
          ORDER BY 1, 2;
          SQL
