name: One-shot landing fix formatter

on:
  push:
    branches:
      - fix/landing-webp-binary-assets

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/landing-webp-binary-assets
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format landing repair files
        run: |
          pnpm exec prettier --write apps/web/package.json apps/web/scripts/prepare-landing-assets.mjs apps/web/tests/landing-assets-packaging.test.ts
          git rm .github/workflows/format-landing-fix.yml
      - name: Commit formatted result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/scripts/prepare-landing-assets.mjs apps/web/tests/landing-assets-packaging.test.ts .github/workflows/format-landing-fix.yml
          git commit -m "style(landing): apply repository prettier format"
          git push origin HEAD:fix/landing-webp-binary-assets
