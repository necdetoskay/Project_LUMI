name: S43 Prettier Fix

on:
  push:
    branches: [s43/current-life-child-navigation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s43/current-life-child-navigation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: pnpm exec prettier --write apps/web/components/character/profile-character-detail-section.tsx apps/web/tests/e2e/ultef-s43-current-life.spec.ts .github/workflows/ultef-s43-current-life.yml
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/character/profile-character-detail-section.tsx apps/web/tests/e2e/ultef-s43-current-life.spec.ts .github/workflows/ultef-s43-current-life.yml
          git commit -m "style(s43): apply repository prettier output"
          git push origin HEAD:s43/current-life-child-navigation
