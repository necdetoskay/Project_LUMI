name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "3 4 * * 1"
permissions:
  contents: read
jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Gitleaks needs read access to secrets and pull-requests for reporting.
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependency audit: runs non-blocking (continue-on-error). Existing
      # pre-S19 findings are tracked separately in the S19-T02 backlog; this
      # step surfaces NEW critical/high-introducing changes in CI logs + PR
      # comments without blocking merges. pnpm audit exits non-zero on any
      # advisory, hence the guard.
      - name: Run pnpm audit (collect JSON)
        id: pnpm-audit
        continue-on-error: true
        run: |
          pnpm audit --json --no-color > pnpm-audit.json || true

      - name: Comment audit summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "pnpm-audit.json";
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) {
              console.log("No audit JSON produced; skipping comment.");
              return;
            }
            let audit;
            try { audit = JSON.parse(fs.readFileSync(path, "utf8")); }
            catch (e) { console.log("audit JSON parse failed: " + e.message); return; }
            // pnpm audit output shape: { advisories: { id -> { severity } }, vulnerabilities: { pkg -> { severity } } }
            const collect = (obj) => {
              const out = { critical: 0, high: 0 };
              if (obj && typeof obj === "object") {
                for (const v of Object.values(obj)) {
                  if (v && typeof v.severity === "string") {
                    if (v.severity === "critical") out.critical++;
                    else if (v.severity === "high") out.high++;
                  }
                }
              }
              return out;
            };
            const sev = collect(audit.vulnerabilities);
            const a = collect(audit.advisories);
            const critical = Math.max(sev.critical, a.critical);
            const high = Math.max(sev.high, a.high);
            const body = [
              "## :shield: Dependency audit summary",
              "",
              `critical: ${critical} | high: ${high}`,
              "",
              "> Pre-existing findings do not block merge (tracked separately in S19-T02 backlog); new critical/high findings must be resolved.",
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # Secret scanning: blocks on any committed secret. Uses gitleaks'
      # built-in ruleset plus a local allow-list (.gitleaks.toml) for
      # documented placeholders in .env.example / fixtures.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          fail: true
          verbose: true

      # Container image scanning (the web Dockerfile in infra/compose).
      # Builds then scans the published web image. Only runs on default
      # branch / PR to main to avoid redundant builds.
      - name: Build web image
        run: |
          docker build -f Dockerfile -t lumi-web:scan .
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lumi-web:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: false
      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-security-sarif@v3
        with:
          sarif_file: trivy-results.sarif
