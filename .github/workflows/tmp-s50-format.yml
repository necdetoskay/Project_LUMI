name: Temporary S50 Formatter

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/npc-intelligence/src/application/npc-relationship-applicator.service.ts packages/npc-intelligence/src/db/repositories/drizzle/drizzle-npc-snapshot.repository.ts services/worker/src/npc-action-outbox-registry.ts services/worker/tests/ultef-s50-npc-action-effect-registry.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/npc-intelligence/src/application/npc-relationship-applicator.service.ts packages/npc-intelligence/src/db/repositories/drizzle/drizzle-npc-snapshot.repository.ts services/worker/src/npc-action-outbox-registry.ts services/worker/tests/ultef-s50-npc-action-effect-registry.integration.test.ts
          git commit -m "style(s50): apply repository prettier"
          git push
