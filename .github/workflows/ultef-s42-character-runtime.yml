name: ULTEF S42 Character Runtime Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium
      - name: Run S42 runtime contract
        run: pnpm --filter @lumi/web exec playwright test tests/ultef-s42-character-runtime.spec.ts --project=chromium
