name: Temporary M8 Prettier Fix

on:
  push:
    branches:
      - agent/onboarding-m8-ci-ultef
    paths:
      - .github/workflows/tmp-m8-prettier.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-m8-ci-ultef
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format reporter
        run: pnpm exec prettier --write apps/web/scripts/extract-onboarding-live-report.mjs
      - name: Verify formatting
        run: pnpm exec prettier --check apps/web/scripts/extract-onboarding-live-report.mjs
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/tmp-m8-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/extract-onboarding-live-report.mjs .github/workflows/tmp-m8-prettier.yml
          git commit -m "style(onboarding): apply repository prettier"
          git push origin HEAD:agent/onboarding-m8-ci-ultef
