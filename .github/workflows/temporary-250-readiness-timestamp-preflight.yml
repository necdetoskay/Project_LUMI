name: Temporary 250 Readiness Timestamp Preflight

on:
  push:
    branches:
      - fix/250-adventure-readiness-serialized-timestamp
    paths:
      - .github/workflows/temporary-250-readiness-timestamp-preflight.yml

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_stories_ux_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_stories_ux_browser_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_stories_ux_browser_test
      PROFILE_DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_stories_ux_browser_test
      STORY_TEST_DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_stories_ux_browser_test
      LUMI_SETTINGS_ENCRYPTION_KEY: lumi-stories-playwright-encryption-key
      NODE_ENV: test
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Record preflight identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment 250 --repo "$GITHUB_REPOSITORY"
          --body "Readiness timestamp preflight started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (head $GITHUB_SHA). Disposable DB/mock browser only; no production mutation or paid model call."

      - name: Check changed-file formatting
        run: >-
          pnpm exec prettier --check
          apps/web/lib/stories/adventure-readiness.ts
          apps/web/tests/adventure-readiness.test.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run readiness timestamp regression
        run: >-
          pnpm --filter @lumi/web exec vitest run
          tests/adventure-readiness.test.ts

      - name: Guard disposable database
        run: |
          node <<'NODE'
          const db = new URL(process.env.DATABASE_URL);
          const name = db.pathname.replace(/^\//, '').toLowerCase();
          if (!name.includes('test') && !name.includes('review')) {
            console.error(`Refusing Stories browser E2E against non-test database: ${name}`);
            process.exit(1);
          }
          console.log(`Stories disposable DB guard passed: ${name}`);
          NODE

      - name: Apply auth migration
        run: pnpm --filter @lumi/web auth:migrate

      - name: Apply profile migrations
        run: pnpm --filter @lumi/profiles profile:migrate

      - name: Harden Ubuntu apt mirror for Playwright
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update

      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium

      - name: Run Stories UX v2 browser journey
        run: pnpm --filter @lumi/web exec playwright test tests/e2e/stories-ux-v2.spec.ts

      - name: Record final preflight status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: >-
          gh issue comment 250 --repo "$GITHUB_REPOSITORY"
          --body "Readiness timestamp preflight finished **$JOB_STATUS**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
