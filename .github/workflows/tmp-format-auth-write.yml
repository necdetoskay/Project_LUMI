name: Temporary Format Auth Diagnostic

on:
  push:
    branches:
      - ops/vercel-auth-write-diagnostic

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/vercel-auth-write-diagnostic
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/api/health/auth-runtime/route.ts
      - name: Commit formatted file and remove temporary workflow
        run: |
          rm .github/workflows/tmp-format-auth-write.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/api/health/auth-runtime/route.ts .github/workflows/tmp-format-auth-write.yml
          git commit -m "style: format auth write diagnostic" || exit 0
          git push origin HEAD:ops/vercel-auth-write-diagnostic
