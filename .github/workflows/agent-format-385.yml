name: Agent Format 385

on:
  push:
    branches:
      - agent/385-memory-seeds-origin-threads

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/385-memory-seeds-origin-threads
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format #385 files
        run: |
          pnpm exec prettier --write \
            apps/web/app/api/settings/test-lab/genesis/memory-threads/route.ts \
            apps/web/app/app/settings/test-lab/memory-thread-genesis-test-panel.tsx \
            packages/profiles/src/application/memory-thread-genesis-context-projection.test.ts \
            packages/profiles/src/application/memory-thread-genesis.service.test.ts \
            packages/profiles/src/domain/memory-thread-genesis.test.ts \
            packages/profiles/src/domain/memory-thread-genesis.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/app/api/settings/test-lab/genesis/memory-threads/route.ts \
            apps/web/app/app/settings/test-lab/memory-thread-genesis-test-panel.tsx \
            packages/profiles/src/application/memory-thread-genesis-context-projection.test.ts \
            packages/profiles/src/application/memory-thread-genesis.service.test.ts \
            packages/profiles/src/domain/memory-thread-genesis.test.ts \
            packages/profiles/src/domain/memory-thread-genesis.ts
          git commit -m "style(genesis): format memory thread implementation"
          git push origin HEAD:agent/385-memory-seeds-origin-threads
