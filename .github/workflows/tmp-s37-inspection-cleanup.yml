name: Temporary S37 Inspector Cleanup

on:
  push:
    branches:
      - agent/context-production-e2e-workflow
    paths:
      - .github/workflows/tmp-s37-inspection-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-production-e2e-workflow
      - name: Insert generation inspection cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/tests/ultef-s37-hook-reader-production.v3.integration.test.ts")
          text = path.read_text()
          marker = '''    } finally {\n      await pool.query(\n        `DELETE FROM story.story_idempotency_ledger WHERE household_id IN($1,$2)`,'''
          replacement = '''    } finally {\n      await pool.query(\n        `DELETE FROM story.story_generation_inspections WHERE story_session_id=$1`,\n        [session],\n      );\n      await pool.query(\n        `DELETE FROM story.story_idempotency_ledger WHERE household_id IN($1,$2)`,'''
          if replacement in text:
              print("Cleanup already present.")
          elif marker not in text:
              raise SystemExit("Expected S37 cleanup marker not found")
          else:
              path.write_text(text.replace(marker, replacement, 1))
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/ultef-s37-hook-reader-production.v3.integration.test.ts
          git commit -m "test(story): clean S37 generation inspections"
          git push origin HEAD:agent/context-production-e2e-workflow
