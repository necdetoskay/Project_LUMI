name: Temporary Child Dashboard Phase A

on:
  push:
    branches:
      - feat/child-dashboard-v1-shell

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[child-dashboard-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/child-dashboard-v1-shell
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/app/profiles/'[childProfileId]'/child-dashboard-client-page.tsx apps/web/app/app/profiles/'[childProfileId]'/page.tsx
      - run: pnpm --filter @lumi/web exec eslint app/app/profiles/'[childProfileId]'/child-dashboard-client-page.tsx app/app/profiles/'[childProfileId]'/page.tsx --max-warnings=0
      - run: pnpm --filter @lumi/web typecheck
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/profiles/'[childProfileId]'/child-dashboard-client-page.tsx apps/web/app/app/profiles/'[childProfileId]'/page.tsx
          git commit -m "style(child-dashboard): format phase A shell [child-dashboard-bot]"
          git push origin HEAD:feat/child-dashboard-v1-shell
