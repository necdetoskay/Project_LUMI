name: tmp phase4 typefix

on:
  push:
    branches:
      - agent/character-genesis-phase4-saga-foundation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/character-genesis-phase4-saga-foundation
      - name: Apply exact optional provenance fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/profiles/src/application/saga-foundation.service.ts')
          s = p.read_text()
          old = '''    provider: route.provider,\n    requestId: deps.promptProvenance.requestId,\n    rngSeed: deps.promptProvenance.rngSeed,\n    generatedAt: now,\n'''
          new = '''    provider: route.provider,\n    ...(deps.promptProvenance.requestId\n      ? { requestId: deps.promptProvenance.requestId }\n      : {}),\n    ...(deps.promptProvenance.rngSeed\n      ? { rngSeed: deps.promptProvenance.rngSeed }\n      : {}),\n    generatedAt: now,\n'''
          if old not in s:
              raise SystemExit('target provenance block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profiles/src/application/saga-foundation.service.ts
          git commit -m "fix(genesis): omit undefined saga provenance fields"
          git push origin HEAD:agent/character-genesis-phase4-saga-foundation
