name: Temporary Patch M7 Deferred Bootstrap
on:
  push:
    branches:
      - fix/finalize-bootstrap-critical-path
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-bootstrap-critical-path
      - name: Patch M7 assertions for deferred bootstrap
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/web/tests/e2e/character-onboarding-m7.spec.ts')
          s = p.read_text()
          s = s.replace(
              'import { expect, test, type BrowserContext, type Page } from "@playwright/test";\n',
              'import { expect, test, type BrowserContext, type Page } from "@playwright/test";\n\nimport { getCharacterFoundationByCharacterId } from "@lumi/profiles";\n',
          )
          old = '''    expect(committed.bootstrap.status).toBe("completed");
    expect(committed.bootstrap.manifestStatus).toBe("completed");
    expect(committed.bootstrap.idempotencyKey).toMatch(
      /^living-world-bootstrap:/,
    );
    expect(committed.bootstrap.roleCount).toBeGreaterThan(0);
    expect(committed.bootstrap.materialized).toEqual(
      expect.arrayContaining([
        expect.objectContaining({
          kind: "npc",
          authority: "profile.lumi_characters",
        }),
        expect.objectContaining({
          kind: "relationship",
          authority: "profile.character_relationships",
        }),
      ]),
    );
'''
          new = '''    expect(committed.bootstrap.status).toBe("pending");
    expect(committed.bootstrap.manifestStatus).toBe("pending");
    expect(committed.bootstrap.idempotencyKey).toMatch(
      /^living-world-bootstrap:/,
    );

    await expect
      .poll(
        async () =>
          (await getCharacterFoundationByCharacterId(committed.characterId))
            ?.bootstrapManifest?.status ?? "missing",
        { timeout: 30_000 },
      )
      .toBe("completed");
    const completedFoundation = await getCharacterFoundationByCharacterId(
      committed.characterId,
    );
    const completedManifest = completedFoundation?.bootstrapManifest;
    expect(completedManifest?.idempotencyKey).toBe(
      committed.bootstrap.idempotencyKey,
    );
    expect(completedManifest?.materialized).toEqual(
      expect.arrayContaining([
        expect.objectContaining({
          kind: "npc",
          authority: "profile.lumi_characters",
        }),
        expect.objectContaining({
          kind: "relationship",
          authority: "profile.character_relationships",
        }),
      ]),
    );
    const materializedBeforeRetry = [...(completedManifest?.materialized ?? [])]
      .map((ref) => `${ref.kind}:${ref.entityId}`)
      .sort();
'''
          if old not in s:
              raise SystemExit('initial bootstrap assertion block not found')
          s = s.replace(old, new, 1)
          old2 = '''    expect(retried.bootstrap.status).toBe("completed");
    expect(retried.bootstrap.manifestStatus).toBe("completed");
    expect(retried.bootstrap.idempotencyKey).toBe(
      committed.bootstrap.idempotencyKey,
    );
    expect(retried.bootstrap.roleCount).toBe(committed.bootstrap.roleCount);
    expect(
      retried.bootstrap.materialized
        .map((ref) => `${ref.kind}:${ref.entityId}`)
        .sort(),
    ).toEqual(
      committed.bootstrap.materialized
        .map((ref) => `${ref.kind}:${ref.entityId}`)
        .sort(),
    );
'''
          new2 = '''    expect(retried.bootstrap.status).toBe("pending");
    expect(retried.bootstrap.manifestStatus).toBe("pending");
    expect(retried.bootstrap.idempotencyKey).toBe(
      committed.bootstrap.idempotencyKey,
    );

    await expect
      .poll(
        async () =>
          (await getCharacterFoundationByCharacterId(retried.characterId))
            ?.bootstrapManifest?.status ?? "missing",
        { timeout: 30_000 },
      )
      .toBe("completed");
    const foundationAfterRetry = await getCharacterFoundationByCharacterId(
      retried.characterId,
    );
    expect(
      [...(foundationAfterRetry?.bootstrapManifest?.materialized ?? [])]
        .map((ref) => `${ref.kind}:${ref.entityId}`)
        .sort(),
    ).toEqual(materializedBeforeRetry);
'''
          if old2 not in s:
              raise SystemExit('retry bootstrap assertion block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/character-onboarding-m7.spec.ts
          git commit -m "test(onboarding): verify deferred bootstrap completion"
          git push origin HEAD:fix/finalize-bootstrap-critical-path
