name: Temporary Phase 6 Evaluation Prettier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/test-lab-phase-6-evaluation-engine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format evaluation domain only
        run: pnpm exec prettier --write packages/ai/src/test-lab/domain/evaluation.ts
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet -- packages/ai/src/test-lab/domain/evaluation.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/test-lab/domain/evaluation.ts
          git commit -m "style(test-lab): format evaluation domain"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
