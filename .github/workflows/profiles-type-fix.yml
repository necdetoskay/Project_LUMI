name: Profiles Strict Type Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/profiles-canonical-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profiles-canonical-ui
          fetch-depth: 0
      - name: Apply exact optional property fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/app/profiles/profiles-client-page.tsx')
          text = path.read_text()
          old = 'className={styles.characterImage}'
          new = 'className={styles.characterImage!}'
          if old not in text:
              raise SystemExit('target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/profiles/profiles-client-page.tsx
          git commit -m "fix(profiles): satisfy strict CSS module typing"
          git push origin HEAD:agent/profiles-canonical-ui
