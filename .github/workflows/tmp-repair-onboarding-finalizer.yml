name: Temporary Onboarding Finalizer Repair
on:
  push:
    branches: [agent/character-onboarding-live-e2e]
    paths: [.github/workflows/tmp-repair-onboarding-finalizer.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last verified finalizer and retain optional compatibility field
        shell: bash
        run: |
          git show aced7171bc9bb1388fbb338315b090333a78e2c3:packages/profiles/src/application/character-foundation-onboarding.service.ts > packages/profiles/src/application/character-foundation-onboarding.service.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/profiles/src/application/character-foundation-onboarding.service.ts')
          s=p.read_text()
          s=s.replace('adaptationPremise: string;', 'adaptationPremise?: string;')
          p.write_text(s)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/profiles/src/application/character-foundation-onboarding.service.ts
      - run: pnpm --filter @lumi/profiles typecheck
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/profiles/src/application/character-foundation-onboarding.service.ts
          git commit -m 'fix(onboarding): restore verified foundation finalizer'
          git push
