name: Agent Format Fix

on:
  push:
    branches:
      - feat/neon-compatibility-spike-prep

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/neon-compatibility-spike-prep
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/scripts/db-provider-compatibility-smoke.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/db-provider-compatibility-smoke.mjs
          git commit -m "style(db): apply repository prettier output"
          git push origin HEAD:feat/neon-compatibility-spike-prep
