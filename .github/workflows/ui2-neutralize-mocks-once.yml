name: UI2 Neutralize Mocks Once

on:
  push:
    branches:
      - agent/test-lab-canonical-ui-2
    paths:
      - .github/workflows/ui2-neutralize-mocks-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-lab-canonical-ui-2
      - name: Neutralize future-phase mock content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/app/app/settings/test-lab/canonical-dashboard.tsx')
          text = path.read_text()

          text = re.sub(
              r'const qualityMetrics = \[.*?\] as const;',
              '''const qualityMetrics = [
            { label: "Bütünlük", score: 0, pending: true },
            { label: "Duygusal Etki", score: 0, pending: true },
            { label: "Yaratıcılık", score: 0, pending: true },
            { label: "Merak", score: 0, pending: true },
            { label: "Karakter Tutarlılığı", score: 0, pending: true },
            { label: "Güvenlik", score: 0, pending: true },
          ] as const;''',
              text,
              count=1,
              flags=re.S,
          )

          text = re.sub(
              r'\s*<path\n\s*d="M42 83.*?</polyline>\n\s*\{\[.*?\}\)}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              '''          <div className={styles.chartAxis}>
            <span>14:35</span>
            <span>14:38</span>
            <span>14:41</span>
            <span>14:44</span>
            <span>14:47</span>
            <span>14:50 (tahmini)</span>
          </div>''',
              '''          <div className={styles.chartAxis}>
            <span>—</span>
            <span>—</span>
            <span>—</span>
            <span>—</span>
            <span>—</span>
            <span>UI-3</span>
          </div>'''
          )

          text = text.replace(
              '''              <b>
                {metric.score} <small>/100</small>
              </b>''',
              '''              <b>
                {metric.pending ? "—" : metric.score} <small>/100</small>
              </b>'''
          )
          text = text.replace(
              '''              <span
                className={metric.tone === "amber" ? styles.qualityAmber : ""}
                style={{ width: `${metric.score}%` }}
              />''',
              '''              <span style={{ width: `${metric.score}%` }} />'''
          )

          text = text.replace(
              '''      <span className={styles.aiBadge}>AI Önerisi</span>
      <p>
        Hikayelerde merak unsurunu artırmak için sorularla biten kısa bölümler
        ekleyin. Karakter motivasyonlarını daha belirgin göstermek için iç
        monolog veya kısa diyaloglarla derinlik katın.
      </p>''',
              '''      <span className={styles.aiBadge}>UI-4</span>
      <p>
        Prompt iyileştirme önerileri, değerlendirme sonuçları UI-3 ile
        bağlandıktan sonra immutable draft akışı üzerinden burada gösterilecek.
      </p>'''
          )
          text = text.replace(
              '<button className={styles.promptDetails} type="button">',
              '<button className={styles.promptDetails} type="button" disabled>'
          )
          text = text.replace(
              '<button className={styles.applyPromptButton} type="button">',
              '<button className={styles.applyPromptButton} type="button" disabled>'
          )

          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/ui2-neutralize-mocks-once.yml
      - name: Commit neutral state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/canonical-dashboard.tsx .github/workflows/ui2-neutralize-mocks-once.yml
          git commit -m "fix(test-lab): keep future-phase dashboard data neutral"
          git push origin HEAD:agent/test-lab-canonical-ui-2
