name: Test Lab profile formatter once

on:
  push:
    branches:
      - feat/test-lab-profile-dropdowns

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/test-lab-profile-dropdowns
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx apps/web/app/app/settings/test-lab/page.tsx apps/web/tests/test-lab-stage1.contract.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx apps/web/app/app/settings/test-lab/page.tsx apps/web/tests/test-lab-stage1.contract.test.ts
          git commit -m "style(test-lab): apply prettier"
          git push origin HEAD:feat/test-lab-profile-dropdowns
