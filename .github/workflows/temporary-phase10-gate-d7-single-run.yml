name: Temporary Phase 10 Gate D7 Single Fresh Age-6

on:
  push:
    branches:
      - ops/250-gate-d7-fresh-character-readiness
    paths:
      - .github/workflows/temporary-phase10-gate-d7-single-run.yml

permissions:
  contents: read
  issues: write

jobs:
  live-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      LUMI_LONG_HORIZON_LIVE: "1"
      LUMI_LONG_HORIZON_BASE_URL: https://project-lumi-web.vercel.app
      LUMI_LONG_HORIZON_CHILD_AGE: "6"
      LUMI_LONG_HORIZON_RNG_SEED: "2508211834"
      LUMI_LONG_HORIZON_RUN_ID: epic-250-gate-d7-age6-fresh-character-readiness-20260821
      LUMI_LONG_HORIZON_PARENT_EMAIL: ${{ secrets.LUMI_LONG_HORIZON_PARENT_EMAIL }}
      LUMI_LONG_HORIZON_PARENT_PASSWORD: ${{ secrets.LUMI_LONG_HORIZON_PARENT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record exact D7 run identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment 250 --repo "$GITHUB_REPOSITORY"
          --body "Gate D7 single fresh age-6 run started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (head $GITHUB_SHA, base product 097437d8b3735e340ab7208f650f444981d5b2b6, run label epic-250-gate-d7-age6-fresh-character-readiness-20260821). Exactly one paid acceptance run is authorized; no automatic retry."

      - name: Guard live credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LUMI_LONG_HORIZON_BASE_URL}"
          test -n "${LUMI_LONG_HORIZON_PARENT_EMAIL}"
          test -n "${LUMI_LONG_HORIZON_PARENT_PASSWORD}"
          test -n "${VERCEL_TOKEN}"
          echo "Persistent live Playwright run is explicitly acknowledged."

      - name: Create temporary Vercel automation bypass
        id: bypass
        shell: bash
        env:
          PREVIEW_URL: https://project-lumi-web.vercel.app
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"

          request="$RUNNER_TEMP/vercel-automation-bypass-generate.json"
          response="$RUNNER_TEMP/vercel-automation-bypass-response.json"
          jq -n --arg secret "$secret" '{
            generate: {
              secret: $secret,
              note: "Temporary Project LUMI Gate D7 long-horizon Playwright run"
            }
          }' > "$request"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$request" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID"

          result="$(curl --silent --show-error \
            --location \
            --max-redirs 5 \
            --output /dev/null \
            --write-out '%{http_code}|%{url_effective}' \
            --header "x-vercel-protection-bypass: $secret" \
            --header "x-vercel-set-bypass-cookie: true" \
            "$PREVIEW_URL/login")"
          status="${result%%|*}"
          final_url="${result#*|}"
          test "$status" = "200" || { echo "Automation bypass probe returned HTTP $status"; exit 1; }
          [[ "$final_url" != *"/sso-api"* ]] || { echo "Automation bypass probe was redirected to Vercel SSO"; exit 1; }

          echo "secret=$secret" >> "$GITHUB_OUTPUT"
          echo "Temporary Vercel automation bypass created and validated."

      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium

      - name: Run browser-only persistent acceptance pack
        env:
          LUMI_LONG_HORIZON_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
        run: pnpm --filter @lumi/web test:long-horizon:live

      - name: Upload long-horizon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-250-gate-d7-age6-${{ github.run_id }}
          path: apps/web/tests/e2e/long-horizon/evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Revoke temporary Vercel automation bypass
        if: always() && steps.bypass.outputs.secret != ''
        shell: bash
        env:
          AUTOMATION_SECRET: ${{ steps.bypass.outputs.secret }}
        run: |
          revoke="$RUNNER_TEMP/vercel-automation-bypass-revoke.json"
          jq -n --arg secret "$AUTOMATION_SECRET" '{
            revoke: {
              secret: $secret,
              regenerate: false
            }
          }' > "$revoke"
          curl --silent --show-error \
            --request PATCH \
            --output /dev/null \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$revoke" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" || true

      - name: Record final D7 job status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: >-
          gh issue comment 250 --repo "$GITHUB_REPOSITORY"
          --body "Gate D7 single fresh age-6 run finished at job level with status **$JOB_STATUS**. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Inspect uploaded evidence before declaring Gate D PASS. No automatic retry was started."
