name: S44 Prettier Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s44-prettier-fix.yml'

permissions:
  contents: write

jobs:
  format-s44:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 's44/memory-production-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s44/memory-production-model
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format S44 files
        run: >-
          pnpm exec prettier --write
          packages/npc-intelligence/src/domain/memory.ts
          packages/story/src/application/committed-memory-projection.service.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/npc-intelligence/src/domain/memory.ts \
            packages/story/src/application/committed-memory-projection.service.ts
          git commit -m 'style(s44): format lifecycle and projection files'
          git push origin HEAD:s44/memory-production-model
