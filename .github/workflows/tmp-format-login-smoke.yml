name: TMP Format Login Smoke

on:
  push:
    branches:
      - docs/character-genesis-living-world-bootstrap-v1

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show canonical Prettier diff
        run: |
          pnpm exec prettier --write apps/web/tests/e2e/long-horizon/login-smoke.live.spec.ts
          git diff -- apps/web/tests/e2e/long-horizon/login-smoke.live.spec.ts
