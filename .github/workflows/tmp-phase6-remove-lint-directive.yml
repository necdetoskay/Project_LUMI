name: Temporary Phase 6 Remove Lint Directive

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/test-lab-phase-6-evaluation-engine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove unsupported lint directive
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/app/settings/test-lab/evaluation-panel.tsx')
          text = path.read_text()
          target = '    // eslint-disable-next-line react-hooks/exhaustive-deps\n'
          if target not in text:
              raise SystemExit('lint directive marker not found')
          path.write_text(text.replace(target, '', 1))
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- apps/web/app/app/settings/test-lab/evaluation-panel.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/evaluation-panel.tsx
          git commit -m "fix(test-lab): remove unsupported lint directive"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
