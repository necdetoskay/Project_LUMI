name: Temporary Format Context Trace

on:
  pull_request:
    paths:
      - "packages/profiles/src/db/schema/profile/ai-generation-traces.ts"
      - "packages/profiles/src/application/ai-generation-trace.service.ts"
      - "packages/profiles/src/application/ai-generation-trace.service.test.ts"
      - "packages/profiles/src/application/world-character-suggestion.service.ts"
      - "packages/profiles/migrations/0076_ai_generation_context_trace.sql"
      - ".github/workflows/tmp-format-context-trace.yml"

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write packages/profiles/src/db/schema/profile/ai-generation-traces.ts packages/profiles/src/application/ai-generation-trace.service.ts packages/profiles/src/application/ai-generation-trace.service.test.ts packages/profiles/src/application/world-character-suggestion.service.ts packages/profiles/migrations/0076_ai_generation_context_trace.sql
          git diff -- packages/profiles/src/db/schema/profile/ai-generation-traces.ts packages/profiles/src/application/ai-generation-trace.service.ts packages/profiles/src/application/ai-generation-trace.service.test.ts packages/profiles/src/application/world-character-suggestion.service.ts packages/profiles/migrations/0076_ai_generation_context_trace.sql
          test -z "$(git status --short -- packages/profiles/src/db/schema/profile/ai-generation-traces.ts packages/profiles/src/application/ai-generation-trace.service.ts packages/profiles/src/application/ai-generation-trace.service.test.ts packages/profiles/src/application/world-character-suggestion.service.ts packages/profiles/migrations/0076_ai_generation_context_trace.sql)"
