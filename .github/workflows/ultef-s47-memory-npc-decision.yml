name: ULTEF S47 Memory NPC Decision

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-npc-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_ultef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_ultef_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_ultef_test
      NPC_TEST_ENABLE_DESTRUCTIVE: "true"
      NODE_ENV: test
      ULTEF_SCENARIO: PX-LUMI-S47-MEMORY-NPC-DECISION-001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare NPC intelligence schema
        run: pnpm --filter @lumi/npc-intelligence npc:migrate
      - name: Run S47 DB-backed memory-aware NPC decision evidence
        run: pnpm --filter @lumi/npc-intelligence test:int -- tests/integration/s47-memory-aware-decision.integration.test.ts
