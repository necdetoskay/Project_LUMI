name: ULTEF PX-LUMI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PX-LUMI-07 world time progression
        env:
          ULTEF_SCENARIO: PX-LUMI-07-WORLD-TIME-001
        run: >-
          pnpm --filter @lumi/simulation exec vitest run
          tests/ultef/ultef-world-time.test.ts

      - name: Run PX-LUMI-08 rumor autonomy evidence
        env:
          ULTEF_SCENARIO: L3-NPC-001
        run: >-
          pnpm --filter @lumi/npc-intelligence exec vitest run
          tests/ultef/ultef-rumor.test.ts

      - name: Run PX-LUMI-08 opportunity-to-hook trace
        env:
          ULTEF_SCENARIO: L4-OPPORTUNITY-HOOK-001
        run: >-
          pnpm --filter @lumi/web exec vitest run
          tests/ultef-opportunity-to-hook.test.ts

      - name: Run PX-LUMI-10 age-aware story generation evidence
        env:
          ULTEF_SCENARIO: L4-HOOK-SCENE-001
        run: >-
          pnpm --filter @lumi/story exec vitest run
          tests/ultef/ultef-hook-scene.test.ts

      - name: Print PX-LUMI evidence
        if: always()
        shell: bash
        run: |
          if [ ! -d artifacts/ultef/runs ]; then
            echo "PX-LUMI evidence directory was not produced."
            exit 0
          fi

          for SCENARIO in \
            PX-LUMI-07-WORLD-TIME-001 \
            L3-NPC-001 \
            L4-OPPORTUNITY-HOOK-001 \
            L4-HOOK-SCENE-001
          do
            FILE=$(find artifacts/ultef/runs -name "$SCENARIO.md" -type f 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$FILE" ]; then
              echo "===== $SCENARIO ====="
              cat "$FILE"
            else
              echo "$SCENARIO evidence was not produced."
            fi
          done

      - name: Upload PX-LUMI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultef-px-lumi-evidence
          path: artifacts/ultef/
          if-no-files-found: warn
          retention-days: 14
