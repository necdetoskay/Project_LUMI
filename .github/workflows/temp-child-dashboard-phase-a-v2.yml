name: Temporary Child Dashboard Phase A V2

on:
  push:
    branches:
      - feat/child-dashboard-v1-shell

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[child-dashboard-v2-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/child-dashboard-v1-shell
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove stale prop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx")
          s = p.read_text()
          s = s.replace("              childProfileId={childProfileId}\n", "", 1)
          s = s.replace("  childProfileId,\n  householdId,", "  householdId,", 1)
          s = s.replace("  childProfileId: string;\n  householdId: string | null;", "  householdId: string | null;", 1)
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write apps/web/app/app/profiles/'[childProfileId]'/child-dashboard-client-page.tsx apps/web/app/app/profiles/'[childProfileId]'/page.tsx
      - run: pnpm --filter @lumi/web exec eslint app/app/profiles/'[childProfileId]'/child-dashboard-client-page.tsx app/app/profiles/'[childProfileId]'/page.tsx --max-warnings=0
      - run: pnpm --filter @lumi/web typecheck
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/profiles/'[childProfileId]'/child-dashboard-client-page.tsx apps/web/app/app/profiles/'[childProfileId]'/page.tsx
          git commit -m "fix(child-dashboard): remove stale home prop [child-dashboard-v2-bot]" || exit 0
          git push origin HEAD:feat/child-dashboard-v1-shell
