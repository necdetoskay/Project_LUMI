name: tmp-child-dashboard-polish
on:
  push:
    branches:
      - fix/child-dashboard-presentation-polish
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/child-dashboard-presentation-polish
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply dashboard patch
        run: python scripts/tmp-child-dashboard-polish.py
      - name: Format dashboard
        run: pnpm prettier --write "apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx"
      - name: Commit dashboard patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(dashboard): polish child-facing presentation"
          git push origin HEAD:fix/child-dashboard-presentation-polish
