name: tmp-child-dashboard-polish
on:
  push:
    branches:
      - fix/child-dashboard-presentation-polish
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/child-dashboard-presentation-polish
      - name: Apply focused dashboard polish
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
          '''              onOpenCharacters={() => setView("characters")}
              onOpenStories={() => setView("stories")}''',
          '''              childProfileId={childProfileId}
              onOpenCharacters={() => setView("characters")}
              onOpenStories={() => setView("stories")}''')

          text = text.replace(
          '''function HomeView({
  householdId,
  primaryCharacter,''',
          '''function HomeView({
  childProfileId,
  householdId,
  primaryCharacter,''')

          text = text.replace(
          '''}: {
  householdId: string | null;
  primaryCharacter: CharacterInfo | null;''',
          '''}: {
  childProfileId: string;
  householdId: string | null;
  primaryCharacter: CharacterInfo | null;''', 1)

          text = text.replace(
          '''            <button
              type="button"
              onClick={onOpenCharacters}
              className="rounded-2xl bg-[#6c42df] px-4 py-3 text-sm font-black text-white"
            >
              + Yeni Karakter Oluştur
            </button>''',
          '''            <Link
              href={`/app/profiles/${encodeURIComponent(childProfileId)}/characters/new/type`}
              className="rounded-2xl bg-[#6c42df] px-4 py-3 text-sm font-black text-white"
            >
              + Yeni Karakter Oluştur
            </Link>''', 1)

          text = text.replace(
          '''                  {primaryCharacter.characterType}''',
          '''                  {characterRoleLabel(primaryCharacter)}''', 1)
          text = text.replace(
          '''                  {primaryCharacter.subtype || primaryCharacter.broadKind}''',
          '''                  {characterKindLabel(primaryCharacter)}''', 1)

          text = text.replace(
          '''          href={`/app/character-onboarding?childProfileId=${encodeURIComponent(childProfileId)}`}''',
          '''          href={`/app/profiles/${encodeURIComponent(childProfileId)}/characters/new/type`}''')

          text = text.replace(
          '''                  {character.characterType}''',
          '''                  {characterRoleLabel(character)}''')
          text = text.replace(
          '''                  {character.subtype || character.broadKind}''',
          '''                  {characterKindLabel(character)}''')

          text = text.replace(
          '''                <p className="mt-4 text-xs leading-5 text-[#8a7c70]">
                  Arşivleme/silme aksiyonu soft-delete PR’ı yeni shell’e
                  taşındığında bu kartın sağ üstüne bağlanacak.
                </p>''',
          '''                <p className="mt-4 text-xs leading-5 text-[#8a7c70]">
                  Birlikte keşfettiğiniz yerler ve maceralar burada birikir.
                </p>''')

          text = text.replace(
          '''            <h2 className="text-xl font-black">🎒 Çanta Özeti</h2>''',
          '''            <h2 className="inline-flex items-center gap-2 text-xl font-black">
              <span className="material-symbols-outlined text-[#6c42df]">backpack</span>
              Çanta Özeti
            </h2>''')

          text = text.replace(
          '''                  <div className="text-2xl">{itemEmoji(item.category)}</div>''',
          '''                  <div className="grid h-10 w-10 place-items-center rounded-xl bg-[#f3eee6] text-[#6c42df]">
                    <span className="material-symbols-outlined">{itemIcon(item)}</span>
                  </div>''')
          text = text.replace(
          '''              <div className="text-4xl">{itemEmoji(item.category)}</div>''',
          '''              <div className="grid h-12 w-12 place-items-center rounded-xl bg-[#f3eee6] text-[#6c42df]">
                <span className="material-symbols-outlined">{itemIcon(item)}</span>
              </div>''')
          text = text.replace(
          '''                {item.category} · {item.quantity} adet''',
          '''                {itemCategoryLabel(item.category)} · {item.quantity} adet''')

          text = text.replace(
          '''          <h3 className="mt-1 font-black leading-5">{source.title}</h3>
          <p className="mt-2 line-clamp-2 text-xs leading-5 text-[#6e6157]">
            {source.summary}
          </p>''',
          '''          <h3 className="mt-1 font-black leading-5">
            {storySourceTitle(source)}
          </h3>
          <p className="mt-2 line-clamp-2 text-xs leading-5 text-[#6e6157]">
            {storySourceSummary(source)}
          </p>''')

          old = '''function itemEmoji(category: string) {
  const normalized = category.toLocaleLowerCase("tr-TR");
  if (normalized.includes("compass") || normalized.includes("pusula"))
    return "🧭";
  if (normalized.includes("light") || normalized.includes("fener")) return "🏮";
  if (normalized.includes("leaf") || normalized.includes("yaprak")) return "🍃";
  if (normalized.includes("book") || normalized.includes("kitap")) return "📖";
  return "🎒";
}
'''
          new = '''function characterRoleLabel(character: CharacterInfo) {
  const value = `${character.characterType} ${character.subtype}`.toLocaleLowerCase("tr-TR");
  if (value.includes("explorer") || value.includes("kaşif") || value.includes("kasif"))
    return "Meraklı Kaşif";
  if (value.includes("guardian") || value.includes("koruyucu")) return "Cesur Koruyucu";
  if (value.includes("inventor") || value.includes("mucit")) return "Yaratıcı Mucit";
  if (value.includes("storyteller") || value.includes("anlatıcı")) return "Hikâye Anlatıcısı";
  return "Macera Arkadaşı";
}

function characterKindLabel(character: CharacterInfo) {
  const value = `${character.broadKind} ${character.subtype}`.toLocaleLowerCase("tr-TR");
  if (value.includes("child")) return "Genç Maceracı";
  if (value.includes("human") || value.includes("insan")) return "İnsan";
  if (value.includes("animal") || value.includes("hayvan")) return "Hayvan Dost";
  if (value.includes("fantasy") || value.includes("fantastic") || value.includes("fantastik"))
    return "Fantastik Karakter";
  if (value.includes("robot") || value.includes("synthetic") || value.includes("sentetik"))
    return "Robot Dost";
  return "Özel Karakter";
}

function looksTechnical(value: string) {
  const normalized = value.trim().toLocaleLowerCase("tr-TR");
  if (!normalized) return true;
  return (
    normalized.includes("_") ||
    normalized.includes("-") ||
    /\\b(story|direct|inventory|origin|item|hook|child|explorer)\\b/.test(normalized) ||
    /\\b(isik|esya|hikaye|dogrudan|gezgibi)\\b/.test(normalized)
  );
}

function storySourceTitle(source: StorySource) {
  if (!looksTechnical(source.title)) return source.title;
  if (source.kind === "inventory") return "Çantandaki eşya seni bir yere çağırıyor";
  if (source.kind === "origin") return "Geçmişten gelen eski bir iz";
  return "Dünyada yeni bir iz belirdi";
}

function storySourceSummary(source: StorySource) {
  if (!looksTechnical(source.summary)) return source.summary;
  if (source.kind === "inventory")
    return "Yanındaki eşyalardan biri yeni bir maceranın kapısını aralayabilir.";
  if (source.kind === "origin")
    return "Karakterinin geçmişinden gelen küçük bir ipucu yeniden ortaya çıktı.";
  return "Dünyada olan bir değişiklik seni yeni bir keşfe davet ediyor.";
}

function itemIcon(item: InventoryItem) {
  const normalized = `${item.category} ${item.displayName}`.toLocaleLowerCase("tr-TR");
  if (normalized.includes("compass") || normalized.includes("pusula")) return "explore";
  if (normalized.includes("light") || normalized.includes("fener") || normalized.includes("lantern"))
    return "flashlight_on";
  if (normalized.includes("leaf") || normalized.includes("yaprak") || normalized.includes("plant"))
    return "eco";
  if (normalized.includes("book") || normalized.includes("kitap") || normalized.includes("scroll"))
    return "menu_book";
  if (normalized.includes("key") || normalized.includes("anahtar")) return "key";
  if (normalized.includes("gem") || normalized.includes("crystal") || normalized.includes("kristal"))
    return "diamond";
  if (normalized.includes("toy") || normalized.includes("oyuncak")) return "toys";
  return "category";
}

function itemCategoryLabel(category: string) {
  const normalized = category.toLocaleLowerCase("tr-TR");
  if (normalized.includes("tool")) return "Araç";
  if (normalized.includes("story") || normalized.includes("quest")) return "Macera Eşyası";
  if (normalized.includes("book")) return "Kitap";
  if (normalized.includes("toy")) return "Oyuncak";
  if (normalized.includes("collect")) return "Koleksiyon";
  return "Eşya";
}
'''
          if old not in text:
              raise SystemExit('itemEmoji block not found')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
      - name: Format changed files
        run: |
          corepack enable
          pnpm prettier --write "apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx"
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(dashboard): polish child-facing presentation"
          git push origin HEAD:fix/child-dashboard-presentation-polish
