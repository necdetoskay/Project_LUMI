name: Stories E2E Locator Fix Temporary

on:
  push:
    branches:
      - test/stories-ux-v2-e2e-closeout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/stories-ux-v2-e2e-closeout
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden deterministic locators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/tests/e2e/stories-ux-v2.spec.ts')
          text = path.read_text()
          pairs = [
            ('page.getByText("Dünyada Bir Şey Oldu")', 'page.getByText("Dünyada Bir Şey Oldu", { exact: true })'),
            ('page.getByText("Bir Söylenti Duydun")', 'page.getByText("Bir Söylenti Duydun", { exact: true })'),
            ('page.getByText("Çantandaki Bir Eşya")', 'page.getByText("Çantandaki Bir Eşya", { exact: true })'),
            ('page.getByText("Birinden Gelen Çağrı")', 'page.getByText("Birinden Gelen Çağrı", { exact: true })'),
            ('page.getByText("Something Happened in the World")', 'page.getByText("Something Happened in the World", { exact: true })'),
            ('page.getByText("An Item in Your Bag")', 'page.getByText("An Item in Your Bag", { exact: true })'),
            ('page.getByText("A Call from Someone")', 'page.getByText("A Call from Someone", { exact: true })'),
            ('const closeButton = page.getByRole("button", { name: "Close" });', 'const closeButton = page.getByRole("button", { name: "Close", exact: true });'),
            ('await page.getByRole("button", { name: "Follow this clue" }).click();', 'const worldCard = page.getByTestId("adventure-candidate").filter({ hasText: "Parlayan orman" });\n    await worldCard.getByRole("button", { name: "Follow this clue", exact: true }).click();'),
          ]
          for old, new in pairs:
            if old not in text:
              raise SystemExit(f'missing locator target: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/web/tests/e2e/stories-ux-v2.spec.ts
      - name: Commit locator fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/stories-ux-v2.spec.ts
          git commit -m "test(stories): harden browser locators"
          git push origin HEAD:test/stories-ux-v2-e2e-closeout
