name: TMP Prettier Fix

# one-time trigger
on:
  push:
    branches:
      - agent/visual-library-v2-shell

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.head_commit.message != 'chore(ci): apply prettier to s53 visual library test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-library-v2-shell
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/tests/e2e/ultef-s53-assets-compose.spec.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/ultef-s53-assets-compose.spec.ts
          git commit -m "chore(ci): apply prettier to s53 visual library test"
          git push origin HEAD:agent/visual-library-v2-shell
