name: Temporary S56 Format Fix 2

on:
  push:
    branches:
      - s56/image-generation-platform

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s56/image-generation-platform
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/web/app/api/assets/subjects/[subjectType]/[subjectId]/route.ts \
            apps/web/tests/ultef-s56-image-generation-platform.integration.test.ts \
            .github/workflows/ultef-s56-image-generation.yml
          rm .github/workflows/s56-format-fix-2.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/api/assets/subjects/[subjectType]/[subjectId]/route.ts apps/web/tests/ultef-s56-image-generation-platform.integration.test.ts .github/workflows/ultef-s56-image-generation.yml .github/workflows/s56-format-fix-2.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(s56): format generation API and ULTEF"
          git push
