name: ULTEF S54 R2 Storage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ULTEF_S54_R2_ENABLE: "true"
      OBJECT_STORAGE_ENDPOINT: ${{ secrets.LUMI_DEV_OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_BUCKET: ${{ secrets.LUMI_DEV_OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.LUMI_DEV_OBJECT_STORAGE_ACCESS_KEY_ID }}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.LUMI_DEV_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      OBJECT_STORAGE_REGION: auto

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate required object storage secrets
        shell: bash
        run: |
          test -n "$OBJECT_STORAGE_ENDPOINT" || { echo "LUMI_DEV_OBJECT_STORAGE_ENDPOINT is missing"; exit 1; }
          test -n "$OBJECT_STORAGE_BUCKET" || { echo "LUMI_DEV_OBJECT_STORAGE_BUCKET is missing"; exit 1; }
          test -n "$OBJECT_STORAGE_ACCESS_KEY_ID" || { echo "LUMI_DEV_OBJECT_STORAGE_ACCESS_KEY_ID is missing"; exit 1; }
          test -n "$OBJECT_STORAGE_SECRET_ACCESS_KEY" || { echo "LUMI_DEV_OBJECT_STORAGE_SECRET_ACCESS_KEY is missing"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run LUMI S3-compatible storage adapter against R2
        run: pnpm --filter @lumi/web exec vitest run tests/ultef-s54-r2-character-visual-storage.integration.test.ts
