name: UI3 Format Once

on:
  push:
    branches:
      - agent/test-lab-canonical-ui-3-v2
    paths:
      - .github/workflows/ui3-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-lab-canonical-ui-3-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/lib/ai/test-lab-dashboard-view-model.ts
      - run: rm .github/workflows/ui3-format-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(test-lab): format ui3 view model"
          git push origin HEAD:agent/test-lab-canonical-ui-3-v2
