name: Temporary NPC story Prettier

on:
  push:
    branches:
      - agent/context-npc-story-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-npc-story-integration
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/context/tests/application/story-relevant-npc-context.test.ts
      - run: pnpm exec prettier --check packages/context/tests/application/story-relevant-npc-context.test.ts
      - name: Commit formatted test
        run: |
          rm .github/workflows/tmp-npc-story-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(context): format NPC story context test"
          git push origin HEAD:agent/context-npc-story-integration
