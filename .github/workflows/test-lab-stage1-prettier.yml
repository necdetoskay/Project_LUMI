name: Test Lab Stage1 Prettier

on:
  push:
    branches:
      - fix/test-lab-functional-first
    paths:
      - apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx
      - apps/web/tests/test-lab-stage1.contract.test.ts
      - .github/workflows/test-lab-stage1-prettier.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-lab-functional-first
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format stage 1 files
        run: pnpm exec prettier --write apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx apps/web/tests/test-lab-stage1.contract.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx apps/web/tests/test-lab-stage1.contract.test.ts
          git commit -m "style(test-lab): apply prettier"
          git push origin HEAD:fix/test-lab-functional-first
