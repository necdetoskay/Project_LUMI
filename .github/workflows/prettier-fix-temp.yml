name: Temporary Prettier Fix

on:
  push:
    branches:
      - agent/visual-library-v3-manifest-binding
    paths:
      - .github/workflows/prettier-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-library-v3-manifest-binding
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target file
        run: pnpm exec prettier --write 'packages/media/tests/integration/media-asset.repository.test.ts'
      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'packages/media/tests/integration/media-asset.repository.test.ts'
          git commit -m 'chore: apply prettier to media integration test'
          git push origin HEAD:agent/visual-library-v3-manifest-binding
