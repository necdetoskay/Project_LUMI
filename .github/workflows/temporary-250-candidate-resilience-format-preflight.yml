name: Temporary 250 Candidate Resilience Format and Preflight

on:
  push:
    branches:
      - fix/250-adventure-candidate-poll-resilience
    paths:
      - .github/workflows/temporary-250-candidate-resilience-format-preflight.yml

permissions:
  contents: write
  issues: write

jobs:
  format-and-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_candidate_resilience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_candidate_resilience_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_candidate_resilience_test
      PROFILE_DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_candidate_resilience_test
      STORY_TEST_DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_candidate_resilience_test
      LUMI_SETTINGS_ENCRYPTION_KEY: lumi-candidate-resilience-key
      NODE_ENV: test
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed product files
        run: >-
          pnpm exec prettier --write
          apps/web/lib/stories/adventure-readiness.ts
          'apps/web/app/api/child-profiles/[id]/stories/adventure-candidates/route.ts'
          apps/web/tests/adventure-readiness.test.ts
      - name: Commit formatter output only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            apps/web/lib/stories/adventure-readiness.ts \
            'apps/web/app/api/child-profiles/[id]/stories/adventure-candidates/route.ts' \
            apps/web/tests/adventure-readiness.test.ts; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/lib/stories/adventure-readiness.ts \
            'apps/web/app/api/child-profiles/[id]/stories/adventure-candidates/route.ts' \
            apps/web/tests/adventure-readiness.test.ts
          git commit -m "style(stories): format candidate read resilience fix"
          git push origin HEAD:fix/250-adventure-candidate-poll-resilience
      - name: Check formatting
        run: >-
          pnpm exec prettier --check
          apps/web/lib/stories/adventure-readiness.ts
          'apps/web/app/api/child-profiles/[id]/stories/adventure-candidates/route.ts'
          apps/web/tests/adventure-readiness.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Run readiness regressions
        run: pnpm --filter @lumi/web exec vitest run tests/adventure-readiness.test.ts
      - name: Apply auth migration
        run: pnpm --filter @lumi/web auth:migrate
      - name: Apply profile migrations
        run: pnpm --filter @lumi/profiles profile:migrate
      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium
      - name: Run Stories UX browser journey
        run: pnpm --filter @lumi/web exec playwright test tests/e2e/stories-ux-v2.spec.ts
      - name: Record final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: >-
          gh issue comment 250 --repo "$GITHUB_REPOSITORY"
          --body "Candidate resilience format+preflight finished **$JOB_STATUS**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No production mutation or paid/model call."
