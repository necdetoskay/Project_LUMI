name: Phase 6 Format Repair

on:
  push:
    branches:
      - agent/story-context-production-authorities

permissions:
  contents: write

jobs:
  repair-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-context-production-authorities
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 6 files
        run: |
          pnpm exec prettier --write \
            packages/context/src/application/story-generation-context.ts \
            packages/context/tests/application/retrieval.test.ts \
            packages/story/src/application/story-scene-prompt.ts \
            packages/story/tests/application/story-generation-context.integration.test.ts \
            packages/world/src/db/repositories/drizzle/drizzle-world-event-reader.ts
      - name: Commit formatting when changed
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/context/src/application/story-generation-context.ts \
            packages/context/tests/application/retrieval.test.ts \
            packages/story/src/application/story-scene-prompt.ts \
            packages/story/tests/application/story-generation-context.integration.test.ts \
            packages/world/src/db/repositories/drizzle/drizzle-world-event-reader.ts
          git commit -m "style: format Phase 6 context integration"
          git push origin HEAD:agent/story-context-production-authorities
