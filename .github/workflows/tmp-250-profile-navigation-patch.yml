name: Temporary Phase 10 Navigation Patch

on:
  push:
    branches:
      - fix/250-live-profile-navigation
    paths:
      - .github/workflows/tmp-250-profile-navigation-patch.yml
      - tooling/tmp-250-profile-navigation-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/250-live-profile-navigation

      - name: Apply exact navigation patch
        run: python tooling/tmp-250-profile-navigation-patch.py

      - name: Remove temporary helpers
        run: rm tooling/tmp-250-profile-navigation-patch.py .github/workflows/tmp-250-profile-navigation-patch.yml

      - name: Commit patched live spec
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts tooling/tmp-250-profile-navigation-patch.py .github/workflows/tmp-250-profile-navigation-patch.yml
          git diff --cached --check
          git commit -m "test(live): follow canonical profile creation navigation"
          git push origin HEAD:fix/250-live-profile-navigation
