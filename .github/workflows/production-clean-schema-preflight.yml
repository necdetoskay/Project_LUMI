name: Production Clean Schema Bootstrap Preflight

on:
  push:
    branches:
      - fix/production-clean-schema-bootstrap

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier patch
        run: |
          pnpm exec prettier --write apps/web/scripts/vercel-production-schema-migrate.mjs apps/web/tests/production-schema-migrations.contract.test.ts
          git diff -- apps/web/scripts/vercel-production-schema-migrate.mjs apps/web/tests/production-schema-migrations.contract.test.ts
          exit 1
