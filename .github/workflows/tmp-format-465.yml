name: Temporary Format 465

on:
  push:
    branches:
      - agent/465-simulation-runtime-hardening

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/465-simulation-runtime-hardening
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/simulation/tests/application/simulation-runner.test.ts .github/workflows/data-integrity-db.yml
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/simulation/tests/application/simulation-runner.test.ts .github/workflows/data-integrity-db.yml
          git commit -m "chore: format simulation runtime hardening"
          git push origin HEAD:agent/465-simulation-runtime-hardening
