name: Stories UX Temporary Format

on:
  push:
    branches:
      - test/stories-ux-v2-e2e-closeout

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/stories-ux-v2-e2e-closeout
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/tests/e2e/stories-ux-v2.spec.ts .github/workflows/stories-ux-v2-e2e.yml
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/stories-ux-v2.spec.ts .github/workflows/stories-ux-v2-e2e.yml
          git commit -m "chore: format Stories UX browser gate"
          git push origin HEAD:test/stories-ux-v2-e2e-closeout
