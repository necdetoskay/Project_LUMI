name: Temporary Landing Production Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: "${{ startsWith(github.event.head_commit.message, 'deploy(landing): production') }}"
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      VERCEL_PROJECT_NAME: project-lumi-web
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify token
        run: test -n "$VERCEL_TOKEN"

      - name: Create production deployment
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/vercel-request.json"
          response="$RUNNER_TEMP/vercel-response.json"
          jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            '{
              name: $name,
              project: $project,
              target: "production",
              gitSource: {type: "github", org: $org, repo: $repo, ref: $ref, sha: $sha}
            }' > "$request"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$request" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID"
          deployment_id="$(jq -r '.id // empty' "$response")"
          deployment_url="$(jq -r '.url // empty' "$response")"
          if [ -z "$deployment_id" ] || [ -z "$deployment_url" ]; then
            cat "$response"
            exit 1
          fi
          echo "Deployment created: $deployment_id"
          echo "URL: https://$deployment_url"