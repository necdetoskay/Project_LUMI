name: ULTEF S51 Demo Browser

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_s51_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_s51_browser_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_s51_browser_test
      NODE_ENV: test
      LUMI_DEMO_CONFIRM: lumi-demo-v1
      LUMI_DEMO_PARENT_PASSWORD: lumi-demo-local-only-2026
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium
      - name: Prepare auth schema
        run: pnpm --filter @lumi/web auth:migrate
      - name: Prepare profile schema
        run: pnpm --filter @lumi/profiles profile:migrate
      - name: Prepare world schema
        run: pnpm --filter @lumi/world world:migrate
      - name: Prepare NPC intelligence schema
        run: pnpm --filter @lumi/npc-intelligence npc:migrate
      - name: Prepare story schema
        run: pnpm --filter @lumi/story story:migrate
      - name: Seed playable demo universe
        run: pnpm demo:seed
      - name: Run S51 playable browser journey
        run: pnpm --filter @lumi/web exec playwright test tests/e2e/ultef-s51-demo-journey.spec.ts

  demo-artifact-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_INTERNAL_DATABASE_URL: postgresql://lumi:lumi_artifact_only@s51-artifact-postgres:5432/lumi_s51_artifact_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create blank artifact PostgreSQL
        run: |
          docker network create s51-artifact-runtime
          docker run -d --name s51-artifact-postgres --network s51-artifact-runtime \
            -p 55432:5432 \
            -e POSTGRES_USER=lumi \
            -e POSTGRES_PASSWORD=lumi_artifact_only \
            -e POSTGRES_DB=lumi_s51_artifact_test \
            postgres:17
          for i in $(seq 1 30); do
            if docker exec s51-artifact-postgres pg_isready -U lumi -d lumi_s51_artifact_test; then exit 0; fi
            sleep 2
          done
          docker logs s51-artifact-postgres
          exit 1

      - name: Assert application schema is initially absent
        run: |
          for relation in parent_accounts profile.households profile.quests npc_intelligence.npc_snapshots story.story_sessions; do
            test "$(docker exec s51-artifact-postgres psql -U lumi -d lumi_s51_artifact_test -Atc "SELECT to_regclass('$relation') IS NULL")" = "t"
          done

      - name: Build the deployable web Docker image
        run: docker build --build-arg NEXT_PUBLIC_APP_URL=http://127.0.0.1:3101 -t lumi-web:s51-artifact .

      - name: Boot the deployable web Docker image
        run: |
          docker run -d --name s51-artifact-web --network s51-artifact-runtime \
            -p 3101:3000 \
            -e DATABASE_URL="$ARTIFACT_INTERNAL_DATABASE_URL" \
            -e NEXT_PUBLIC_APP_URL=http://127.0.0.1:3101 \
            -e LUMI_DEMO_PARENT_PASSWORD=lumi-demo-artifact-only-2026 \
            lumi-web:s51-artifact
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3101/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs s51-artifact-web
          exit 1

      - name: Prepare demo and upgrade the full schema through the real Docker artifact
        run: |
          headers=$(mktemp)
          curl --fail --silent --show-error -D "$headers" -o /dev/null \
            -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'action=prepare' http://127.0.0.1:3101/api/demo-control
          cat "$headers"
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' "$headers" | tail -1)
          echo "Redirect: $location"
          echo "$location" | grep -q 'result=success'

          for relation in parent_accounts profile.households profile.child_profiles profile.worlds profile.quests npc_intelligence.npc_snapshots story.story_sessions; do
            echo "Checking $relation"
            test "$(docker exec s51-artifact-postgres psql -U lumi -d lumi_s51_artifact_test -Atc "SELECT to_regclass('$relation') IS NOT NULL")" = "t"
          done

      - name: Verify demo status through the real Docker artifact
        run: |
          headers=$(mktemp)
          curl --fail --silent --show-error -D "$headers" -o /dev/null \
            -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'action=status' http://127.0.0.1:3101/api/demo-control
          cat "$headers"
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' "$headers" | tail -1)
          echo "Redirect: $location"
          echo "$location" | grep -q 'result=success'
          echo "$location" | grep -q 'manifestVersion'

      - name: Print container diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs s51-artifact-web || true
          docker logs s51-artifact-postgres || true

      - name: Cleanup artifact runtime
        if: always()
        run: |
          docker rm -f s51-artifact-web s51-artifact-postgres || true
          docker network rm s51-artifact-runtime || true
