name: Temporary Age-6 Long-Horizon Live Reference Run

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: write

jobs:
  age6-live-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      VERCEL_PROJECT_NAME: project-lumi-web
      VERCEL_PREVIEW_BRANCH: agent/live-long-horizon-playwright-pack
      STAGING_DATABASE_URL: ${{ secrets.LUMI_DEV_DATABASE_URL }}
      PREVIEW_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LUMI_LONG_HORIZON_LIVE: "1"
      LUMI_LONG_HORIZON_CHILD_AGE: "6"
      LUMI_LONG_HORIZON_RNG_SEED: ${{ github.run_id }}
      LUMI_LONG_HORIZON_RUN_ID: age6-ref-${{ github.run_id }}
      LUMI_LONG_HORIZON_PARENT_EMAIL: demo@lumi.local
      LUMI_LONG_HORIZON_PARENT_PASSWORD: LumiDemo2026!
      LUMI_LONG_HORIZON_STORAGE_STATE_PATH: /tmp/lumi-long-horizon-vercel-share-storage.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch login success URL matcher in live harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = r'page.waitForURL(/\/app(?:\/|$)/, { timeout: 60_000 }),' 
          new = r'page.waitForURL(/\/app(?:[/?#]|$)/, { timeout: 60_000 }),' 
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Live login URL matcher patched for /app?success=signed_in")
          elif new in text:
              print("Live login URL matcher already supports /app?success=signed_in")
          else:
              raise SystemExit("Neither expected login URL matcher variant was found")
          PY

      - name: Confirm explicit live-run prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "$STAGING_DATABASE_URL" || { echo "LUMI_DEV_DATABASE_URL is missing"; exit 1; }
          test -n "$PREVIEW_OPENROUTER_API_KEY" || { echo "OPENROUTER_API_KEY is missing"; exit 1; }
          ACTUAL_DATABASE_NAME="$(node -e 'const u=new URL(process.env.STAGING_DATABASE_URL); process.stdout.write(u.pathname.replace(/^\//, ""))')"
          test "$ACTUAL_DATABASE_NAME" = "neondb" || {
            echo "Refusing live run: expected staging neondb database";
            exit 1;
          }
          echo "Persistent age-6 live run explicitly approved; staging DB and paid model calls enabled."

      - name: Bind staging DB and OpenRouter to this Preview branch
        shell: bash
        run: |
          set -euo pipefail
          upsert_env() {
            key="$1"
            value="$2"
            request="$RUNNER_TEMP/vercel-env-$key.json"
            response="$RUNNER_TEMP/vercel-env-$key-response.json"

            jq -n \
              --arg key "$key" \
              --arg value "$value" \
              --arg branch "$VERCEL_PREVIEW_BRANCH" \
              '{
                key: $key,
                value: $value,
                type: "encrypted",
                target: ["preview"],
                gitBranch: $branch,
                comment: "Project LUMI age-6 long-horizon live reference Preview"
              }' > "$request"

            curl --fail-with-body --silent --show-error \
              --request POST \
              --output "$response" \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$request" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID"

            env_id="$(jq -r '.created.id // .id // empty' "$response")"
            test -n "$env_id" || {
              echo "Vercel did not confirm $key Preview env upsert";
              jq '{failed, error}' "$response";
              exit 1;
            }
            echo "$key Preview binding: PASS"
          }

          upsert_env DATABASE_URL "$STAGING_DATABASE_URL"
          upsert_env OPENROUTER_API_KEY "$PREVIEW_OPENROUTER_API_KEY"

      - name: Verify required Preview env metadata
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/vercel-preview-env.json"
          curl --fail-with-body --silent --show-error \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?gitBranch=agent%2Flive-long-horizon-playwright-pack&teamId=$VERCEL_ORG_ID"

          for key in DATABASE_URL OPENROUTER_API_KEY; do
            matches="$(jq -r --arg branch "$VERCEL_PREVIEW_BRANCH" --arg key "$key" '[
              .envs[]
              | select(.key == $key)
              | select(.gitBranch == $branch)
              | select((.target // []) | index("preview"))
            ] | length' "$response")"
            test "$matches" -ge 1 || { echo "Missing branch Preview env: $key"; exit 1; }
          done
          echo "Required Preview env metadata: PASS"

      - name: Create fresh non-production Preview deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/vercel-deployment-request.json"
          response="$RUNNER_TEMP/vercel-deployment-response.json"

          jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            '{
              name: $name,
              project: $project,
              gitSource: {
                type: "github",
                org: $org,
                repo: $repo,
                ref: $ref,
                sha: $sha
              }
            }' > "$request"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$request" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID"

          deployment_id="$(jq -r '.id // empty' "$response")"
          deployment_url="$(jq -r '.url // empty' "$response")"
          deployment_target="$(jq -r '.target // empty' "$response")"
          test -n "$deployment_id" || { echo "Vercel deployment creation failed"; exit 1; }
          test -n "$deployment_url" || { echo "Vercel deployment URL missing"; exit 1; }
          test "$deployment_target" != "production" || { echo "Safety failure: production deployment created"; exit 1; }

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=https://$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment created: $deployment_id"

      - name: Wait for Preview READY
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            response="$RUNNER_TEMP/vercel-deployment-status.json"
            curl --fail-with-body --silent --show-error \
              --output "$response" \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID"

            state="$(jq -r '.readyState // .state // empty' "$response")"
            target="$(jq -r '.target // empty' "$response")"
            test "$target" != "production" || { echo "Safety failure: deployment became production"; exit 1; }

            if [ "$state" = "READY" ]; then
              echo "Preview READY: $DEPLOYMENT_ID"
              exit 0
            fi
            if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
              echo "Preview deployment ended in $state"
              exit 1
            fi
            echo "Waiting for Preview READY ($attempt/120): ${state:-unknown}"
            sleep 5
          done
          echo "Preview did not become READY within 10 minutes"
          exit 1

      - name: Create temporary Vercel share access
        id: share
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/vercel-share-bypass.json"
          candidates="$RUNNER_TEMP/vercel-share-candidates.txt"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"ttl":7200}' \
            "https://api.vercel.com/aliases/$DEPLOYMENT_ID/protection-bypass?teamId=$VERCEL_ORG_ID"

          jq -r '
            [
              (.value? // empty),
              (.shareableUrl? // empty),
              (.shareableURL? // empty),
              (.shareableLink? // empty),
              (if (.protectionBypass? | type) == "string" then .protectionBypass else empty end),
              (if (.protectionBypass? | type) == "object" then (.protectionBypass | keys[]) else empty end),
              (paths(scalars) as $p | getpath($p) | select(type == "string" and length >= 12))
            ]
            | flatten
            | .[]
            | select(type == "string" and length >= 12)
          ' "$response" | awk '!seen[$0]++' > "$candidates"

          secret=""
          while IFS= read -r raw; do
            test -n "$raw" || continue
            candidate="$raw"
            if [[ "$candidate" == *"_vercel_share="* ]]; then
              candidate="${candidate#*_vercel_share=}"
              candidate="${candidate%%&*}"
              candidate="${candidate%%#*}"
            fi
            test -n "$candidate" || continue
            echo "::add-mask::$candidate"

            cookie_jar="$RUNNER_TEMP/vercel-share-probe-cookies.txt"
            final="$(curl --silent --show-error \
              --location \
              --max-redirs 5 \
              --cookie-jar "$cookie_jar" \
              --output /dev/null \
              --write-out '%{http_code}|%{url_effective}' \
              "$PREVIEW_URL/login?_vercel_share=$candidate" || true)"
            status="${final%%|*}"
            final_url="${final#*|}"
            if [ "$status" = "200" ] && [[ "$final_url" != *"/sso-api"* ]]; then
              secret="$candidate"
              break
            fi
          done < "$candidates"

          if [ -z "$secret" ]; then
            echo "Vercel share bypass response shape (values redacted):"
            jq '{
              topLevelKeys: keys,
              valueType: (.value? | type),
              protectionBypassType: (.protectionBypass? | type),
              protectionBypassEntryCount: (if (.protectionBypass? | type) == "object" then (.protectionBypass | length) else 0 end),
              resultType: (.result? | type)
            }' "$response"
            echo "No candidate from the Vercel response granted protected Preview access."
            exit 1
          fi

          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
          echo "Temporary Preview share access created and validated."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium

      - name: Run persistent age-6 browser acceptance pack
        env:
          LUMI_LONG_HORIZON_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          LUMI_LONG_HORIZON_VERCEL_SHARE_SECRET: ${{ steps.share.outputs.secret }}
        run: pnpm --filter @lumi/web test:long-horizon:live

      - name: Persist login URL matcher fix
        if: always()
        shell: bash
        run: |
          path="apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts"
          if git diff --quiet -- "$path"; then
            echo "No login matcher diff to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "fix(e2e): accept login success query in live pack"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload age-6 long-horizon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-long-horizon-age6-${{ github.run_id }}
          path: apps/web/tests/e2e/long-horizon/evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Revoke temporary Vercel share access
        if: always() && steps.share.outputs.secret != ''
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          SHARE_SECRET: ${{ steps.share.outputs.secret }}
        run: |
          revoke="$RUNNER_TEMP/vercel-share-revoke.json"
          jq -n --arg secret "$SHARE_SECRET" '{revoke:{secret:$secret,regenerate:false}}' > "$revoke"
          curl --silent --show-error \
            --request PATCH \
            --output /dev/null \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$revoke" \
            "https://api.vercel.com/aliases/$DEPLOYMENT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" || true
          rm -f "$LUMI_LONG_HORIZON_STORAGE_STATE_PATH"
