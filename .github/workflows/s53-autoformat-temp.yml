name: S53 Temporary Autoformat

on:
  push:
    branches: [s53/character-visual-canon]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s53/character-visual-canon
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Sprint 53 changed text files
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD \
            | grep -E '\.(ts|tsx|md|yml|yaml|mjs)$' \
            | xargs -r pnpm exec prettier --write
      - name: Commit repository-native formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(s53): format character visual canon files"
          git push origin HEAD:s53/character-visual-canon
