name: Temporary format long-horizon 233 v2

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-long-horizon-playwright-pack

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format files reported by CI
        run: |
          pnpm exec prettier --write \
            "apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts" \
            "apps/web/tests/long-horizon-playwright.contract.test.ts"

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts" \
            "apps/web/tests/long-horizon-playwright.contract.test.ts"
          git commit -m "chore: format long-horizon Playwright files"
          git push origin HEAD:agent/live-long-horizon-playwright-pack

      - name: Verify formatting
        run: pnpm format:check
