name: UI Profile Prettier Fix

on:
  push:
    branches:
      - codex/ui-child-profile-personalization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-child-profile-personalization
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/web/app/app/profiles/[childProfileId]/profile-experience-client-page.tsx" "packages/profiles/src/application/child-profile-personalization.service.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/app/app/profiles/[childProfileId]/profile-experience-client-page.tsx" "packages/profiles/src/application/child-profile-personalization.service.ts"
          git commit -m "style(ui): apply repository prettier"
          git push origin HEAD:codex/ui-child-profile-personalization
