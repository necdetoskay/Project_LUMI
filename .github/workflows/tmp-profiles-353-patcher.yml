name: Temporary Profiles PR 353 Patcher

on:
  pull_request_target:
    types: [edited]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 353 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profiles-canonical-ui
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore permanent delete typed-name confirmation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/app/profiles/profiles-client-page.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"{label} not found")
              text = text.replace(old, new, 1)

          replace_once(
              '''  const [deleteTarget, setDeleteTarget] = useState<EnrichedProfile | null>(
              null,
            );
            const [deletingMode, setDeletingMode] = useState<DeleteMode | null>(null);'''.replace("            ", ""),
              '''  const [deleteTarget, setDeleteTarget] = useState<EnrichedProfile | null>(
              null,
            );
            const [deleteConfirm, setDeleteConfirm] = useState("");
            const [deletingMode, setDeletingMode] = useState<DeleteMode | null>(null);'''.replace("            ", ""),
              "delete state",
          )

          replace_once(
              '''      if (event.key === "Escape") {
                setDeleteTarget(null);
                setDeleteError(null);
              }'''.replace("        ", ""),
              '''      if (event.key === "Escape") {
                setDeleteTarget(null);
                setDeleteConfirm("");
                setDeleteError(null);
              }'''.replace("        ", ""),
              "escape reset",
          )

          replace_once(
              '''  }, [ageSort, profiles, query, storyFilter]);

            async function handleDelete'''.replace("            ", ""),
              '''  }, [ageSort, profiles, query, storyFilter]);

            const deleteConfirmMatches =
              deleteTarget !== null && deleteConfirm.trim() === deleteTarget.displayName;

            async function handleDelete'''.replace("            ", ""),
              "delete confirmation predicate",
          )

          replace_once(
              '''  async function handleDelete(mode: DeleteMode) {
                if (!deleteTarget || !householdId) return;

                setDeletingMode(mode);'''.replace("              ", ""),
              '''  async function handleDelete(mode: DeleteMode) {
                if (!deleteTarget || !householdId) return;
                if (mode === "permanent" && !deleteConfirmMatches) return;

                setDeletingMode(mode);'''.replace("              ", ""),
              "delete guard",
          )

          replace_once(
              '''      setDeleteTarget(null);
            } catch {'''.replace("      ", ""),
              '''      setDeleteTarget(null);
            setDeleteConfirm("");
            } catch {'''.replace("      ", ""),
              "delete success reset",
          )

          replace_once(
              '''                    onManage={() => {
                                setDeleteTarget(profile);
                                setDeleteError(null);
                              }}'''.replace("                      ", ""),
              '''                    onManage={() => {
                                setDeleteTarget(profile);
                                setDeleteConfirm("");
                                setDeleteError(null);
                              }}'''.replace("                      ", ""),
              "manage reset",
          )

          replace_once(
              '''          onClick={() => {
                    setDeleteTarget(null);
                    setDeleteError(null);
                  }}'''.replace("          ", ""),
              '''          onClick={() => {
                    setDeleteTarget(null);
                    setDeleteConfirm("");
                    setDeleteError(null);
                  }}'''.replace("          ", ""),
              "backdrop reset",
          )

          replace_once(
              '''            {deleteError ? (
                    <p className={styles.errorText}>{deleteError}</p>
                  ) : null}
                  <div className={styles.modalActions}>'''.replace("            ", ""),
              '''            <label className={styles.confirmField}>
                    <span>
                      Kalıcı silme için profil adını birebir yazın:
                      <strong>{deleteTarget.displayName}</strong>
                    </span>
                    <input
                      type="text"
                      value={deleteConfirm}
                      onChange={(event) => setDeleteConfirm(event.target.value)}
                      placeholder={deleteTarget.displayName}
                      disabled={deletingMode !== null}
                      autoComplete="off"
                    />
                  </label>
                  {deleteError ? (
                    <p className={styles.errorText}>{deleteError}</p>
                  ) : null}
                  <div className={styles.modalActions}>'''.replace("            ", ""),
              "confirmation field",
          )

          replace_once(
              '''                className={styles.deleteButton}
                        type="button"
                        disabled={deletingMode !== null}
                        onClick={() => void handleDelete("permanent")}'''.replace("                ", ""),
              '''                className={styles.deleteButton}
                        type="button"
                        disabled={deletingMode !== null || !deleteConfirmMatches}
                        onClick={() => void handleDelete("permanent")}'''.replace("                ", ""),
              "permanent button guard",
          )

          replace_once(
              '''                onClick={() => {
                          setDeleteTarget(null);
                          setDeleteError(null);
                        }}'''.replace("                ", ""),
              '''                onClick={() => {
                          setDeleteTarget(null);
                          setDeleteConfirm("");
                          setDeleteError(null);
                        }}'''.replace("                ", ""),
              "cancel reset",
          )

          path.write_text(text)

          css_path = Path("apps/web/app/app/profiles/profiles-canonical.module.css")
          css = css_path.read_text()
          if ".confirmField {" not in css:
              css += '''

.confirmField {
  display: grid;
  gap: 8px;
  margin-top: 18px;
}

.confirmField span {
  color: #6d6674;
  font-size: 12px;
  line-height: 1.5;
}

.confirmField strong {
  display: block;
  margin-top: 2px;
  color: #2c2732;
  font-weight: 850;
}

.confirmField input {
  min-height: 42px;
  border: 1px solid var(--profiles-border);
  border-radius: 10px;
  background: #fff;
  padding: 0 12px;
  color: var(--profiles-text);
  font: inherit;
  font-size: 13px;
  outline: none;
}

.confirmField input:focus {
  border-color: #bda3f2;
  box-shadow: 0 0 0 3px rgba(109, 50, 232, 0.09);
}

.modalActions button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
'''
          css_path.write_text(css)
          PY

          pnpm exec prettier --write \
            apps/web/app/app/profiles/profiles-client-page.tsx \
            apps/web/app/app/profiles/profiles-canonical.module.css

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/app/profiles/profiles-client-page.tsx \
            apps/web/app/app/profiles/profiles-canonical.module.css

          if ! git diff --cached --quiet; then
            git commit -m "fix(profiles): restore permanent delete name confirmation"
            git push origin HEAD:agent/profiles-canonical-ui
          fi
