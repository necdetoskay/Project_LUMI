name: Temporary Phase 10 Child Avatar Preflight Monitor

on:
  push:
    branches:
      - ops/250-child-avatar-preflight-monitor
    paths:
      - .github/workflows/temporary-phase10-child-avatar-preflight-monitor.yml

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Report product preflight run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --branch fix/250-adventure-child-avatar-selection --workflow temporary-phase10-child-avatar-selection-preflight.yml --limit 5 --json databaseId,status,conclusion,headSha,url)"
          gh issue comment 250 --repo "$GITHUB_REPOSITORY" --body "Child-avatar preflight monitor: \`$runs\`"
