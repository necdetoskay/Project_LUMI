name: tmp phase3 prettier

on:
  push:
    branches:
      - agent/character-genesis-phase3-divergence

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/character-genesis-phase3-divergence
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/profiles/tests/application/creative-genesis-pipeline.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profiles/tests/application/creative-genesis-pipeline.test.ts
          git commit -m "style: format phase3 divergence fixtures"
          git push origin HEAD:agent/character-genesis-phase3-divergence
