name: Temporary ULTEF Trigger Migration

on:
  push:
    branches: [infra/ultef-ci-execution-policy]

permissions:
  contents: read

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/ultef-ci-execution-policy
          fetch-depth: 0
      - name: Move standalone ULTEF workflows off PR commits
        shell: python
        run: |
          from pathlib import Path

          def remove_pull_request_block(text: str) -> str:
              lines = text.splitlines(keepends=True)
              result = []
              skipping = False
              for line in lines:
                  if line.rstrip() == '  pull_request:':
                      skipping = True
                      continue
                  if skipping:
                      if line.startswith('    ') or not line.strip():
                          continue
                      skipping = False
                  result.append(line)
              return ''.join(result)

          root = Path('.github/workflows')
          changed = []
          for path in sorted(root.glob('ultef-*.yml')):
              if path.name == 'ultef-pr-gates.yml':
                  continue
              text = path.read_text()
              if '\n  pull_request:\n' not in text:
                  continue

              if '\n  push:\n' in text:
                  updated = remove_pull_request_block(text)
              else:
                  updated = text.replace('\n  pull_request:\n', '\n  push:\n', 1)

              path.write_text(updated)
              changed.append(str(path))

          offenders = []
          for path in sorted(root.glob('ultef-*.yml')):
              if path.name == 'ultef-pr-gates.yml':
                  continue
              if '\n  pull_request:\n' in path.read_text():
                  offenders.append(f'{path}: still has pull_request trigger')

          if offenders:
              raise SystemExit('\n'.join(offenders))

          print(f'Migrated {len(changed)} standalone ULTEF workflows:')
          print('\n'.join(changed))

      - name: Remove one-shot migration workflow from exported tree
        run: rm .github/workflows/tmp-ultef-trigger-migration.yml
      - name: Upload transformed workflow tree
        uses: actions/upload-artifact@v4
        with:
          name: ultef-workflow-migration
          path: .github/workflows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
