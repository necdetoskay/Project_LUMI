name: Stories Card Locator Fix Temporary

on:
  push:
    branches:
      - test/stories-ux-v2-e2e-closeout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/stories-ux-v2-e2e-closeout
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scope source assertions to candidate cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/tests/e2e/stories-ux-v2.spec.ts')
          text = path.read_text()
          tr_old = '''    await expect(
      page.getByText("Dünyada Bir Şey Oldu", { exact: true }),
    ).toBeVisible();
    await expect(
      page.getByText("Bir Söylenti Duydun", { exact: true }),
    ).toBeVisible();
    await expect(
      page.getByText("Çantandaki Bir Eşya", { exact: true }),
    ).toBeVisible();
    await expect(
      page.getByText("Birinden Gelen Çağrı", { exact: true }),
    ).toBeVisible();'''
          tr_new = '''    const trWorldCard = page
      .getByTestId("adventure-candidate")
      .filter({ hasText: "Parlayan orman" });
    const trRumorCard = page
      .getByTestId("adventure-candidate")
      .filter({ hasText: "Fısıltı" });
    const trItemCard = page
      .getByTestId("adventure-candidate")
      .filter({ hasText: "Pusulanın sırrı" });
    const trNpcCard = page
      .getByTestId("adventure-candidate")
      .filter({ hasText: "Mira çağırıyor" });
    await expect(trWorldCard.getByText(/Dünyada Bir Şey Oldu/)).toBeVisible();
    await expect(trRumorCard.getByText(/Bir Söylenti Duydun/)).toBeVisible();
    await expect(trItemCard.getByText(/Çantandaki Bir Eşya/)).toBeVisible();
    await expect(trNpcCard.getByText(/Birinden Gelen Çağrı/)).toBeVisible();'''
          en_old = '''    await expect(
      page.getByText("Something Happened in the World", { exact: true }),
    ).toBeVisible();
    await expect(
      page.getByText("An Item in Your Bag", { exact: true }),
    ).toBeVisible();
    await expect(
      page.getByText("A Call from Someone", { exact: true }),
    ).toBeVisible();'''
          en_new = '''    const enWorldCard = page
      .getByTestId("adventure-candidate")
      .filter({ hasText: "Parlayan orman" });
    const enItemCard = page
      .getByTestId("adventure-candidate")
      .filter({ hasText: "Pusulanın sırrı" });
    const enNpcCard = page
      .getByTestId("adventure-candidate")
      .filter({ hasText: "Mira çağırıyor" });
    await expect(enWorldCard.getByText(/Something Happened in the World/)).toBeVisible();
    await expect(enItemCard.getByText(/An Item in Your Bag/)).toBeVisible();
    await expect(enNpcCard.getByText(/A Call from Someone/)).toBeVisible();'''
          if tr_old not in text:
            raise SystemExit('missing TR assertion block')
          if en_old not in text:
            raise SystemExit('missing EN assertion block')
          text = text.replace(tr_old, tr_new, 1).replace(en_old, en_new, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/web/tests/e2e/stories-ux-v2.spec.ts
      - name: Commit locator fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/stories-ux-v2.spec.ts
          git commit -m "test(stories): scope source labels to candidate cards"
          git push origin HEAD:test/stories-ux-v2-e2e-closeout
