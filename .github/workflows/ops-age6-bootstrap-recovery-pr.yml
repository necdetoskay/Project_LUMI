name: Ops Age-6 Bootstrap B-C Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".ops/age6-bootstrap-recovery.trigger"

permissions:
  contents: read
  issues: write

jobs:
  validate-production-age6:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://project-lumi-web.vercel.app
      CHILD_PROFILE_ID: c61ddfa0-c149-45a5-98af-71472d0e0ac5
      CHARACTER_ID: 04b06a36-9f72-4b95-a18a-6de3aa077423
      EXPECTED_WORLD_ID: a2370bc0-f704-4e8e-b82b-636a1a9efcfb
      EXPECTED_BOOTSTRAP_RUN_ID: living-world-bootstrap:adee5d1e-e5ce-41f6-be20-b6240cfd770d
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      PARENT_EMAIL: ${{ secrets.LUMI_LONG_HORIZON_PARENT_EMAIL }}
      PARENT_PASSWORD: ${{ secrets.LUMI_LONG_HORIZON_PARENT_PASSWORD }}

    steps:
      - name: Guard production evidence credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$PARENT_EMAIL"
          test -n "$PARENT_PASSWORD"
          echo "Validating existing age-6 production state only; no onboarding generation will run."

      - name: Create temporary Vercel automation bypass
        id: bypass
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          jq -n --arg secret "$secret" '{generate:{secret:$secret,note:"Temporary LUMI age-6 B-C production validation"}}' > "$RUNNER_TEMP/bypass.json"
          curl --fail-with-body --silent --show-error -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/bypass.json" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" >/dev/null
          echo "secret=$secret" >> "$GITHUB_OUTPUT"

      - name: Read production DATABASE_URL without logging it
        id: db
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_ORG_ID" \
            > "$RUNNER_TEMP/vercel-env.json"
          database_url="$(jq -r '.envs[] | select(.key == "DATABASE_URL") | select((.target|type == "string" and .target == "production") or (.target|type == "array" and (.target | index("production") != null))) | .value' "$RUNNER_TEMP/vercel-env.json" | head -n1)"
          if [ -z "$database_url" ] || [ "$database_url" = "null" ]; then
            echo "Production DATABASE_URL could not be resolved" >&2
            exit 1
          fi
          echo "::add-mask::$database_url"
          printf '%s' "$database_url" > "$RUNNER_TEMP/database-url"
          echo "Production DB credential resolved and masked."

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: B — validate completed manifest, NPC and relationship materialization
        id: b
        shell: bash
        run: |
          set -euo pipefail
          database_url="$(cat "$RUNNER_TEMP/database-url")"

          manifest="$(psql "$database_url" -XAt -F '|' -v ON_ERROR_STOP=1 -c "
            SELECT bootstrap_status,
                   bootstrap_run_id,
                   COALESCE(foundation->'bootstrapManifest'->>'status',''),
                   COALESCE(jsonb_array_length(foundation->'bootstrapManifest'->'materialized'),0),
                   world_id
            FROM profile.character_foundations
            WHERE character_id = '$CHARACTER_ID';")"
          test -n "$manifest"
          IFS='|' read -r db_status run_id manifest_status materialized_count world_id <<< "$manifest"
          test "$db_status" = "completed"
          test "$manifest_status" = "completed"
          test "$run_id" = "$EXPECTED_BOOTSTRAP_RUN_ID"
          test "$world_id" = "$EXPECTED_WORLD_ID"
          test "$materialized_count" -gt 0

          household_id="$(psql "$database_url" -XAt -v ON_ERROR_STOP=1 -c "SELECT household_id FROM profile.lumi_characters WHERE id='$CHARACTER_ID' AND deleted_at IS NULL;")"
          test -n "$household_id"

          npc_count="$(psql "$database_url" -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM profile.lumi_characters
            WHERE household_id='$household_id'
              AND child_profile_id='$CHILD_PROFILE_ID'
              AND character_subtype='npc'
              AND deleted_at IS NULL;")"
          test "$npc_count" -gt 0

          npc_ids="$(psql "$database_url" -XAt -v ON_ERROR_STOP=1 -c "
            SELECT string_agg(id::text, ',') FROM profile.lumi_characters
            WHERE household_id='$household_id'
              AND child_profile_id='$CHILD_PROFILE_ID'
              AND character_subtype='npc'
              AND deleted_at IS NULL;")"

          relationship_count="$(psql "$database_url" -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*)
            FROM profile.character_relationships r
            JOIN profile.lumi_characters npc ON npc.id = r.target_character_id
            WHERE r.character_id='$CHARACTER_ID'
              AND npc.character_subtype='npc'
              AND npc.deleted_at IS NULL
              AND r.custom_type_label LIKE 'living-world-bootstrap:v1:%';")"
          test "$relationship_count" -gt 0

          manifest_npc_refs="$(psql "$database_url" -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM profile.character_foundations f,
                 jsonb_array_elements(f.foundation->'bootstrapManifest'->'materialized') AS ref
            WHERE f.character_id='$CHARACTER_ID' AND ref->>'kind'='npc';")"
          manifest_relationship_refs="$(psql "$database_url" -XAt -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM profile.character_foundations f,
                 jsonb_array_elements(f.foundation->'bootstrapManifest'->'materialized') AS ref
            WHERE f.character_id='$CHARACTER_ID' AND ref->>'kind'='relationship';")"
          test "$manifest_npc_refs" -gt 0
          test "$manifest_relationship_refs" -gt 0

          echo "household_id=$household_id" >> "$GITHUB_OUTPUT"
          echo "manifest_status=$manifest_status" >> "$GITHUB_OUTPUT"
          echo "materialized_count=$materialized_count" >> "$GITHUB_OUTPUT"
          echo "npc_count=$npc_count" >> "$GITHUB_OUTPUT"
          echo "npc_ids=$npc_ids" >> "$GITHUB_OUTPUT"
          echo "relationship_count=$relationship_count" >> "$GITHUB_OUTPUT"
          echo "manifest_npc_refs=$manifest_npc_refs" >> "$GITHUB_OUTPUT"
          echo "manifest_relationship_refs=$manifest_relationship_refs" >> "$GITHUB_OUTPUT"
          echo "B PASS: manifest completed; NPC and relationship rows are materialized."

      - name: C — validate real New Adventure candidates
        id: c
        shell: bash
        env:
          HOUSEHOLD_ID: ${{ steps.b.outputs.household_id }}
          BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
        run: |
          set -euo pipefail
          cookie="$RUNNER_TEMP/lumi-cookie.jar"
          common=(-H "x-vercel-protection-bypass: $BYPASS_SECRET" -H 'x-vercel-set-bypass-cookie: true')
          jq -nc --arg email "$PARENT_EMAIL" --arg password "$PARENT_PASSWORD" '{email:$email,password:$password}' > "$RUNNER_TEMP/login.json"
          curl --fail-with-body --silent --show-error "${common[@]}" \
            --cookie-jar "$cookie" --cookie "$cookie" -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/login.json" "$BASE_URL/api/auth/login" > "$RUNNER_TEMP/login-response.json"
          jq -e '.parent.id' "$RUNNER_TEMP/login-response.json" >/dev/null

          curl --fail-with-body --silent --show-error "${common[@]}" --cookie "$cookie" \
            "$BASE_URL/api/child-profiles/$CHILD_PROFILE_ID/stories/adventure-candidates?householdId=$HOUSEHOLD_ID" \
            > "$RUNNER_TEMP/candidates.json"
          candidate_count="$(jq '.candidates | length' "$RUNNER_TEMP/candidates.json")"
          test "$candidate_count" -gt 0
          source_families="$(jq -r '[.candidates[].sourceFamily] | unique | join(",")' "$RUNNER_TEMP/candidates.json")"
          real_source_count="$(jq '[.candidates[] | select(.sourceFamily == "npc_call" or .sourceFamily == "world_event" or .sourceFamily == "rumor" or .sourceFamily == "inventory_item")] | length' "$RUNNER_TEMP/candidates.json")"
          test "$real_source_count" -gt 0
          echo "candidate_count=$candidate_count" >> "$GITHUB_OUTPUT"
          echo "real_source_count=$real_source_count" >> "$GITHUB_OUTPUT"
          echo "source_families=$source_families" >> "$GITHUB_OUTPUT"
          echo "C PASS: real New Adventure candidates are present."

      - name: Report B-C evidence to #250
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_STATUS: ${{ steps.b.outputs.manifest_status }}
          MATERIALIZED_COUNT: ${{ steps.b.outputs.materialized_count }}
          NPC_COUNT: ${{ steps.b.outputs.npc_count }}
          NPC_IDS: ${{ steps.b.outputs.npc_ids }}
          RELATIONSHIP_COUNT: ${{ steps.b.outputs.relationship_count }}
          MANIFEST_NPC_REFS: ${{ steps.b.outputs.manifest_npc_refs }}
          MANIFEST_REL_REFS: ${{ steps.b.outputs.manifest_relationship_refs }}
          CANDIDATE_COUNT: ${{ steps.c.outputs.candidate_count }}
          REAL_SOURCE_COUNT: ${{ steps.c.outputs.real_source_count }}
          SOURCE_FAMILIES: ${{ steps.c.outputs.source_families }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg character "$CHARACTER_ID" --arg manifest "$MANIFEST_STATUS" \
            --arg materialized "$MATERIALIZED_COUNT" --arg npcs "$NPC_COUNT" --arg npcIds "$NPC_IDS" \
            --arg rels "$RELATIONSHIP_COUNT" --arg npcRefs "$MANIFEST_NPC_REFS" --arg relRefs "$MANIFEST_REL_REFS" \
            --arg candidates "$CANDIDATE_COUNT" --arg realSources "$REAL_SOURCE_COUNT" --arg families "$SOURCE_FAMILIES" \
            --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{body:("## #250 B-C production evidence\n\n**B — Bootstrap manifest: PASS**\n- character: `"+$character+"`\n- manifest status: `"+$manifest+"`\n- materialized refs: `"+$materialized+"`\n- NPC rows: `"+$npcs+"`\n- NPC ids: `"+$npcIds+"`\n- bootstrap relationship rows: `"+$rels+"`\n- manifest NPC refs: `"+$npcRefs+"`\n- manifest relationship refs: `"+$relRefs+"`\n\n**C — New Adventure: PASS**\n- candidates: `"+$candidates+"`\n- real-source candidates: `"+$realSources+"`\n- source families: `"+$families+"`\n\nProduction was read-only for B; C only authenticated and read the candidate endpoint. No fresh onboarding/model generation was started.\n\nRun: "+$run)}' > "$RUNNER_TEMP/comment.json"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/comment.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/250/comments" >/dev/null

      - name: Revoke temporary Vercel automation bypass
        if: always() && steps.bypass.outputs.secret != ''
        env:
          BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
        shell: bash
        run: |
          jq -n --arg secret "$BYPASS_SECRET" '{revoke:{secret:$secret,regenerate:false}}' > "$RUNNER_TEMP/revoke.json"
          curl --silent --show-error -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/revoke.json" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" >/dev/null || true
