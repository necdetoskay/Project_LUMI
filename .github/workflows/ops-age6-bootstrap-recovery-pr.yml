name: Ops Age-6 Bootstrap Recovery PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".ops/age6-bootstrap-recovery.trigger"

permissions:
  contents: read
  issues: write

jobs:
  recover-existing-age6:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_URL: https://project-lumi-web.vercel.app
      CHILD_PROFILE_ID: c61ddfa0-c149-45a5-98af-71472d0e0ac5
      PARENT_EMAIL: ${{ secrets.LUMI_LONG_HORIZON_PARENT_EMAIL }}
      PARENT_PASSWORD: ${{ secrets.LUMI_LONG_HORIZON_PARENT_PASSWORD }}
    steps:
      - name: Recover existing completed age-6 character
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PARENT_EMAIL" && test -n "$PARENT_PASSWORD"
          cookie="$RUNNER_TEMP/cookie.jar"
          jq -nc --arg email "$PARENT_EMAIL" --arg password "$PARENT_PASSWORD" '{email:$email,password:$password}' > "$RUNNER_TEMP/login.json"
          curl --fail-with-body --silent --show-error --cookie-jar "$cookie" --cookie "$cookie" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/login.json" "$BASE_URL/api/auth/login" > "$RUNNER_TEMP/login-response.json"
          jq -e '.parent.id' "$RUNNER_TEMP/login-response.json" >/dev/null
          curl --fail-with-body --silent --show-error --cookie "$cookie" "$BASE_URL/api/onboarding" > "$RUNNER_TEMP/onboarding.json"
          household_id="$(jq -r '.onboarding.householdId // empty' "$RUNNER_TEMP/onboarding.json")"
          test -n "$household_id"
          curl --fail-with-body --silent --show-error --cookie "$cookie" "$BASE_URL/api/characters?householdId=$household_id&childProfileId=$CHILD_PROFILE_ID" > "$RUNNER_TEMP/characters-before.json"
          before="$(jq -r '.characters[0].id // empty' "$RUNNER_TEMP/characters-before.json")"
          test -n "$before"
          curl --fail-with-body --silent --show-error --cookie "$cookie" "$BASE_URL/api/character-creation/canonical?householdId=$household_id&childProfileId=$CHILD_PROFILE_ID" > "$RUNNER_TEMP/cycle.json"
          jq -e '.cycle.status == "completed" and .cycle.currentStep == "completed"' "$RUNNER_TEMP/cycle.json" >/dev/null
          committed="$(jq -r '.cycle.latestSummary.committedCharacterId // empty' "$RUNNER_TEMP/cycle.json")"
          test "$committed" = "$before"
          jq -nc --arg householdId "$household_id" --arg childProfileId "$CHILD_PROFILE_ID" '{action:"finalize",householdId:$householdId,childProfileId:$childProfileId}' > "$RUNNER_TEMP/finalize.json"
          curl --fail-with-body --silent --show-error --cookie "$cookie" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/finalize.json" "$BASE_URL/api/character-creation/canonical" > "$RUNNER_TEMP/finalize-response.json"
          after="$(jq -r '.characterId // empty' "$RUNNER_TEMP/finalize-response.json")"
          test -n "$after" && test "$after" = "$before"
          jq -e '.bootstrap.status == "pending" and .bootstrap.manifestStatus == "pending"' "$RUNNER_TEMP/finalize-response.json" >/dev/null
          sleep 20
          curl --fail-with-body --silent --show-error --cookie "$cookie" "$BASE_URL/api/child-profiles/$CHILD_PROFILE_ID/stories/adventure-candidates?householdId=$household_id" > "$RUNNER_TEMP/candidates.json"
          candidate_count="$(jq '.candidates | length' "$RUNNER_TEMP/candidates.json")"
          sources="$(jq -r '[.candidates[].sourceFamily] | unique | join(",")' "$RUNNER_TEMP/candidates.json")"
          echo "household_id=$household_id" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "candidate_count=$candidate_count" >> "$GITHUB_OUTPUT"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

      - name: Report to #250
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          HOUSEHOLD_ID: ${{ steps.recover.outputs.household_id }}
          BEFORE: ${{ steps.recover.outputs.before }}
          AFTER: ${{ steps.recover.outputs.after }}
          CANDIDATE_COUNT: ${{ steps.recover.outputs.candidate_count }}
          SOURCES: ${{ steps.recover.outputs.sources }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg status "$STATUS" --arg profile "$CHILD_PROFILE_ID" --arg household "$HOUSEHOLD_ID" --arg before "$BEFORE" --arg after "$AFTER" --arg candidates "$CANDIDATE_COUNT" --arg sources "$SOURCES" --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{body:("## Age-6 production bootstrap recovery evidence\n\n- job: **"+$status+"**\n- profile: `"+$profile+"`\n- household: `"+$household+"`\n- character before: `"+$before+"`\n- character returned by recovery finalize: `"+$after+"`\n- same-character recovery: **"+(if ($before != "" and $before == $after) then "PASS" else "FAIL/UNKNOWN" end)+"**\n- adventure candidates after recovery: `"+$candidates+"`\n- source families: `"+$sources+"`\n- run: "+$run+"\n\nNo fresh paid onboarding was started; this only re-finalized the persisted completed age-6 cycle.")}' > "$RUNNER_TEMP/comment.json"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/comment.json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/250/comments" >/dev/null
