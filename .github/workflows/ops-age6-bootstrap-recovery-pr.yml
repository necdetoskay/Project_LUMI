name: Ops Age-6 Bootstrap B-C Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".ops/age6-bootstrap-recovery.trigger"

permissions:
  contents: read
  issues: write

jobs:
  validate-production-age6:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://project-lumi-web.vercel.app
      CHILD_PROFILE_ID: c61ddfa0-c149-45a5-98af-71472d0e0ac5
      CHARACTER_ID: 04b06a36-9f72-4b95-a18a-6de3aa077423
      EXPECTED_WORLD_ID: a2370bc0-f704-4e8e-b82b-636a1a9efcfb
      EXPECTED_BOOTSTRAP_RUN_ID: living-world-bootstrap:adee5d1e-e5ce-41f6-be20-b6240cfd770d
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      PARENT_EMAIL: ${{ secrets.LUMI_LONG_HORIZON_PARENT_EMAIL }}
      PARENT_PASSWORD: ${{ secrets.LUMI_LONG_HORIZON_PARENT_PASSWORD }}

    steps:
      - name: Guard production evidence credentials
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$PARENT_EMAIL" && test -n "$PARENT_PASSWORD"
          echo "Read-only production B validation; C runs only after B passes."

      - name: Create temporary Vercel automation bypass
        id: bypass
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          jq -n --arg secret "$secret" '{generate:{secret:$secret,note:"Temporary LUMI age-6 B-C validation"}}' > "$RUNNER_TEMP/bypass.json"
          curl --fail-with-body --silent --show-error -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/bypass.json" "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" >/dev/null
          echo "secret=$secret" >> "$GITHUB_OUTPUT"

      - name: Pull masked production DATABASE_URL with Vercel CLI
        run: |
          set -euo pipefail
          mkdir -p .vercel
          jq -n --arg orgId "$VERCEL_ORG_ID" --arg projectId "$VERCEL_PROJECT_ID" '{orgId:$orgId,projectId:$projectId}' > .vercel/project.json
          npx --yes vercel@latest env pull "$RUNNER_TEMP/.env.production" --environment=production --yes --token="$VERCEL_TOKEN" >/dev/null
          set -a
          source "$RUNNER_TEMP/.env.production"
          set +a
          test -n "${DATABASE_URL:-}"
          echo "::add-mask::$DATABASE_URL"
          printf '%s' "$DATABASE_URL" > "$RUNNER_TEMP/database-url"
          echo "Production DATABASE_URL pulled and masked."

      - name: Ensure PostgreSQL client
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; fi
          psql --version

      - name: B — validate completed manifest, NPC and relationship materialization
        id: b
        run: |
          set -euo pipefail
          db="$(cat "$RUNNER_TEMP/database-url")"
          manifest="$(psql "$db" -XAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT bootstrap_status,bootstrap_run_id,COALESCE(foundation->'bootstrapManifest'->>'status',''),COALESCE(jsonb_array_length(foundation->'bootstrapManifest'->'materialized'),0),world_id FROM profile.character_foundations WHERE character_id='$CHARACTER_ID';")"
          test -n "$manifest"
          IFS='|' read -r db_status run_id manifest_status materialized_count world_id <<< "$manifest"
          test "$db_status" = completed
          test "$manifest_status" = completed
          test "$run_id" = "$EXPECTED_BOOTSTRAP_RUN_ID"
          test "$world_id" = "$EXPECTED_WORLD_ID"
          test "$materialized_count" -gt 0
          household_id="$(psql "$db" -XAt -v ON_ERROR_STOP=1 -c "SELECT household_id FROM profile.lumi_characters WHERE id='$CHARACTER_ID' AND deleted_at IS NULL;")"
          test -n "$household_id"
          npc_count="$(psql "$db" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM profile.lumi_characters WHERE household_id='$household_id' AND child_profile_id='$CHILD_PROFILE_ID' AND character_subtype='npc' AND deleted_at IS NULL;")"
          relationship_count="$(psql "$db" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM profile.character_relationships r JOIN profile.lumi_characters n ON n.id=r.target_character_id WHERE r.character_id='$CHARACTER_ID' AND n.character_subtype='npc' AND n.deleted_at IS NULL AND r.custom_type_label LIKE 'living-world-bootstrap:v1:%';")"
          npc_refs="$(psql "$db" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM profile.character_foundations f,jsonb_array_elements(f.foundation->'bootstrapManifest'->'materialized') ref WHERE f.character_id='$CHARACTER_ID' AND ref->>'kind'='npc';")"
          relationship_refs="$(psql "$db" -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM profile.character_foundations f,jsonb_array_elements(f.foundation->'bootstrapManifest'->'materialized') ref WHERE f.character_id='$CHARACTER_ID' AND ref->>'kind'='relationship';")"
          test "$npc_count" -gt 0 && test "$relationship_count" -gt 0 && test "$npc_refs" -gt 0 && test "$relationship_refs" -gt 0
          npc_ids="$(psql "$db" -XAt -v ON_ERROR_STOP=1 -c "SELECT string_agg(id::text,',') FROM profile.lumi_characters WHERE household_id='$household_id' AND child_profile_id='$CHILD_PROFILE_ID' AND character_subtype='npc' AND deleted_at IS NULL;")"
          echo "household_id=$household_id" >> "$GITHUB_OUTPUT"
          echo "manifest_status=$manifest_status" >> "$GITHUB_OUTPUT"
          echo "materialized_count=$materialized_count" >> "$GITHUB_OUTPUT"
          echo "npc_count=$npc_count" >> "$GITHUB_OUTPUT"
          echo "npc_ids=$npc_ids" >> "$GITHUB_OUTPUT"
          echo "relationship_count=$relationship_count" >> "$GITHUB_OUTPUT"
          echo "npc_refs=$npc_refs" >> "$GITHUB_OUTPUT"
          echo "relationship_refs=$relationship_refs" >> "$GITHUB_OUTPUT"
          echo "B PASS: completed manifest + NPC + relationship materialized."

      - name: C — validate real New Adventure candidates
        id: c
        env:
          HOUSEHOLD_ID: ${{ steps.b.outputs.household_id }}
          BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
        run: |
          set -euo pipefail
          cookie="$RUNNER_TEMP/cookie.jar"
          jq -nc --arg email "$PARENT_EMAIL" --arg password "$PARENT_PASSWORD" '{email:$email,password:$password}' > "$RUNNER_TEMP/login.json"
          curl --fail-with-body --silent --show-error -H "x-vercel-protection-bypass: $BYPASS_SECRET" -H 'x-vercel-set-bypass-cookie: true' --cookie-jar "$cookie" --cookie "$cookie" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/login.json" "$BASE_URL/api/auth/login" > "$RUNNER_TEMP/login-response.json"
          jq -e '.parent.id' "$RUNNER_TEMP/login-response.json" >/dev/null
          curl --fail-with-body --silent --show-error -H "x-vercel-protection-bypass: $BYPASS_SECRET" -H 'x-vercel-set-bypass-cookie: true' --cookie "$cookie" "$BASE_URL/api/child-profiles/$CHILD_PROFILE_ID/stories/adventure-candidates?householdId=$HOUSEHOLD_ID" > "$RUNNER_TEMP/candidates.json"
          candidate_count="$(jq '.candidates | length' "$RUNNER_TEMP/candidates.json")"
          real_source_count="$(jq '[.candidates[] | select(.sourceFamily == "npc_call" or .sourceFamily == "world_event" or .sourceFamily == "rumor" or .sourceFamily == "inventory_item")] | length' "$RUNNER_TEMP/candidates.json")"
          source_families="$(jq -r '[.candidates[].sourceFamily] | unique | join(",")' "$RUNNER_TEMP/candidates.json")"
          test "$candidate_count" -gt 0 && test "$real_source_count" -gt 0
          echo "candidate_count=$candidate_count" >> "$GITHUB_OUTPUT"
          echo "real_source_count=$real_source_count" >> "$GITHUB_OUTPUT"
          echo "source_families=$source_families" >> "$GITHUB_OUTPUT"
          echo "C PASS: real New Adventure candidates present."

      - name: Report B-C evidence to #250
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_STATUS: ${{ steps.b.outputs.manifest_status }}
          MATERIALIZED_COUNT: ${{ steps.b.outputs.materialized_count }}
          NPC_COUNT: ${{ steps.b.outputs.npc_count }}
          NPC_IDS: ${{ steps.b.outputs.npc_ids }}
          RELATIONSHIP_COUNT: ${{ steps.b.outputs.relationship_count }}
          NPC_REFS: ${{ steps.b.outputs.npc_refs }}
          RELATIONSHIP_REFS: ${{ steps.b.outputs.relationship_refs }}
          CANDIDATE_COUNT: ${{ steps.c.outputs.candidate_count }}
          REAL_SOURCE_COUNT: ${{ steps.c.outputs.real_source_count }}
          SOURCE_FAMILIES: ${{ steps.c.outputs.source_families }}
        run: |
          set -euo pipefail
          jq -n --arg m "$MANIFEST_STATUS" --arg mat "$MATERIALIZED_COUNT" --arg npcs "$NPC_COUNT" --arg ids "$NPC_IDS" --arg rels "$RELATIONSHIP_COUNT" --arg nr "$NPC_REFS" --arg rr "$RELATIONSHIP_REFS" --arg cc "$CANDIDATE_COUNT" --arg rc "$REAL_SOURCE_COUNT" --arg sf "$SOURCE_FAMILIES" --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{body:("## #250 B-C production evidence\n\n**B — PASS**\n- manifest: `"+$m+"`\n- materialized refs: `"+$mat+"`\n- NPC rows: `"+$npcs+"` (`"+$ids+"`)\n- bootstrap relationships: `"+$rels+"`\n- manifest NPC refs: `"+$nr+"`\n- manifest relationship refs: `"+$rr+"`\n\n**C — PASS**\n- candidates: `"+$cc+"`\n- real-source candidates: `"+$rc+"`\n- source families: `"+$sf+"`\n\nNo fresh onboarding/model generation was started. Run: "+$run)}' > "$RUNNER_TEMP/comment.json"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/comment.json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/250/comments" >/dev/null

      - name: Revoke temporary Vercel automation bypass
        if: always() && steps.bypass.outputs.secret != ''
        env:
          BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
        run: |
          jq -n --arg secret "$BYPASS_SECRET" '{revoke:{secret:$secret,regenerate:false}}' > "$RUNNER_TEMP/revoke.json"
          curl --silent --show-error -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/revoke.json" "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" >/dev/null || true
