name: Temporary Phase6 Prettier

on:
  push:
    branches:
      - agent/character-genesis-phase6-living-world-bootstrap

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/character-genesis-phase6-living-world-bootstrap
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 6 files
        run: >-
          pnpm exec prettier --write
          apps/web/lib/character-onboarding/living-world-bootstrap.service.ts
          packages/profiles/src/application/living-world-bootstrap-profile-materializer.service.ts
          packages/profiles/src/application/living-world-bootstrap.service.ts
          packages/profiles/tests/application/living-world-bootstrap.service.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/character-onboarding/living-world-bootstrap.service.ts packages/profiles/src/application/living-world-bootstrap-profile-materializer.service.ts packages/profiles/src/application/living-world-bootstrap.service.ts packages/profiles/tests/application/living-world-bootstrap.service.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(genesis): format living world bootstrap"
          git push origin HEAD:agent/character-genesis-phase6-living-world-bootstrap
