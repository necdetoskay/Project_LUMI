name: tmp phase6 prettier

on:
  push:
    branches:
      - agent/character-genesis-phase6-living-world-bootstrap

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/character-genesis-phase6-living-world-bootstrap
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/tests/e2e/character-onboarding-m7.spec.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet -- apps/web/tests/e2e/character-onboarding-m7.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/character-onboarding-m7.spec.ts
          git commit -m "style(genesis): format phase6 M7 assertions"
          git push origin HEAD:agent/character-genesis-phase6-living-world-bootstrap
