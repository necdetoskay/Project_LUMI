name: Test Lab Run Usage Cost Fix One Shot

on:
  push:
    branches:
      - feat/test-lab-run-usage-cost
    paths:
      - .github/workflows/test-lab-run-usage-cost-fix-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/test-lab-run-usage-cost
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-test-lab-run-usage-cost.mjs
      - run: pnpm exec prettier --write apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx
      - run: pnpm --filter @lumi/web typecheck
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(test-lab): show USD symbol for run costs"
          git push origin HEAD:feat/test-lab-run-usage-cost
