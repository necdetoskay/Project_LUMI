name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate ULTEF L8 scenario evaluators
        run: pnpm ultef:l8-scenario-selftest
      - name: Validate ULTEF L8 semantic rubric parser
        run: pnpm ultef:l8-semantic-selftest
      - name: Validate ULTEF L8 semantic calibration metrics
        run: pnpm ultef:l8-semantic-calibration-selftest
      - name: Validate ULTEF L8 semantic calibration stability
        run: pnpm ultef:l8-semantic-stability-selftest
      - name: Validate ULTEF L8 scorecard performance scoring
        run: pnpm ultef:l8-scorecard-scoring-selftest
      - name: Run ULTEF L9 long-horizon continuity journey
        run: pnpm ultef:l9-long-horizon
      - name: Run ULTEF L9 provider failover routing contract
        run: pnpm ultef:l9-provider-failover
      - run: pnpm format:check
      - name: Diagnose observability Prettier diff
        if: failure()
        run: |
          pnpm exec prettier --write apps/web/tests/ultef-l9-observability.test.ts
          git diff -- apps/web/tests/ultef-l9-observability.test.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run load smoke (non-blocking)
        continue-on-error: true
        run: pnpm --filter @lumi/web test:load
      - name: Load gate check (soft-failure)
        continue-on-error: true
        shell: bash
        run: |
          REPORT="apps/web/coverage/load/s21-t01-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "::warning::load report missing — gate skipped"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("apps/web/coverage/load/s21-t01-report.json","utf8"));
            const p95 = r.latency?.p95 ?? 0;
            const fivexx = r.failed5xx ?? 0;
            const ok = r.okRate ?? 1;
            const issues = [];
            if (p95 > 500) issues.push(`p95 ${p95}ms > 500ms`);
            if (fivexx > 0) issues.push(`${fivexx} 5xx`);
            if (ok < 0.95) issues.push(`okRate ${ok} < 0.95`);
            if (issues.length) {
              console.log(`::warning::S21 load gate: ${issues.join(", ")}`);
            } else {
              console.log(`::notice::S21 load gate OK (p95=${p95}ms, 5xx=${fivexx}, okRate=${ok})`);
            }
          '
      - run: pnpm build

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set version
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels)
        id: docker-metadata
        uses: docker/metadata-action@v5
        with:
          images: lumi-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.docker-metadata.outputs.created }}
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://lumi.local
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_COMMIT_SHA=${{ github.sha }}
