name: Context Production E2E

on:
  push:
    branches:
      - agent/context-production-e2e-workflow
    paths:
      - apps/web/lib/ai/**
      - apps/web/lib/story/**
      - apps/web/tests/context-db-production-live-e2e.test.ts
      - apps/web/tests/ultef-s37-hook-reader-production.v3.integration.test.ts
      - apps/web/package.json
      - packages/context/**
      - packages/story/**
      - packages/profiles/**
      - packages/world/**
      - packages/npc-intelligence/**
      - .github/workflows/context-production-e2e.yml
      - .github/workflows/ultef-s37-hook-reader.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-production-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  production-e2e:
    name: DB-backed live production E2E
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_context_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_context_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_context_test
      PROFILE_DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_context_test
      STORY_TEST_DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_context_test
      STORY_TEST_ENABLE_DESTRUCTIVE: "true"
      LUMI_LIVE_DB_E2E: "1"
      LUMI_SETTINGS_ENCRYPTION_KEY: context-production-e2e-test-encryption-key-only
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Require live OpenRouter secret
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY repository secret is required."
            exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare profile schema
        run: pnpm --filter @lumi/profiles profile:migrate
      - name: Prepare world schema
        run: pnpm --filter @lumi/world world:migrate
      - name: Prepare story schema
        run: pnpm --filter @lumi/story story:migrate
      - name: Prepare NPC intelligence schema
        run: pnpm --filter @lumi/npc-intelligence npc:migrate
      - name: Verify S37 production wiring regression
        env:
          ULTEF_SCENARIO: PX-LUMI-S37-HOOK-READER-PROD-001
        run: pnpm --filter @lumi/web ultef:s37-hook-reader
      - name: Run real Context production E2E
        run: pnpm --filter @lumi/web test:context:production-e2e
