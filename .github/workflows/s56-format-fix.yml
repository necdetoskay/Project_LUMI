name: Temporary S56 Format Fix

on:
  push:
    branches:
      - s56/image-generation-platform

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s56/image-generation-platform
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            packages/profiles/src/adapters/openrouter-image-generation.ts \
            packages/profiles/src/application/image-generation-platform.ts \
            packages/profiles/src/application/image-generation-platform.test.ts \
            packages/profiles/src/application/image-generation.service.ts \
            packages/profiles/src/db/schema/profile/image-generation.ts \
            apps/web/lib/assets/managed-image-storage.ts \
            docs/07-delivery/lumi/sprint-56/SPRINT_SPEC.md
          rm .github/workflows/s56-format-fix.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profiles/src/adapters/openrouter-image-generation.ts packages/profiles/src/application/image-generation-platform.ts packages/profiles/src/application/image-generation-platform.test.ts packages/profiles/src/application/image-generation.service.ts packages/profiles/src/db/schema/profile/image-generation.ts apps/web/lib/assets/managed-image-storage.ts docs/07-delivery/lumi/sprint-56/SPRINT_SPEC.md .github/workflows/s56-format-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(s56): format image generation platform"
          git push
