name: Temporary 250 Adventure Poll Lifecycle Monitor

on:
  push:
    branches:
      - fix/250-adventure-poll-lifecycle
    paths:
      - .github/workflows/temporary-250-poll-lifecycle-monitor.yml

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Report exact preflight run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow temporary-250-poll-lifecycle-patch-preflight.yml \
            --branch fix/250-adventure-poll-lifecycle \
            --event push --limit 1 \
            --json databaseId,status,conclusion,headSha,url)"
          gh issue comment 250 --repo "$GITHUB_REPOSITORY" \
            --body "Adventure poll lifecycle preflight monitor: \`$result\`"
