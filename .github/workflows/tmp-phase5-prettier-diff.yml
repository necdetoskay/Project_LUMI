name: Temporary Phase 5 Prettier Diff

on:
  push:
    branches:
      - agent/test-lab-phase-5-stateful-story

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/web/app/api/settings/test-lab/route.ts \
            apps/web/lib/ai/story-test-lab-adapter.ts \
            packages/ai/src/test-lab/application/story-sandbox-context.ts \
            packages/ai/tests/story-sandbox-context.test.ts
          git diff --no-ext-diff -- \
            apps/web/app/api/settings/test-lab/route.ts \
            apps/web/lib/ai/story-test-lab-adapter.ts \
            packages/ai/src/test-lab/application/story-sandbox-context.ts \
            packages/ai/tests/story-sandbox-context.test.ts
          exit 1
