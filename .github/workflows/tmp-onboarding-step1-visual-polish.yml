name: tmp-onboarding-step1-visual-polish
on:
  push:
    branches:
      - feat/onboarding-step1-visual-polish
permissions:
  contents: write
jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/onboarding-step1-visual-polish
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply visual patch
        run: python scripts/tmp-onboarding-step1-visual-polish.py
      - name: Format
        run: pnpm exec prettier --write 'apps/web/app/app/profiles/[childProfileId]/characters/new/type/character-type-step-client.tsx'
      - name: Focused lint
        run: pnpm exec eslint 'apps/web/app/app/profiles/[childProfileId]/characters/new/type/character-type-step-client.tsx' 'apps/web/tests/character-onboarding-type-step.test.tsx'
      - name: Typecheck
        run: pnpm --filter @lumi/web typecheck
      - name: Focused test
        run: pnpm --filter @lumi/web exec vitest run tests/character-onboarding-type-step.test.tsx
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/web/app/app/profiles/[childProfileId]/characters/new/type/character-type-step-client.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(onboarding): polish Step 1 illustrated character cards'
          git push origin HEAD:feat/onboarding-step1-visual-polish
