name: ULTEF S44 Memory Production

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_ultef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_ultef_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_ultef_test
      STORY_TEST_DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_ultef_test
      STORY_TEST_ENABLE_DESTRUCTIVE: "true"
      NODE_ENV: test
      ULTEF_SCENARIO: PX-LUMI-S44-MEMORY-PRODUCTION-001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare NPC intelligence schema
        run: pnpm --filter @lumi/npc-intelligence npc:migrate
      - name: Run S44 DB-backed memory production evidence
        run: pnpm --filter @lumi/web ultef:s44-memory-production
      - name: Print S44 evidence
        if: always()
        shell: bash
        run: |
          FILE=$(find artifacts/ultef/runs -name 'PX-LUMI-S44-MEMORY-PRODUCTION-001.md' -type f 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$FILE" ]; then
            cat "$FILE"
          else
            echo "PX-LUMI-S44-MEMORY-PRODUCTION-001 evidence was not produced."
          fi
      - name: Upload S44 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultef-s44-memory-production-evidence
          path: artifacts/ultef/
          if-no-files-found: warn
          retention-days: 14
