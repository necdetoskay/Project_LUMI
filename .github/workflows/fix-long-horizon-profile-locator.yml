name: Fix long-horizon profile locator

on:
  push:
    branches:
      - fix/long-horizon-profile-locator

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply scoped profile locator') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/long-horizon-profile-locator
      - name: Patch locator and remove helper workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts')
          s = p.read_text()
          old = '      await page.getByRole("link", { name: "Profil", exact: true }).click();'
          new = '''      await page\n        .getByLabel("Çocuk deneyimi")\n        .getByRole("link", { name: "Profil", exact: true })\n        .click();'''
          if old not in s:
              raise SystemExit('target locator not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-long-horizon-profile-locator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts
          git commit -m "test(long-horizon): apply scoped profile locator"
          git push
