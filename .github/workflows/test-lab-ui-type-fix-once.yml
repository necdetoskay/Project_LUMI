name: Test Lab UI Type Fix Once

on:
  push:
    branches:
      - agent/test-lab-canonical-ui-1
    paths:
      - .github/workflows/test-lab-ui-type-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-lab-canonical-ui-1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix exact optional Icon className type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/app/app/settings/test-lab/canonical-dashboard.tsx")
          text = path.read_text()
          old = "className?: string"
          new = "className?: string | undefined"
          if old not in text:
              raise SystemExit("expected Icon className type not found")
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/app/app/settings/test-lab/canonical-dashboard.tsx
          rm .github/workflows/test-lab-ui-type-fix-once.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/canonical-dashboard.tsx \
            .github/workflows/test-lab-ui-type-fix-once.yml
          git commit -m "fix(test-lab): satisfy exact optional icon props"
          git push origin HEAD:agent/test-lab-canonical-ui-1
