name: Test Lab Phase2 Format Probe

on:
  pull_request:
    paths:
      - ".github/workflows/test-lab-phase2-format-probe.yml"
      - "packages/ai/**"

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 2 files
        run: |
          pnpm exec prettier --write \
            packages/ai/src/infrastructure/providers/openrouter-provider.ts \
            packages/ai/src/test-lab/application/test-lab-coordinator.ts \
            packages/ai/src/test-lab/domain/model-profile.ts \
            packages/ai/src/test-lab/infrastructure/openrouter-model-catalog.ts
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-prettier-files
          path: |
            packages/ai/src/infrastructure/providers/openrouter-provider.ts
            packages/ai/src/test-lab/application/test-lab-coordinator.ts
            packages/ai/src/test-lab/domain/model-profile.ts
            packages/ai/src/test-lab/infrastructure/openrouter-model-catalog.ts
          if-no-files-found: error
