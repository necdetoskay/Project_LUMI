name: S42 Prettier Fix

on:
  push:
    branches: [s42/character-creation-origin-visual-canon-clean]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s42/character-creation-origin-visual-canon-clean
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: pnpm exec prettier --write apps/web/app/app/character-onboarding/character-onboarding-client-page.tsx apps/web/tests/e2e/ultef-s42-character-creation.spec.ts .github/workflows/ultef-s42-character-creation.yml
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/character-onboarding/character-onboarding-client-page.tsx apps/web/tests/e2e/ultef-s42-character-creation.spec.ts .github/workflows/ultef-s42-character-creation.yml
          git commit -m "style(s42): apply repository prettier output"
          git push origin HEAD:s42/character-creation-origin-visual-canon-clean
