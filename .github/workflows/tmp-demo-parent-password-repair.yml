name: Temporary Demo Preview Login Verification

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: read

jobs:
  verify-preview-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.LUMI_DEV_DATABASE_URL }}
      LUMI_DEMO_PARENT_PASSWORD: LumiDemo2026!
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      VERCEL_PREVIEW_BRANCH: agent/live-long-horizon-playwright-pack

    steps:
      - uses: actions/checkout@v4

      - name: Validate staging database guard
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "LUMI_DEV_DATABASE_URL is missing"; exit 1; }
          ACTUAL_DATABASE_NAME="$(node -e 'const u=new URL(process.env.DATABASE_URL); process.stdout.write(u.pathname.replace(/^\//, ""))')"
          test "$ACTUAL_DATABASE_NAME" = "neondb" || {
            echo "Refusing Preview login verification: database name mismatch";
            exit 1;
          }
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          echo "Confirmed staging database: $ACTUAL_DATABASE_NAME"

      - name: Bind staging database to this Vercel Preview branch
        shell: bash
        run: |
          request="$RUNNER_TEMP/vercel-preview-database-env.json"
          response="$RUNNER_TEMP/vercel-preview-database-env-response.json"

          jq -n \
            --arg value "$DATABASE_URL" \
            --arg branch "$VERCEL_PREVIEW_BRANCH" \
            '{
              key: "DATABASE_URL",
              value: $value,
              type: "encrypted",
              target: ["preview"],
              gitBranch: $branch,
              comment: "Project LUMI long-horizon acceptance Preview database"
            }' > "$request"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$request" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID"

          env_id="$(jq -r '.created.id // .id // empty' "$response")"
          test -n "$env_id" || {
            echo "Vercel did not confirm the Preview DATABASE_URL upsert"
            jq '{failed, error}' "$response"
            exit 1
          }
          echo "Vercel branch Preview DATABASE_URL upsert: PASS"

      - name: Verify Vercel Preview database binding metadata
        shell: bash
        run: |
          response="$RUNNER_TEMP/vercel-preview-env.json"
          curl --fail-with-body --silent --show-error \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?gitBranch=agent%2Flive-long-horizon-playwright-pack&teamId=$VERCEL_ORG_ID"

          matches="$(jq -r --arg branch "$VERCEL_PREVIEW_BRANCH" '[
            .envs[]
            | select(.key == "DATABASE_URL")
            | select(.gitBranch == $branch)
            | select((.target // []) | index("preview"))
          ] | length' "$response")"
          test "$matches" -ge 1 || { echo "Branch Preview DATABASE_URL metadata is missing"; exit 1; }
          echo "Vercel branch Preview DATABASE_URL metadata verification: PASS"

      - name: Wait for this commit Preview deployment
        id: preview
        shell: bash
        run: |
          deployment_id=""
          deployment_url=""

          for attempt in $(seq 1 90); do
            response="$RUNNER_TEMP/vercel-deployments.json"
            curl --fail-with-body --silent --show-error \
              --output "$response" \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=30&teamId=$VERCEL_ORG_ID"

            deployment_id="$(jq -r --arg sha "$GITHUB_SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha and .state == "READY" and (.target // "preview") != "production")] | first | .id // empty' "$response")"
            deployment_url="$(jq -r --arg sha "$GITHUB_SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha and .state == "READY" and (.target // "preview") != "production")] | first | .url // empty' "$response")"

            if [ -n "$deployment_id" ] && [ -n "$deployment_url" ]; then
              break
            fi

            echo "Waiting for READY Preview for $GITHUB_SHA (attempt $attempt/90)"
            sleep 5
          done

          test -n "$deployment_id" || { echo "READY Preview for current commit was not found"; exit 1; }
          test -n "$deployment_url" || { echo "READY Preview URL was not found"; exit 1; }

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=https://$deployment_url" >> "$GITHUB_OUTPUT"
          echo "READY Preview: $deployment_id"
          echo "Preview URL: https://$deployment_url"

      - name: Verify protected Preview demo login
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment_url }}
        run: |
          bypass_secret="$(openssl rand -hex 16)"
          echo "::add-mask::$bypass_secret"

          cleanup_bypass() {
            revoke="$RUNNER_TEMP/vercel-bypass-revoke.json"
            jq -n --arg secret "$bypass_secret" '{revoke:{secret:$secret,regenerate:false}}' > "$revoke"
            curl --silent --show-error \
              --request PATCH \
              --output /dev/null \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$revoke" \
              "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" || true
          }
          trap cleanup_bypass EXIT

          generate="$RUNNER_TEMP/vercel-bypass-generate.json"
          jq -n --arg secret "$bypass_secret" '{generate:{secret:$secret,note:"Temporary Project LUMI Preview login verification"}}' > "$generate"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --output "$RUNNER_TEMP/vercel-bypass-response.json" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$generate" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID"

          result="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}|%{redirect_url}' \
            --request POST \
            --header "x-vercel-protection-bypass: $bypass_secret" \
            --header "x-vercel-set-bypass-cookie: true" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode 'email=demo@lumi.local' \
            --data-urlencode "password=$LUMI_DEMO_PARENT_PASSWORD" \
            "$PREVIEW_URL/api/auth/login")"

          status="${result%%|*}"
          redirect="${result#*|}"
          echo "Login HTTP status: $status"
          echo "Login redirect path: $(node -e 'const u=new URL(process.argv[1]); process.stdout.write(u.pathname + u.search)' "$redirect" 2>/dev/null || printf '%s' "$redirect")"

          test "$status" = "303" || { echo "Demo login did not return the expected 303 redirect"; exit 1; }
          case "$redirect" in
            *"/app"*) ;;
            *) echo "Demo login did not redirect to /app"; exit 1 ;;
          esac

          echo "Protected Preview demo login: PASS"
