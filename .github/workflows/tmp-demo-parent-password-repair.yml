name: Temporary Demo Parent Password Repair

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: read

jobs:
  repair-demo-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.LUMI_DEV_DATABASE_URL }}
      DATABASE_POOL_MAX: "2"
      NODE_ENV: test
      LUMI_DEMO_CONFIRM: lumi-demo-v1
      LUMI_DEMO_ALLOWED_DATABASE_NAME: neondb
      LUMI_DEMO_PARENT_PASSWORD: LumiDemo2026!
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate staging database guard
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "LUMI_DEV_DATABASE_URL is missing"; exit 1; }
          ACTUAL_DATABASE_NAME="$(node -e 'const u=new URL(process.env.DATABASE_URL); process.stdout.write(u.pathname.replace(/^\//, ""))')"
          test "$ACTUAL_DATABASE_NAME" = "$LUMI_DEMO_ALLOWED_DATABASE_NAME" || {
            echo "Refusing demo repair: database name mismatch";
            exit 1;
          }
          echo "Confirmed staging database: $ACTUAL_DATABASE_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure auth/profile schemas
        run: |
          pnpm --filter @lumi/web auth:migrate
          pnpm --filter @lumi/profiles profile:migrate

      - name: Repair deterministic demo parent credentials
        run: pnpm demo:seed

      - name: Verify demo parent password hash
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import { verify } from '@node-rs/argon2';
          import pg from 'pg';

          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
          try {
            const result = await pool.query(
              'SELECT password_hash FROM parent_accounts WHERE email = $1',
              ['demo@lumi.local'],
            );
            if (result.rowCount !== 1) throw new Error('DEMO_PARENT_NOT_FOUND');
            const valid = await verify(result.rows[0].password_hash, process.env.LUMI_DEMO_PARENT_PASSWORD);
            if (!valid) throw new Error('DEMO_PARENT_PASSWORD_VERIFY_FAILED');
            console.log('Demo parent credential verification: PASS');
          } finally {
            await pool.end();
          }
          NODE

      - name: Load Vercel preview database URL safely
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          response="$RUNNER_TEMP/vercel-preview-env.json"
          curl --fail-with-body --silent --show-error \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=true&gitBranch=agent%2Flive-long-horizon-playwright-pack&teamId=$VERCEL_ORG_ID"

          preview_db="$(jq -r '[.envs[] | select(.key == "DATABASE_URL" and ((.target // []) | index("preview")))] | first | .value // empty' "$response")"
          test -n "$preview_db" || { echo "Preview DATABASE_URL was not returned by Vercel"; exit 1; }
          echo "::add-mask::$preview_db"
          echo "VERCEL_PREVIEW_DATABASE_URL=$preview_db" >> "$GITHUB_ENV"

      - name: Verify Vercel preview and staging share demo auth row
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';

          async function readDemoRow(connectionString) {
            const pool = new pg.Pool({ connectionString, max: 1 });
            try {
              const database = await pool.query('SELECT current_database() AS name');
              const row = await pool.query(
                'SELECT id::text, email, password_hash, updated_at::text FROM parent_accounts WHERE email = $1',
                ['demo@lumi.local'],
              );
              return { database: database.rows[0]?.name, row: row.rows[0] ?? null };
            } finally {
              await pool.end();
            }
          }

          const staging = await readDemoRow(process.env.DATABASE_URL);
          const preview = await readDemoRow(process.env.VERCEL_PREVIEW_DATABASE_URL);

          if (staging.database !== 'neondb' || preview.database !== staging.database) {
            throw new Error('PREVIEW_DATABASE_IDENTITY_MISMATCH');
          }
          if (!staging.row || !preview.row) throw new Error('DEMO_PARENT_NOT_FOUND_IN_BOTH_DATABASES');
          if (
            staging.row.id !== preview.row.id ||
            staging.row.password_hash !== preview.row.password_hash ||
            staging.row.updated_at !== preview.row.updated_at
          ) {
            throw new Error('PREVIEW_DEMO_AUTH_ROW_MISMATCH');
          }

          console.log('Vercel preview database matches repaired staging demo auth row: PASS');
          NODE
