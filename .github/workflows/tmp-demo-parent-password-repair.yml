name: Temporary Demo Parent Password Repair

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: read

jobs:
  repair-demo-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.LUMI_DEV_DATABASE_URL }}
      DATABASE_POOL_MAX: "2"
      NODE_ENV: test
      LUMI_DEMO_CONFIRM: lumi-demo-v1
      LUMI_DEMO_ALLOWED_DATABASE_NAME: neondb
      LUMI_DEMO_PARENT_PASSWORD: LumiDemo2026!
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      VERCEL_PROJECT_NAME: project-lumi-web
      VERCEL_PREVIEW_BRANCH: agent/live-long-horizon-playwright-pack

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate staging database guard
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "LUMI_DEV_DATABASE_URL is missing"; exit 1; }
          ACTUAL_DATABASE_NAME="$(node -e 'const u=new URL(process.env.DATABASE_URL); process.stdout.write(u.pathname.replace(/^\//, ""))')"
          test "$ACTUAL_DATABASE_NAME" = "$LUMI_DEMO_ALLOWED_DATABASE_NAME" || {
            echo "Refusing demo repair: database name mismatch";
            exit 1;
          }
          echo "Confirmed staging database: $ACTUAL_DATABASE_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure auth/profile schemas
        run: |
          pnpm --filter @lumi/web auth:migrate
          pnpm --filter @lumi/profiles profile:migrate

      - name: Repair deterministic demo parent credentials
        run: pnpm demo:seed

      - name: Verify demo parent password hash
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import { verify } from '@node-rs/argon2';
          import pg from 'pg';

          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
          try {
            const result = await pool.query(
              'SELECT password_hash FROM parent_accounts WHERE email = $1',
              ['demo@lumi.local'],
            );
            if (result.rowCount !== 1) throw new Error('DEMO_PARENT_NOT_FOUND');
            const valid = await verify(result.rows[0].password_hash, process.env.LUMI_DEMO_PARENT_PASSWORD);
            if (!valid) throw new Error('DEMO_PARENT_PASSWORD_VERIFY_FAILED');
            console.log('Demo parent credential verification: PASS');
          } finally {
            await pool.end();
          }
          NODE

      - name: Bind staging database to this Vercel Preview branch
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          request="$RUNNER_TEMP/vercel-preview-database-env.json"
          response="$RUNNER_TEMP/vercel-preview-database-env-response.json"

          jq -n \
            --arg value "$DATABASE_URL" \
            --arg branch "$VERCEL_PREVIEW_BRANCH" \
            '{
              key: "DATABASE_URL",
              value: $value,
              type: "encrypted",
              target: ["preview"],
              gitBranch: $branch,
              comment: "Project LUMI long-horizon acceptance Preview database"
            }' > "$request"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$request" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID"

          env_id="$(jq -r '.created.id // .id // empty' "$response")"
          test -n "$env_id" || {
            echo "Vercel did not confirm the Preview DATABASE_URL upsert"
            jq '{failed, error}' "$response"
            exit 1
          }
          echo "Vercel branch Preview DATABASE_URL upsert: PASS"

      - name: Verify Vercel Preview database binding metadata
        shell: bash
        run: |
          response="$RUNNER_TEMP/vercel-preview-env.json"
          curl --fail-with-body --silent --show-error \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?gitBranch=agent%2Flive-long-horizon-playwright-pack&teamId=$VERCEL_ORG_ID"

          matches="$(jq -r --arg branch "$VERCEL_PREVIEW_BRANCH" '[
            .envs[]
            | select(.key == "DATABASE_URL")
            | select(.gitBranch == $branch)
            | select((.target // []) | index("preview"))
          ] | length' "$response")"
          test "$matches" -ge 1 || { echo "Branch Preview DATABASE_URL metadata is missing"; exit 1; }
          echo "Vercel branch Preview DATABASE_URL metadata verification: PASS"

      - name: Create fresh Preview deployment after env binding
        shell: bash
        run: |
          request="$RUNNER_TEMP/vercel-deployment-request.json"
          response="$RUNNER_TEMP/vercel-deployment-response.json"

          jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            '{
              name: $name,
              project: $project,
              gitSource: {
                type: "github",
                org: $org,
                repo: $repo,
                ref: $ref,
                sha: $sha
              }
            }' > "$request"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$request" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID"

          deployment_id="$(jq -r '.id // empty' "$response")"
          deployment_url="$(jq -r '.url // empty' "$response")"
          deployment_target="$(jq -r '.target // empty' "$response")"
          test -n "$deployment_id" || { echo "Vercel deployment creation failed"; exit 1; }
          test "$deployment_target" != "production" || { echo "Safety failure: production deployment created"; exit 1; }
          echo "Fresh Preview deployment created: $deployment_id"
          echo "Preview URL: https://$deployment_url"
