name: Test Lab UI Format Once

on:
  push:
    branches:
      - agent/test-lab-canonical-ui-1
    paths:
      - .github/workflows/test-lab-ui-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-lab-canonical-ui-1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format canonical Test Lab files
        run: |
          pnpm exec prettier --write \
            apps/web/app/app/settings/test-lab/canonical-dashboard.tsx \
            apps/web/app/app/settings/test-lab/canonical-dashboard.module.css
          rm .github/workflows/test-lab-ui-format-once.yml
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/canonical-dashboard.tsx \
            apps/web/app/app/settings/test-lab/canonical-dashboard.module.css \
            .github/workflows/test-lab-ui-format-once.yml
          git commit -m "chore: format Test Lab canonical shell"
          git push origin HEAD:agent/test-lab-canonical-ui-1
