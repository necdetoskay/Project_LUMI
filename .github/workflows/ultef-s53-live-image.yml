name: ULTEF S53 Live Krea Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-krea:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_s53_live_visual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_s53_live_visual_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_s53_live_visual_test
      NODE_ENV: test
      LUMI_DEMO_CONFIRM: lumi-demo-v1
      LUMI_DEMO_PARENT_PASSWORD: lumi-demo-local-only-2026
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ULTEF_S53_LIVE_IMAGE_ENABLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check live-test marker
        id: marker
        shell: bash
        run: |
          mkdir -p artifacts/s53-live
          MESSAGE="$(git log -1 --pretty=%B)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$MESSAGE" == *"[live-image-test]"* ]]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "Live image request not requested by this commit." > artifacts/s53-live/LIVE_TEST_NOT_REQUESTED.txt
          fi
      - uses: pnpm/action-setup@v4
        if: steps.marker.outputs.requested == 'true'
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        if: steps.marker.outputs.requested == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.marker.outputs.requested == 'true'
      - name: Check live-provider secret
        if: steps.marker.outputs.requested == 'true'
        id: secret
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY repository secret is not configured; live image request skipped." | tee artifacts/s53-live/LIVE_TEST_SKIPPED.txt
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare auth schema
        if: steps.marker.outputs.requested == 'true' && steps.secret.outputs.available == 'true'
        run: pnpm --filter @lumi/web auth:migrate
      - name: Prepare profile schema
        if: steps.marker.outputs.requested == 'true' && steps.secret.outputs.available == 'true'
        run: pnpm --filter @lumi/profiles profile:migrate
      - name: Prepare world schema
        if: steps.marker.outputs.requested == 'true' && steps.secret.outputs.available == 'true'
        run: pnpm --filter @lumi/world world:migrate
      - name: Prepare NPC schema
        if: steps.marker.outputs.requested == 'true' && steps.secret.outputs.available == 'true'
        run: pnpm --filter @lumi/npc-intelligence npc:migrate
      - name: Prepare story schema
        if: steps.marker.outputs.requested == 'true' && steps.secret.outputs.available == 'true'
        run: pnpm --filter @lumi/story story:migrate
      - name: Seed canonical demo universe
        if: steps.marker.outputs.requested == 'true' && steps.secret.outputs.available == 'true'
        run: pnpm demo:seed
      - name: Generate one real Lina visual with Krea Turbo
        if: steps.marker.outputs.requested == 'true' && steps.secret.outputs.available == 'true'
        run: pnpm --filter @lumi/web exec vitest run tests/ultef-s53-live-character-visual.integration.test.ts
      - name: Upload live visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s53-live-krea-evidence
          path: artifacts/s53-live
          if-no-files-found: warn
