name: tmp-format-profile-stories-test
on:
  push:
    branches:
      - fix/child-dashboard-presentation-polish
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/child-dashboard-presentation-polish
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write apps/web/tests/profile-stories-section.test.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/profile-stories-section.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(stories): format profile stories test"
          git push origin HEAD:fix/child-dashboard-presentation-polish
