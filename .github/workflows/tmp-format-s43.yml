name: Temporary Format S43

on:
  push:
    branches:
      - fix/s43-current-life-read-only

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s43-current-life-read-only
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/components/character/profile-character-detail-section.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/character/profile-character-detail-section.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(current-life): apply repository formatting"
          git push origin HEAD:fix/s43-current-life-read-only
