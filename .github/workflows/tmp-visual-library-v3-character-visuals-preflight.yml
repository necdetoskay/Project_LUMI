name: TMP Character Visuals Preflight

on:
  push:
    branches:
      - agent/visual-library-v3-character-visuals

permissions:
  contents: write

jobs:
  preflight:
    if: "${{ github.event.head_commit.message != 'style(web): apply character visuals prettier output' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-library-v3-character-visuals
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: pnpm exec prettier --write 'apps/web/app/app/assets/characters/[characterId]/character-visual-manager.tsx' 'apps/web/app/app/assets/characters/[characterId]/page.tsx' apps/web/tests/e2e/ultef-s53-assets-compose.spec.ts
      - run: pnpm format:check
      - run: pnpm --filter @lumi/web lint
      - run: pnpm --filter @lumi/web typecheck
      - run: pnpm --filter @lumi/web test
      - run: pnpm --filter @lumi/web build
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'apps/web/app/app/assets/characters/[characterId]/character-visual-manager.tsx' 'apps/web/app/app/assets/characters/[characterId]/page.tsx' apps/web/tests/e2e/ultef-s53-assets-compose.spec.ts
            git commit -m "style(web): apply character visuals prettier output"
            git push origin HEAD:agent/visual-library-v3-character-visuals
          fi
