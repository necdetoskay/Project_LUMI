name: ULTEF S53 Character Visual Canon

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-visual-canon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_s53_visual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_s53_visual_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_s53_visual_test
      NODE_ENV: test
      LUMI_DEMO_CONFIRM: lumi-demo-v1
      LUMI_DEMO_PARENT_PASSWORD: lumi-demo-local-only-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare auth schema
        run: pnpm --filter @lumi/web auth:migrate
      - name: Prepare profile schema including S53 visual canon
        run: pnpm --filter @lumi/profiles profile:migrate
      - name: Prepare world schema
        run: pnpm --filter @lumi/world world:migrate
      - name: Prepare NPC intelligence schema
        run: pnpm --filter @lumi/npc-intelligence npc:migrate
      - name: Prepare story schema
        run: pnpm --filter @lumi/story story:migrate
      - name: Seed canonical demo universe
        run: pnpm demo:seed
      - name: Run S53 DB-backed fake-provider visual lifecycle
        run: pnpm --filter @lumi/web exec vitest run tests/ultef-s53-character-visual-canon.integration.test.ts
