name: Temporary Onboarding Lint Fix
on:
  push:
    branches:
      - agent/character-onboarding-live-e2e
    paths:
      - .github/workflows/tmp-onboarding-lint-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace empty cleanup catch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/tests/character-onboarding-production-live-e2e.test.ts')
          s = p.read_text()
          old = '''      } catch {}\n      await pool.query(\n'''
          new = '''      } catch {\n        // Trace storage may be absent in older disposable schema variants.\n      }\n      await pool.query(\n'''
          if old not in s:
              raise SystemExit('target empty catch not found')
          p.write_text(s.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/tests/character-onboarding-production-live-e2e.test.ts
      - name: Verify lint target and formatting
        run: |
          pnpm exec eslint apps/web/tests/character-onboarding-production-live-e2e.test.ts --max-warnings=0
          pnpm exec prettier --check apps/web/tests/character-onboarding-production-live-e2e.test.ts
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/tests/character-onboarding-production-live-e2e.test.ts
          git commit -m 'fix(test): make optional trace cleanup lint-safe'
          git push
