name: Temporary Format Context Inspector

on:
  push:
    branches:
      - agent/context-inspector-read-path

permissions:
  contents: write

jobs:
  format:
    # One-shot formatter; bot formatting commits do not recurse.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-inspector-read-path
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/profiles/src/application/ai-generation-trace.service.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profiles/src/application/ai-generation-trace.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(context): apply repository prettier"
          git push origin HEAD:agent/context-inspector-read-path
