name: S45 Final Format

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s45-final-format.yml'

permissions:
  contents: write

jobs:
  format-s45-final:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 's45/memory-lifecycle-long-horizon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s45/memory-lifecycle-long-horizon
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final S45 files
        run: >-
          pnpm exec prettier --write
          apps/web/tests/ultef-s45-memory-lifecycle.v3.integration.test.ts
          packages/npc-intelligence/src/db/repositories/drizzle/drizzle-canonical-memory.repository.ts
          packages/npc-intelligence/src/domain/memory-lifecycle.ts
          packages/npc-intelligence/tests/domain/memory-lifecycle.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/tests/ultef-s45-memory-lifecycle.v3.integration.test.ts \
            packages/npc-intelligence/src/db/repositories/drizzle/drizzle-canonical-memory.repository.ts \
            packages/npc-intelligence/src/domain/memory-lifecycle.ts \
            packages/npc-intelligence/tests/domain/memory-lifecycle.test.ts
          git commit -m 'style(s45): format memory lifecycle files'
          git push origin HEAD:s45/memory-lifecycle-long-horizon
