name: Temporary S51 Formatter

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/demo/lumi-demo-manifest.mjs scripts/demo/lumi-demo-manifest.selftest.mjs scripts/demo/lumi-demo-runner.mjs scripts/demo/lumi-demo-runner.selftest.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/demo/lumi-demo-manifest.mjs scripts/demo/lumi-demo-manifest.selftest.mjs scripts/demo/lumi-demo-runner.mjs scripts/demo/lumi-demo-runner.selftest.mjs
          git commit -m "style(s51): apply repository prettier"
          git push
