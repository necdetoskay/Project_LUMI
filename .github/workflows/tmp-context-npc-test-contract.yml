name: Temporary context NPC test contract update

on:
  push:
    branches:
      - agent/context-npc-story-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-npc-story-integration
      - name: Update canonical section expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("packages/context/tests/application/context-builder.test.ts")
          text = p.read_text()
          replacements = [
            (
              '        "long-term-memory",\n        "knowledge",',
              '        "long-term-memory",\n        "relevant-npc",\n        "knowledge",',
            ),
            ('expect(priorities).toEqual([0, 1, 2, 3, 4, 5, 6, 7]);', 'expect(priorities).toEqual([0, 1, 2, 3, 4, 5, 6, 7, 8]);'),
            ('expect(manifest.sections.length).toBe(8);', 'expect(manifest.sections.length).toBe(9);'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, got {count}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          Path(".github/workflows/tmp-context-npc-test-contract.yml").unlink()
          PY
      - name: Commit test contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(context): align builder expectations with NPC section"
          git push origin HEAD:agent/context-npc-story-integration
