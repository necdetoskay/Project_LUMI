name: Temporary Slice F Prettier Fix

on:
  push:
    branches:
      - agent/visual-library-v3-generation-actions
    paths:
      - .github/workflows/tmp-prettier-slice-f.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-library-v3-generation-actions
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Slice F files
        run: >-
          pnpm exec prettier --write
          'apps/web/app/api/assets/stories/[sessionId]/visuals/route.ts'
          'apps/web/app/app/assets/stories/[sessionId]/layout.tsx'
          'apps/web/app/app/assets/stories/[sessionId]/story-visual-actions.tsx'
          'apps/web/lib/assets/story-visual-generation.ts'
          'packages/media/src/application/story-visual-generation.service.ts'
          'packages/media/tests/application/story-visual-generation.test.ts'
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'apps/web/app/api/assets/stories/[sessionId]/visuals/route.ts' \
            'apps/web/app/app/assets/stories/[sessionId]/layout.tsx' \
            'apps/web/app/app/assets/stories/[sessionId]/story-visual-actions.tsx' \
            'apps/web/lib/assets/story-visual-generation.ts' \
            'packages/media/src/application/story-visual-generation.service.ts' \
            'packages/media/tests/application/story-visual-generation.test.ts'
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git commit -m "style: format Slice F generation files"
          git push origin HEAD:agent/visual-library-v3-generation-actions
