name: Temporary Format PR 274
on:
  push:
    branches:
      - fix/finalize-bootstrap-critical-path
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-bootstrap-critical-path
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/api/character-creation/canonical/route.ts vercel.json
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/api/character-creation/canonical/route.ts vercel.json
          git commit -m "style: format PR 274"
          git push origin HEAD:fix/finalize-bootstrap-critical-path
