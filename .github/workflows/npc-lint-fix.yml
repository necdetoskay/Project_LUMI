name: NPC Lint Fix

on:
  push:
    branches:
      - fix/npc-referential-integrity-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove unused fixture binding without shifting fixture IDs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/npc-intelligence/scripts/referential-integrity-db-selftest.mjs')
          text = path.read_text()
          old = '  invalidWorld,\n  invalidWorldNpc,\n  invalidTrace,'
          new = '  invalidWorld,\n  ,\n  invalidTrace,'
          if old not in text:
              raise SystemExit('expected fixture binding block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/npc-intelligence/scripts/referential-integrity-db-selftest.mjs
      - name: Verify target lint
        run: pnpm --filter @lumi/npc-intelligence lint
      - name: Commit lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/npc-intelligence/scripts/referential-integrity-db-selftest.mjs
          git commit -m "test: remove unused NPC fixture binding"
          git push origin HEAD:fix/npc-referential-integrity-hardening
