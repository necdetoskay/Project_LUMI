name: Neon Compatibility Spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.LUMI_DEV_DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.LUMI_DEV_DATABASE_DIRECT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "LUMI_DEV_DATABASE_URL is missing"; exit 1; }
          test -n "$DATABASE_DIRECT_URL" || { echo "LUMI_DEV_DATABASE_DIRECT_URL is missing"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply auth migration
        run: pnpm --filter @lumi/web auth:migrate

      - name: Apply profile migration
        run: pnpm --filter @lumi/profiles profile:migrate

      - name: Apply world migration
        run: pnpm --filter @lumi/world world:migrate

      - name: Apply NPC migration
        run: pnpm --filter @lumi/npc-intelligence npc:migrate

      - name: Apply story migration
        run: pnpm --filter @lumi/story story:migrate

      - name: Run managed PostgreSQL compatibility smoke
        run: pnpm --filter @lumi/web db:compatibility-smoke
