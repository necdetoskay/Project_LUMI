name: Landing Prettier Helper

on:
  pull_request:
    paths:
      - "apps/web/app/page.tsx"
      - "apps/web/app/landing-v2.module.css"
      - "apps/web/tests/landing-premium-real-ui.contract.test.ts"
      - ".github/workflows/landing-prettier-helper.yml"

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format landing files
        run: pnpm exec prettier --write apps/web/app/page.tsx apps/web/app/landing-v2.module.css apps/web/tests/landing-premium-real-ui.contract.test.ts
      - name: Commit formatted files when needed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/app/page.tsx apps/web/app/landing-v2.module.css apps/web/tests/landing-premium-real-ui.contract.test.ts; then
            echo "Landing files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/page.tsx apps/web/app/landing-v2.module.css apps/web/tests/landing-premium-real-ui.contract.test.ts
          git commit -m "style(landing): apply prettier formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
