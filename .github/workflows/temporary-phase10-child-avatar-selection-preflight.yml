name: Temporary Phase 10 Child Avatar Selection Preflight

"on":
  push:
    branches:
      - fix/250-adventure-child-avatar-selection
    paths:
      - .github/workflows/temporary-phase10-child-avatar-selection-preflight.yml
      - packages/profiles/src/db/repositories/drizzle/drizzle-character.repository.ts
      - packages/profiles/tests/integration/character-primary-avatar.integration.test.ts

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi
          POSTGRES_DB: lumi
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://lumi:lumi@localhost:5432/lumi
      PROFILE_DATABASE_URL: postgresql://lumi:lumi@localhost:5432/lumi
      PROFILE_TEST_DATABASE_URL: postgresql://lumi:lumi@localhost:5432/lumi
      PROFILE_TEST_ENABLE_DESTRUCTIVE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm prettier --check packages/profiles/src/db/repositories/drizzle/drizzle-character.repository.ts packages/profiles/tests/integration/character-primary-avatar.integration.test.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Primary avatar integration regression
        run: pnpm --filter @lumi/profiles test:int -- character-primary-avatar.integration.test.ts

      - name: Full unit test suite
        run: pnpm test

      - name: Prepare Stories browser DB
        run: pnpm --filter @lumi/profiles profile:migrate

      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium

      - name: Stories browser journey
        run: pnpm --filter @lumi/web exec playwright test --config playwright.stories-ux-v2.config.ts
