name: One-shot Story Visual Sheet Planner Preflight

on:
  push:
    branches:
      - agent/story-visual-asset-sheet-planner

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format planner files
        run: |
          pnpm prettier --write packages/media/src/domain/story-visual-asset-sheet-planner.ts packages/media/src/domain/index.ts packages/media/tests/domain/story-visual-asset-sheet-planner.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/media/src/domain/story-visual-asset-sheet-planner.ts packages/media/src/domain/index.ts packages/media/tests/domain/story-visual-asset-sheet-planner.test.ts
            git commit -m "style(media): format story visual sheet planner"
            git push
          fi
      - run: pnpm prettier --check packages/media/src/domain/story-visual-asset-sheet-planner.ts packages/media/src/domain/index.ts packages/media/tests/domain/story-visual-asset-sheet-planner.test.ts
      - run: pnpm --filter @lumi/media lint
      - run: pnpm --filter @lumi/media typecheck
      - run: pnpm --filter @lumi/media test
