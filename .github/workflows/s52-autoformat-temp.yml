name: S52 Temporary Autoformat

on:
  push:
    branches: [s52/playable-demo-journey]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s52/playable-demo-journey
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize demo choice point type
        run: sed -i "s/'ilk-isik-yolu','decision'/'ilk-isik-yolu','single'/" apps/web/scripts/lumi-demo-story-db.mjs
      - name: Format Sprint 52 files
        run: >-
          pnpm exec prettier --write
          'apps/web/app/api/stories/sessions/[sessionId]/choices/[choicePointId]/commit/route.ts'
          'apps/web/app/api/stories/sessions/[sessionId]/reader/route.ts'
          'apps/web/scripts/lumi-demo-story-db.mjs'
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/api/stories/sessions/[sessionId]/choices/[choicePointId]/commit/route.ts \
                  apps/web/app/api/stories/sessions/[sessionId]/reader/route.ts \
                  apps/web/scripts/lumi-demo-story-db.mjs
          git commit -m "chore(s52): format playable demo files"
          git push origin HEAD:s52/playable-demo-journey
