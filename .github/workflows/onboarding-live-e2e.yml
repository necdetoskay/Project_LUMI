name: Character Onboarding Live E2E

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model slug
        required: false
        default: deepseek/deepseek-v4-flash
  schedule:
    # Nightly production-path confidence check. Paid LLM calls stay isolated from normal PR CI.
    - cron: "37 2 * * *"

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_onboarding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_onboarding_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_onboarding_test
      PROFILE_DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_onboarding_test
      STORY_TEST_DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_onboarding_test
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LUMI_SETTINGS_ENCRYPTION_KEY: onboarding-production-e2e-test-encryption-key-only
      LUMI_ONBOARDING_LIVE_E2E: "1"
      STORY_TEST_ENABLE_DESTRUCTIVE: "true"
      LUMI_LIVE_LLM_MODEL: ${{ inputs.model || 'deepseek/deepseek-v4-flash' }}
      NODE_ENV: test
      LIVE_E2E_LOG: ${{ runner.temp }}/character-onboarding-live-e2e.log
      LIVE_E2E_REPORT: ${{ runner.temp }}/character-onboarding-live-e2e-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Guard disposable database and OpenRouter secret
        shell: bash
        run: |
          node <<'NODE'
          if (!process.env.OPENROUTER_API_KEY) {
            console.error('Missing OPENROUTER_API_KEY Actions secret');
            process.exit(1);
          }
          const db = new URL(process.env.DATABASE_URL);
          const name = db.pathname.replace(/^\//, '').toLowerCase();
          if (!name.includes('test') && !name.includes('review')) {
            console.error(`Refusing destructive onboarding E2E against non-test database: ${name}`);
            process.exit(1);
          }
          console.log(`Disposable DB guard passed for database: ${name}`);
          NODE

      - name: Typecheck production onboarding path
        run: |
          pnpm --filter @lumi/profiles typecheck
          pnpm --filter @lumi/world typecheck
          pnpm --filter @lumi/web typecheck

      - name: Apply profile migrations
        run: pnpm --filter @lumi/profiles profile:migrate

      - name: Apply world migrations
        run: pnpm --filter @lumi/world world:migrate

      - name: Run real 9-stage Character Onboarding
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @lumi/web test:onboarding:production-e2e 2>&1 | tee "$LIVE_E2E_LOG"

      - name: Publish structured live E2E evidence
        if: always()
        shell: bash
        run: |
          if grep -q "LUMI_ONBOARDING_LIVE_RESULT" "$LIVE_E2E_LOG"; then
            node apps/web/scripts/extract-onboarding-live-report.mjs "$LIVE_E2E_LOG" "$LIVE_E2E_REPORT"
          else
            echo "## Character Onboarding Live E2E" >> "$GITHUB_STEP_SUMMARY"
            echo "No successful live-result marker was produced. Inspect the test logs above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live E2E evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-onboarding-live-e2e-evidence
          path: ${{ env.LIVE_E2E_REPORT }}
          if-no-files-found: ignore
          retention-days: 30
