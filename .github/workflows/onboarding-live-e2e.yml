name: Character Onboarding Live E2E

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model slug
        required: false
        default: deepseek/deepseek-v4-flash
  push:
    branches:
      - agent/character-onboarding-live-e2e
    paths:
      - .github/workflows/onboarding-live-e2e.yml

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.STORY_TEST_DATABASE_URL || secrets.DATABASE_URL }}
  STORY_TEST_DATABASE_URL: ${{ secrets.STORY_TEST_DATABASE_URL || secrets.DATABASE_URL }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  LUMI_SETTINGS_ENCRYPTION_KEY: ${{ secrets.LUMI_SETTINGS_ENCRYPTION_KEY }}
  LUMI_ONBOARDING_LIVE_E2E: "1"
  STORY_TEST_ENABLE_DESTRUCTIVE: "true"
  LUMI_LIVE_LLM_MODEL: ${{ inputs.model || 'deepseek/deepseek-v4-flash' }}

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Guard disposable database and required secrets
        shell: bash
        run: |
          node <<'NODE'
          const required = [
            ['DATABASE_URL', process.env.DATABASE_URL],
            ['OPENROUTER_API_KEY', process.env.OPENROUTER_API_KEY],
            ['LUMI_SETTINGS_ENCRYPTION_KEY', process.env.LUMI_SETTINGS_ENCRYPTION_KEY],
          ];
          const missing = required.filter(([, value]) => !value).map(([name]) => name);
          if (missing.length) {
            console.error(`Missing required Actions secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          const db = new URL(process.env.DATABASE_URL);
          const name = db.pathname.replace(/^\//, '').toLowerCase();
          if (!name.includes('test') && !name.includes('review')) {
            console.error(`Refusing destructive onboarding E2E against non-test database: ${name}`);
            process.exit(1);
          }
          console.log(`Disposable DB guard passed for database: ${name}`);
          NODE

      - name: Typecheck production onboarding path
        run: |
          pnpm --filter @lumi/profiles typecheck
          pnpm --filter @lumi/world typecheck
          pnpm --filter @lumi/web typecheck

      - name: Apply profile migrations
        run: pnpm --filter @lumi/profiles profile:migrate

      - name: Apply world migrations
        run: pnpm --filter @lumi/world world:migrate

      - name: Run real 9-stage Character Onboarding
        run: pnpm --filter @lumi/web test:onboarding:production-e2e
