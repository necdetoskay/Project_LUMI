name: Temporary 250 Adventure Poll Lifecycle Patch Preflight

on:
  push:
    branches:
      - fix/250-adventure-poll-lifecycle
    paths:
      - .github/workflows/temporary-250-poll-lifecycle-patch-preflight.yml

permissions:
  contents: write
  issues: write

jobs:
  patch-and-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_poll_lifecycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_poll_lifecycle_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_poll_lifecycle_test
      PROFILE_DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_poll_lifecycle_test
      STORY_TEST_DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_poll_lifecycle_test
      LUMI_SETTINGS_ENCRYPTION_KEY: lumi-poll-lifecycle-key
      NODE_ENV: test
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply lifecycle fix and browser regression
        shell: python
        run: |
          from pathlib import Path

          component = Path('apps/web/components/story/new-adventure-sheet-localized.tsx')
          text = component.read_text()
          old = '''  const t = useTranslations("stories.sheet");\n  const dialogRef = useRef<HTMLElement>(null);'''
          new = '''  const t = useTranslations("stories.sheet");\n  const translationRef = useRef(t);\n  translationRef.current = t;\n  const dialogRef = useRef<HTMLElement>(null);'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('setError(t("loadFailed"));', 'setError(translationRef.current("loadFailed"));', 1)
          text = text.replace('setError(t("preparingTimeout"));', 'setError(translationRef.current("preparingTimeout"));', 1)
          text = text.replace('setError(t("loadUnexpected"));', 'setError(translationRef.current("loadUnexpected"));', 1)
          old_deps = '''    [childProfileId, householdId, t],\n  );'''
          new_deps = '''    [childProfileId, householdId],\n  );'''
          assert old_deps in text
          text = text.replace(old_deps, new_deps, 1)
          component.write_text(text)

          spec = Path('apps/web/tests/e2e/stories-ux-v2.spec.ts')
          text = spec.read_text()
          marker = '''async function assertNoHorizontalOverflow(page: Page) {'''
          helper = '''async function mockPreparingThenReadyCandidates(\n  page: Page,\n  childProfileId: string,\n  householdId: string,\n) {\n  let candidateCalls = 0;\n\n  await page.route(\n    `**/api/child-profiles/${childProfileId}/stories?householdId=${householdId}`,\n    async (route) => {\n      await route.fulfill({\n        status: 200,\n        contentType: "application/json",\n        body: JSON.stringify({\n          adventureHub: {\n            character: { id: "character-poll-e2e", name: "Işıl" },\n            ongoingAdventure: null,\n            pastAdventures: [],\n          },\n        }),\n      });\n    },\n  );\n\n  await page.route(\n    `**/api/child-profiles/${childProfileId}/stories/adventure-candidates**`,\n    async (route) => {\n      candidateCalls += 1;\n      const body =\n        candidateCalls < 3\n          ? { candidates: [], readiness: "preparing" }\n          : { candidates: candidateSet(0), readiness: "ready" };\n      await route.fulfill({\n        status: 200,\n        contentType: "application/json",\n        body: JSON.stringify(body),\n      });\n    },\n  );\n\n  return { getCandidateCalls: () => candidateCalls };\n}\n\n'''
          assert marker in text
          text = text.replace(marker, helper + marker, 1)

          closing = '''  test("EN 360px: no overflow, keyboard-operable sheet and world-event start payload", async ({'''
          regression = '''  test("TR desktop: preparing candidate polling survives render updates until cards become ready", async ({\n    page,\n  }) => {\n    await setLocale(page, "tr");\n    const { childProfileId, householdId } = await createAuthenticatedProfile(\n      page,\n      "poll-lifecycle",\n    );\n    const mocked = await mockPreparingThenReadyCandidates(\n      page,\n      childProfileId,\n      householdId,\n    );\n\n    await openStoriesTab(page, childProfileId);\n    await page.getByRole("button", { name: "Yeni Macera" }).first().click();\n\n    await expect(page.getByText("Parlayan orman")).toBeVisible({\n      timeout: 10_000,\n    });\n    expect(mocked.getCandidateCalls()).toBeGreaterThanOrEqual(3);\n  });\n\n'''
          assert closing in text
          text = text.replace(closing, regression + closing, 1)
          spec.write_text(text)

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/web/components/story/new-adventure-sheet-localized.tsx
          apps/web/tests/e2e/stories-ux-v2.spec.ts

      - name: Check formatting
        run: >-
          pnpm exec prettier --check
          apps/web/components/story/new-adventure-sheet-localized.tsx
          apps/web/tests/e2e/stories-ux-v2.spec.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Apply auth migration
        run: pnpm --filter @lumi/web auth:migrate
      - name: Apply profile migrations
        run: pnpm --filter @lumi/profiles profile:migrate
      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium
      - name: Run Stories UX browser regression
        run: pnpm --filter @lumi/web exec playwright test tests/e2e/stories-ux-v2.spec.ts

      - name: Commit product/test changes only after green preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/components/story/new-adventure-sheet-localized.tsx \
            apps/web/tests/e2e/stories-ux-v2.spec.ts
          git commit -m "fix(stories): keep adventure polling alive across renders"
          git push origin HEAD:fix/250-adventure-poll-lifecycle

      - name: Record preflight result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: >-
          gh issue comment 250 --repo "$GITHUB_REPOSITORY"
          --body "Gate D8 client polling lifecycle preflight finished **$JOB_STATUS**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Mock/disposable DB only; no production mutation or paid model call."
