name: Localization Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'feat/localization-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/localization-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/web/app/layout.tsx
          apps/web/components/i18n/locale-switcher.tsx
          apps/web/components/layout/app-footer.tsx
          apps/web/components/layout/app-header.tsx
          apps/web/i18n/config.ts
          apps/web/i18n/request.ts
          apps/web/messages/en.json
          apps/web/messages/tr.json
          apps/web/next.config.ts
          apps/web/package.json
          apps/web/tests/i18n-config.test.ts
          apps/web/tests/i18n-message-parity.test.ts
          docs/04-architecture/localization/localization-and-language-architecture.md
      - name: Commit normalized dependency and formatter output
        run: |
          if git diff --quiet; then
            echo "No preflight changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/web docs/04-architecture/localization
          git commit -m "chore(i18n): normalize localization foundation"
          git push origin HEAD:feat/localization-foundation
