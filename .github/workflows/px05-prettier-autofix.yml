name: PX05 Prettier Autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prettier-autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format PX-05 test
        run: pnpm exec prettier --write apps/web/tests/ultef-px-story-consequence.integration.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/ultef-px-story-consequence.integration.test.ts
          git commit -m "style(ultef): format PX-05 closure test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
