name: Issue 248 Format Self Heal

on:
  push:
    branches:
      - codex/issue-248-genesis-phase-8

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-248-genesis-phase-8
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier formatting
        run: >-
          pnpm exec prettier --write
          packages/context/src/application/story-generation-context.ts
          packages/profiles/src/application/saga-progression.service.ts
          packages/profiles/src/application/saga-progression.service.test.ts
      - name: Remove temporary formatter workflow
        run: rm .github/workflows/issue-248-format-self-heal.yml
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/context/src/application/story-generation-context.ts packages/profiles/src/application/saga-progression.service.ts packages/profiles/src/application/saga-progression.service.test.ts .github/workflows/issue-248-format-self-heal.yml
          git commit -m "style(saga): apply canonical formatting"
          git push origin HEAD:codex/issue-248-genesis-phase-8
