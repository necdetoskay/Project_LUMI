name: Temporary Phase 10 Gate D3 Readiness Diagnostic

on:
  push:
    branches:
      - ops/250-gate-d-completion-rerun
    paths:
      - .github/workflows/temporary-phase10-gate-d3-readiness-diagnostic.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      BASE_URL: https://project-lumi-web.vercel.app
      HOUSEHOLD_ID: 51000000-0000-4000-8000-000000000001
      PROFILE_ID: 2d0b396f-9a19-498a-ae35-c1e099906386
      CHARACTER_ID: 9a5793c0-c57a-4df3-a5aa-be3f2cccb987
      PARENT_EMAIL: ${{ secrets.LUMI_LONG_HORIZON_PARENT_EMAIL }}
      PARENT_PASSWORD: ${{ secrets.LUMI_LONG_HORIZON_PARENT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create temporary Vercel automation bypass
        id: bypass
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          request="$RUNNER_TEMP/vercel-automation-bypass-generate.json"
          response="$RUNNER_TEMP/vercel-automation-bypass-response.json"
          jq -n --arg secret "$secret" '{generate:{secret:$secret,note:"Temporary Project LUMI Gate D3 readiness diagnostic"}}' > "$request"
          curl --fail-with-body --silent --show-error --request PATCH --output "$response" --header "Authorization: Bearer $VERCEL_TOKEN" --header "Content-Type: application/json" --data-binary "@$request" "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install chromium

      - name: Capture bootstrap and New Adventure response
        env:
          BYPASS_SECRET: ${{ steps.bypass.outputs.secret }}
        shell: bash
        run: |
          cd apps/web
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              baseURL: process.env.BASE_URL,
              extraHTTPHeaders: {
                'x-vercel-protection-bypass': process.env.BYPASS_SECRET,
              },
            });
            const page = await context.newPage();
            await page.goto('/login');
            const form = page.locator('form[action="/api/auth/login"]');
            await form.locator('input[name="email"]').fill(process.env.PARENT_EMAIL);
            await form.locator('input[name="password"]').fill(process.env.PARENT_PASSWORD);
            await Promise.all([
              page.waitForURL(/\/app(?:[/?#]|$)/, { timeout: 60000 }),
              form.locator('button[type="submit"]').click(),
            ]);

            const bootstrapResponse = await context.request.get(
              `/api/characters/${process.env.CHARACTER_ID}?householdId=${process.env.HOUSEHOLD_ID}&bootstrap=true`,
            );
            const bootstrapBody = await bootstrapResponse.json();

            await page.goto(`/app/profiles/${process.env.PROFILE_ID}`);
            const storiesTab = page.getByRole('button', { name: /Hikâyeler$/ });
            await storiesTab.waitFor({ state: 'visible', timeout: 60000 });
            await storiesTab.click();
            const newAdventure = page.getByRole('button', { name: 'Yeni Macera', exact: true }).first();
            await newAdventure.waitFor({ state: 'visible', timeout: 60000 });

            const responsePromise = page.waitForResponse(
              (response) => response.url().includes(`/api/child-profiles/${process.env.PROFILE_ID}/stories/adventure-candidates`),
              { timeout: 60000 },
            );
            await newAdventure.click();
            const response = await responsePromise;
            const body = await response.json();
            const output = {
              capturedAt: new Date().toISOString(),
              bootstrapHttpStatus: bootstrapResponse.status(),
              bootstrap: bootstrapBody.bootstrap ?? null,
              candidateHttpStatus: response.status(),
              requestUrl: response.url(),
              bootstrapStatus: body.bootstrapStatus ?? null,
              readiness: body.readiness ?? null,
              candidateCount: Array.isArray(body.candidates) ? body.candidates.length : null,
              candidates: Array.isArray(body.candidates) ? body.candidates.map((c) => ({ id: c.id, sourceFamily: c.sourceFamily, title: c.title })) : [],
              diagnostics: body.diagnostics ?? [],
              profileId: process.env.PROFILE_ID,
              characterId: process.env.CHARACTER_ID,
            };
            fs.writeFileSync('/tmp/d3-diagnostic.json', JSON.stringify(output, null, 2));
            console.log(JSON.stringify(output, null, 2));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Record diagnostic on issue 250
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f /tmp/d3-diagnostic.json ]; then
            {
              echo '## Gate D3 read-only timing diagnostic'
              echo
              echo '```json'
              cat /tmp/d3-diagnostic.json
              echo '```'
              echo
              echo 'This diagnostic performs no persistent product mutation and does not trigger another paid acceptance run.'
            } > /tmp/comment.md
          else
            echo 'Gate D3 read-only timing diagnostic failed before producing JSON. No additional paid acceptance run was triggered.' > /tmp/comment.md
          fi
          gh issue comment 250 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Revoke temporary Vercel automation bypass
        if: always() && steps.bypass.outputs.secret != ''
        env:
          AUTOMATION_SECRET: ${{ steps.bypass.outputs.secret }}
        shell: bash
        run: |
          revoke="$RUNNER_TEMP/vercel-automation-bypass-revoke.json"
          jq -n --arg secret "$AUTOMATION_SECRET" '{revoke:{secret:$secret,regenerate:false}}' > "$revoke"
          curl --silent --show-error --request PATCH --output /dev/null --header "Authorization: Bearer $VERCEL_TOKEN" --header "Content-Type: application/json" --data-binary "@$revoke" "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" || true
