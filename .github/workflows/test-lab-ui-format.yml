name: Test Lab UI Format Probe

on:
  pull_request:
  push:
    branches:
      - agent/test-lab-phase-4-prompt-workspace

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/web/app/app/settings/test-lab/test-lab-client.tsx
          git diff -- apps/web/app/app/settings/test-lab/test-lab-client.tsx
          exit 1
