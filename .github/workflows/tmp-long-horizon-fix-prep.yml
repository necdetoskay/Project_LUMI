name: Temporary Long-Horizon Fix Prep

on:
  push:
    branches:
      - agent/live-long-horizon-fix-prep

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch canonical wizard entry and live navigation guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts')
          text = spec.read_text(encoding='utf-8')
          replacements = [
              (
                  r'page.waitForURL(/\/app(?:\/|$)/, { timeout: 60_000 }),',
                  r'page.waitForURL(/\/app(?:[/?#]|$)/, { timeout: 60_000 }),',
                  1,
                  'login URL matcher',
              ),
              (
                  'await createFirstCharacter.first().click();',
                  'await createFirstCharacter.first().click({ timeout: 60_000 });',
                  1,
                  'character entry click timeout',
              ),
          ]
          for old, new, expected, label in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrence, found {count}')
              text = text.replace(old, new, expected)
          spec.write_text(text, encoding='utf-8')

          dashboard = Path('apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx')
          text = dashboard.read_text(encoding='utf-8')
          old = '/characters/new/type'
          new = '/characters/new/wizard'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'canonical wizard dashboard links: expected 2 occurrences, found {count}')
          dashboard.write_text(text.replace(old, new), encoding='utf-8')
          print('Canonical wizard entry + live navigation guards patched.')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check changed files
        run: pnpm exec prettier --check 'apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts' 'apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx'

      - name: Web typecheck
        run: pnpm --filter @lumi/web typecheck

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts' \
            'apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx'
          git diff --cached --check
          git commit -m 'fix(onboarding): enter canonical wizard from child dashboard'
          git push origin HEAD:agent/live-long-horizon-fix-prep
