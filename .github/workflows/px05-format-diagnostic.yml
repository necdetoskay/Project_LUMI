name: PX05 Format Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier formatting and print diff
        run: |
          pnpm exec prettier --write \
            apps/web/tests/ultef-px-story-consequence.integration.test.ts \
            packages/story/src/application/choice/choice-world-consequence.service.ts
          git diff -- \
            apps/web/tests/ultef-px-story-consequence.integration.test.ts \
            packages/story/src/application/choice/choice-world-consequence.service.ts
