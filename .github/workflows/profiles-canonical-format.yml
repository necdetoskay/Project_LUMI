name: Profiles Canonical Formatter

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/profiles-canonical-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profiles-canonical-ui
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/app/profiles/profiles-client-page.tsx apps/web/app/app/profiles/profiles-canonical.module.css docs/ui/profiles-canonical-ui-contract-v1.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/profiles/profiles-client-page.tsx apps/web/app/app/profiles/profiles-canonical.module.css docs/ui/profiles-canonical-ui-contract-v1.json
          git commit -m "style(profiles): format canonical UI files"
          git push origin HEAD:agent/profiles-canonical-ui
