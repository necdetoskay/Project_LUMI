name: Temporary Genesis Prettier Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-output:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier output
        run: pnpm exec prettier packages/profiles/src/domain/character-genesis.ts
