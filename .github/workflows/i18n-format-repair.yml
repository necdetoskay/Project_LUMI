name: i18n Temporary Format Repair

on:
  push:
    branches: [feat/localize-auth-parent-home]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/localize-auth-parent-home
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format localized login page
        run: pnpm exec prettier --write apps/web/app/login/page.tsx
      - name: Remove temporary workflow and commit repair
        run: |
          rm .github/workflows/i18n-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(i18n): format localized login page"
          git push origin HEAD:feat/localize-auth-parent-home
