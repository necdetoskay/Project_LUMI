name: UI2 Suite Badge Once

on:
  push:
    branches:
      - agent/test-lab-canonical-ui-2
    paths:
      - .github/workflows/ui2-suite-badge-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-lab-canonical-ui-2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/ui2-fix-suite-badge.mjs
      - run: pnpm exec prettier --write apps/web/app/app/settings/test-lab/canonical-dashboard.tsx
      - run: rm tooling/ui2-fix-suite-badge.mjs .github/workflows/ui2-suite-badge-once.yml
      - name: Commit suite badge fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(test-lab): preserve suite title with live data"
          git push origin HEAD:agent/test-lab-canonical-ui-2
