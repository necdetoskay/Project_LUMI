name: Format PR214 Once

on:
  workflow_dispatch:
  push:
    branches:
      - agent/story-context-production-composition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-context-production-composition
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format context composition files
        run: >-
          pnpm exec prettier --write
          apps/web/lib/story/generated-hook-reader.service.ts
          packages/context/src/adapters/request-snapshot-context-sources.adapter.ts
          packages/context/src/adapters/retrieval-context-sources.adapter.ts
          packages/context/tests/application/retrieval-context-sources.test.ts
      - name: Commit formatted files and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-pr214-once.yml
          git add apps/web/lib/story/generated-hook-reader.service.ts \
            packages/context/src/adapters/request-snapshot-context-sources.adapter.ts \
            packages/context/src/adapters/retrieval-context-sources.adapter.ts \
            packages/context/tests/application/retrieval-context-sources.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(context): format production composition"
          git push origin HEAD:agent/story-context-production-composition
