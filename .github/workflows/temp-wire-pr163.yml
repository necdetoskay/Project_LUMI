name: Temporary Wire PR163

on:
  push:
    branches:
      - feat/stories-ux-v2-new-adventure-sheet

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[wire-pr163-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stories-ux-v2-new-adventure-sheet
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire sheet into canonical stories component
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/components/story/profile-stories-section.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'import { CanonicalCharacterImage } from "@/components/assets/canonical-character-image";\n',
              'import { CanonicalCharacterImage } from "@/components/assets/canonical-character-image";\nimport { NewAdventureSheet } from "@/components/story/new-adventure-sheet";\n',
          )
          start = source.find('        {newAdventureOpen ? (\n')
          end = source.find('        <div className="relative mt-7">', start)
          if start == -1 or end == -1:
              raise SystemExit('placeholder block not found')
          replacement = '''        {newAdventureOpen && householdId ? (\n          <NewAdventureSheet\n            childProfileId={childProfileId}\n            householdId={householdId}\n            onClose={() => setNewAdventureOpen(false)}\n            open={newAdventureOpen}\n          />\n        ) : null}\n\n'''
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          PY
      - run: pnpm exec prettier --write apps/web/components/story/profile-stories-section.tsx apps/web/components/story/new-adventure-sheet.tsx apps/web/app/api/child-profiles/'[id]'/stories/adventure-candidates/route.ts apps/web/app/api/child-profiles/'[id]'/stories/start-adventure/route.ts
      - run: pnpm --filter @lumi/web exec eslint components/story/profile-stories-section.tsx components/story/new-adventure-sheet.tsx app/api/child-profiles/'[id]'/stories/adventure-candidates/route.ts app/api/child-profiles/'[id]'/stories/start-adventure/route.ts --max-warnings=0
      - run: pnpm --filter @lumi/web typecheck
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/story/profile-stories-section.tsx apps/web/components/story/new-adventure-sheet.tsx apps/web/app/api/child-profiles/'[id]'/stories/adventure-candidates/route.ts apps/web/app/api/child-profiles/'[id]'/stories/start-adventure/route.ts
          git commit -m "feat(stories): wire adventure sheet and start flow [wire-pr163-bot]"
          git push origin HEAD:feat/stories-ux-v2-new-adventure-sheet
