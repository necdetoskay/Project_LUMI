name: S51 Autoformat

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format S51 files
        run: >-
          pnpm exec prettier --write
          apps/web/scripts/lumi-demo-auth-db.mjs
          apps/web/scripts/lumi-demo-db.mjs
          apps/web/scripts/lumi-demo-db.selftest.mjs
          apps/web/scripts/lumi-demo-story-db.mjs
          apps/web/tests/e2e/ultef-s51-demo-journey.spec.ts
      - name: Commit format changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/lumi-demo-auth-db.mjs apps/web/scripts/lumi-demo-db.mjs apps/web/scripts/lumi-demo-db.selftest.mjs apps/web/scripts/lumi-demo-story-db.mjs apps/web/tests/e2e/ultef-s51-demo-journey.spec.ts
          git commit -m "style(s51): format playable demo files"
          git push origin HEAD:${{ github.head_ref }}
