name: Data Integrity DB Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumi_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumi_integrity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: World and simulation integrity
        env:
          WORLD_SIM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/profiles profile:world-sim-selftest
      - name: Story integrity
        env:
          STORY_INTEGRITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/profiles profile:story-integrity-selftest
      - name: Inventory typed ownership integrity
        env:
          INVENTORY_INTEGRITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/profiles profile:inventory-integrity-selftest
      - name: Managed asset canon integrity
        env:
          MANAGED_ASSET_CANON_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/profiles profile:managed-asset-canon-selftest
      - name: Media fingerprint cache integrity
        env:
          MEDIA_FINGERPRINT_CACHE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/media media:fingerprint-cache-selftest
      - name: Story visual asset set manifest integrity
        env:
          STORY_VISUAL_ASSET_SET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/media media:story-visual-asset-set-selftest
      - name: Cross-domain privacy media AI prompt integrity
        env:
          CROSS_DOMAIN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/profiles profile:cross-domain-selftest
      - name: Production schema bootstrap contract
        run: pnpm --filter @lumi/web exec vitest run tests/production-schema-migrations.contract.test.ts
      - name: Production schema bootstrap from unmarked database
        env:
          VERCEL_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs
      - name: Production schema bootstrap idempotent second pass
        env:
          VERCEL_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs
      - name: NPC referential integrity regression
        env:
          NPC_INTEGRITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/npc-intelligence test:db:referential-integrity
