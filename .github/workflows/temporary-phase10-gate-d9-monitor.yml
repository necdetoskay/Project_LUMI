name: Temporary Phase 10 Gate D9 Monitor

on:
  push:
    branches:
      - ops/250-gate-d9-single-run
    paths:
      - .github/workflows/temporary-phase10-gate-d9-monitor.yml

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Report exact D9 run set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow temporary-phase10-gate-d9-single-run.yml \
            --branch ops/250-gate-d9-single-run \
            --event push --limit 10 \
            --json databaseId,status,conclusion,headSha,url)"
          gh issue comment 250 --repo "$GITHUB_REPOSITORY" \
            --body "Gate D9 monitor: \`$result\`"
