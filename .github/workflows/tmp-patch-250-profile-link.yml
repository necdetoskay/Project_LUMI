name: Temporary Patch 250 Profile Link

on:
  push:
    branches:
      - fix/250-live-profile-navigation
    paths:
      - .github/workflows/tmp-patch-250-profile-link.yml
      - .github/scripts/tmp_patch_250_profile_link.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact selector patch
        run: python .github/scripts/tmp_patch_250_profile_link.py
      - name: Commit selector patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts
          git rm -- .github/workflows/tmp-patch-250-profile-link.yml .github/scripts/tmp_patch_250_profile_link.py
          git commit -m "test(live): align profile card selector"
          git push origin HEAD:fix/250-live-profile-navigation
