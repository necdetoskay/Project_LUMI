name: LUMI Live Production Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lumi-live-login-smoke.yml
      - apps/web/playwright.production-smoke.config.ts
      - apps/web/tests/e2e/long-horizon/login-smoke.live.spec.ts
      - apps/web/tests/e2e/long-horizon/stories-smoke.live.spec.ts
      - apps/web/tests/e2e/production-smoke/bootstrap-evidence.live.spec.ts
  pull_request:
    paths:
      - .ops/250-bootstrap-evidence.trigger

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LUMI_LONG_HORIZON_LIVE: "1"
      LUMI_LONG_HORIZON_BASE_URL: https://project-lumi-web.vercel.app
      LUMI_LONG_HORIZON_PARENT_EMAIL: ${{ secrets.LUMI_LONG_HORIZON_PARENT_EMAIL }}
      LUMI_LONG_HORIZON_PARENT_PASSWORD: ${{ secrets.LUMI_LONG_HORIZON_PARENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard credentials
        run: |
          test -n "${LUMI_LONG_HORIZON_PARENT_EMAIL}"
          test -n "${LUMI_LONG_HORIZON_PARENT_PASSWORD}"
      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium
      - name: Verify fresh Gate D New Adventure UI read-only
        run: |
          pnpm --filter @lumi/web exec playwright test \
            --config playwright.production-smoke.config.ts \
            tests/e2e/production-smoke/gate-d-fresh-ui.live.spec.ts
