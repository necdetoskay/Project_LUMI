name: Temporary Phase 6 Final Prettier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/test-lab-phase-6-evaluation-engine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final Phase 6 files
        run: |
          pnpm exec prettier --write \
            apps/web/app/api/settings/test-lab/evaluations/route.ts \
            apps/web/app/app/settings/test-lab/evaluation-panel.tsx \
            packages/ai/src/test-lab/domain/evaluation-consistency.ts \
            packages/ai/tests/evaluation-consistency.test.ts
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/api/settings/test-lab/evaluations/route.ts \
            apps/web/app/app/settings/test-lab/evaluation-panel.tsx \
            packages/ai/src/test-lab/domain/evaluation-consistency.ts \
            packages/ai/tests/evaluation-consistency.test.ts
          git commit -m "style(test-lab): format phase6 evaluation surfaces"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
