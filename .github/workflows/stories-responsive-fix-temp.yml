name: Stories Responsive Fix Temporary

on:
  push:
    branches:
      - test/stories-ux-v2-e2e-closeout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/stories-ux-v2-e2e-closeout
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply responsive and locator fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx')
          text = dashboard.read_text()
          pairs = [
            ('className="mx-auto grid min-h-screen max-w-[1600px] lg:grid-cols-[190px_minmax(0,1fr)]"',
             'className="mx-auto grid min-h-screen w-full min-w-0 max-w-[1600px] lg:grid-cols-[190px_minmax(0,1fr)]"'),
            ('className="border-b border-[#e8dcc8] bg-[#fffaf0] px-4 py-5 lg:sticky',
             'className="min-w-0 border-b border-[#e8dcc8] bg-[#fffaf0] px-4 py-5 lg:sticky'),
            ('<section className="mt-6 rounded-[28px] border border-[#eadfce] bg-white p-4 shadow-sm sm:p-6">',
             '<section className="mt-6 min-w-0 rounded-[28px] border border-[#eadfce] bg-white p-4 shadow-sm sm:p-6">'),
          ]
          for old, new in pairs:
            if old not in text:
              raise SystemExit(f'missing dashboard target: {old}')
            text = text.replace(old, new, 1)
          dashboard.write_text(text)

          spec = Path('apps/web/tests/e2e/stories-ux-v2.spec.ts')
          text = spec.read_text()
          old = 'page.getByRole("button", { name: "Kapat" })'
          new = 'page.getByRole("button", { name: "Kapat", exact: true })'
          if old not in text:
            raise SystemExit('missing close locator target')
          spec.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed files
        run: pnpm exec prettier --write 'apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx' apps/web/tests/e2e/stories-ux-v2.spec.ts
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx' apps/web/tests/e2e/stories-ux-v2.spec.ts
          git commit -m "fix(stories): prevent mobile dashboard overflow"
          git push origin HEAD:test/stories-ux-v2-e2e-closeout
