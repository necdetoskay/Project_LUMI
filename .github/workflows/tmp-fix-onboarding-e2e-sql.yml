name: Temporary Onboarding E2E Cleanup Repair
on:
  push:
    branches: [agent/character-onboarding-live-e2e]
    paths: [.github/workflows/tmp-fix-onboarding-e2e-sql.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale optional cleanup table and temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/tests/character-onboarding-production-live-e2e.test.ts')
          s=p.read_text()
          s=s.replace('            "world_character_residences",\n', '')
          p.write_text(s)
          PY
          git rm -f \
            .github/workflows/tmp-onboarding-map.yml \
            .github/workflows/tmp-fix-onboarding-e2e-sql.yml \
            .github/workflows/tmp-repair-onboarding-finalizer.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/tests/character-onboarding-production-live-e2e.test.ts
          git commit -m 'chore(onboarding): clean live E2E artifacts'
          git push
