name: Profiles Delete Confirmation Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/profiles-canonical-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profiles-canonical-ui
          fetch-depth: 0
      - name: Restore typed-name confirmation for permanent delete
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx = Path('apps/web/app/app/profiles/profiles-client-page.tsx')
          text = tsx.read_text()

          state_old = '''  const [deleteTarget, setDeleteTarget] = useState<EnrichedProfile | null>(
    null,
  );
  const [deletingMode, setDeletingMode] = useState<DeleteMode | null>(null);
  const [deleteError, setDeleteError] = useState<string | null>(null);'''
          state_new = '''  const [deleteTarget, setDeleteTarget] = useState<EnrichedProfile | null>(
    null,
  );
  const [deleteConfirm, setDeleteConfirm] = useState("");
  const [deletingMode, setDeletingMode] = useState<DeleteMode | null>(null);
  const [deleteError, setDeleteError] = useState<string | null>(null);'''
          if state_old not in text:
              raise SystemExit('delete state marker not found')
          text = text.replace(state_old, state_new, 1)

          replacements = [
            (
              '''      if (event.key === "Escape") {
        setDeleteTarget(null);
        setDeleteError(null);
      }''',
              '''      if (event.key === "Escape") {
        setDeleteTarget(null);
        setDeleteConfirm("");
        setDeleteError(null);
      }''',
              'escape marker',
            ),
            (
              '''  }, [ageSort, profiles, query, storyFilter]);

  async function handleDelete''',
              '''  }, [ageSort, profiles, query, storyFilter]);

  const deleteConfirmMatches =
    deleteTarget !== null && deleteConfirm.trim() === deleteTarget.displayName;

  async function handleDelete''',
              'visible profile marker',
            ),
            (
              '''      setDeleteTarget(null);
    } catch {''',
              '''      setDeleteTarget(null);
      setDeleteConfirm("");
    } catch {''',
              'delete success marker',
            ),
            (
              '''                    onManage={() => {
                      setDeleteTarget(profile);
                      setDeleteError(null);
                    }}''',
              '''                    onManage={() => {
                      setDeleteTarget(profile);
                      setDeleteConfirm("");
                      setDeleteError(null);
                    }}''',
              'manage marker',
            ),
            (
              '''          onClick={() => {
            setDeleteTarget(null);
            setDeleteError(null);
          }}''',
              '''          onClick={() => {
            setDeleteTarget(null);
            setDeleteConfirm("");
            setDeleteError(null);
          }}''',
              'backdrop marker',
            ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)

          modal_marker = '''            {deleteError ? (
              <p className={styles.errorText}>{deleteError}</p>
            ) : null}
            <div className={styles.modalActions}>'''
          modal_insert = '''            <label className={styles.confirmField}>
              <span>
                Kalıcı silme için profil adını birebir yazın:
                <strong>{deleteTarget.displayName}</strong>
              </span>
              <input
                type="text"
                value={deleteConfirm}
                onChange={(event) => setDeleteConfirm(event.target.value)}
                placeholder={deleteTarget.displayName}
                disabled={deletingMode !== null}
                autoComplete="off"
              />
            </label>
            {deleteError ? (
              <p className={styles.errorText}>{deleteError}</p>
            ) : null}
            <div className={styles.modalActions}>'''
          if modal_marker not in text:
              raise SystemExit('modal insertion marker not found')
          text = text.replace(modal_marker, modal_insert, 1)

          permanent_old = '''                className={styles.deleteButton}
                type="button"
                disabled={deletingMode !== null}
                onClick={() => void handleDelete("permanent")}'''
          permanent_new = '''                className={styles.deleteButton}
                type="button"
                disabled={deletingMode !== null || !deleteConfirmMatches}
                onClick={() => void handleDelete("permanent")}'''
          if permanent_old not in text:
              raise SystemExit('permanent delete marker not found')
          text = text.replace(permanent_old, permanent_new, 1)

          cancel_old = '''                onClick={() => {
                  setDeleteTarget(null);
                  setDeleteError(null);
                }}'''
          cancel_new = '''                onClick={() => {
                  setDeleteTarget(null);
                  setDeleteConfirm("");
                  setDeleteError(null);
                }}'''
          if cancel_old not in text:
              raise SystemExit('cancel marker not found')
          text = text.replace(cancel_old, cancel_new, 1)
          tsx.write_text(text)

          css = Path('apps/web/app/app/profiles/profiles-canonical.module.css')
          css_text = css.read_text()
          css_marker = '''.errorText {
  margin-top: 12px !important;
  color: #be4037 !important;
  font-weight: 700;
}
'''
          css_insert = '''.confirmField {
  display: grid;
  gap: 8px;
  margin-top: 18px;
}

.confirmField span {
  color: #6d6674;
  font-size: 12px;
  line-height: 1.5;
}

.confirmField strong {
  display: block;
  margin-top: 2px;
  color: #2c2732;
  font-weight: 850;
}

.confirmField input {
  min-height: 42px;
  border: 1px solid var(--profiles-border);
  border-radius: 10px;
  background: #fff;
  padding: 0 12px;
  color: var(--profiles-text);
  font: inherit;
  font-size: 13px;
  outline: none;
}

.confirmField input:focus {
  border-color: #bda3f2;
  box-shadow: 0 0 0 3px rgba(109, 50, 232, 0.09);
}

.modalActions button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.errorText {
  margin-top: 12px !important;
  color: #be4037 !important;
  font-weight: 700;
}
'''
          if css_marker not in css_text:
              raise SystemExit('css marker not found')
          css.write_text(css_text.replace(css_marker, css_insert, 1))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/app/profiles/profiles-client-page.tsx apps/web/app/app/profiles/profiles-canonical.module.css
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/profiles/profiles-client-page.tsx apps/web/app/app/profiles/profiles-canonical.module.css
          git commit -m "fix(profiles): restore permanent delete name confirmation"
          git push origin HEAD:agent/profiles-canonical-ui
