name: Stories UX Temporary Format

on:
  push:
    branches:
      - fix/stories-ux-v2-closeout

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stories-ux-v2-closeout
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/components/story/new-adventure-sheet-localized.tsx apps/web/components/story/profile-stories-section-localized.tsx apps/web/i18n/request.ts apps/web/messages/stories/en.json apps/web/messages/stories/tr.json apps/web/tests/profile-stories-section.test.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/story/new-adventure-sheet-localized.tsx apps/web/components/story/profile-stories-section-localized.tsx apps/web/i18n/request.ts apps/web/messages/stories/en.json apps/web/messages/stories/tr.json apps/web/tests/profile-stories-section.test.tsx
          git commit -m "style(stories): format Stories UX closeout"
          git push origin HEAD:fix/stories-ux-v2-closeout
