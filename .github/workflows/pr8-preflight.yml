name: PR-8 Preflight

on:
  push:
    branches:
      - agent/cross-domain-hardening-pr8

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumi_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumi_integrity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target and print exact patch
        run: |
          pnpm exec prettier --write packages/profiles/scripts/cross-domain-integrity-db-selftest.mjs
          git diff -- packages/profiles/scripts/cross-domain-integrity-db-selftest.mjs
      - name: Validate migration integrity policy
        run: node tooling/data-integrity/check-migrations.mjs
      - name: Self-test migration integrity policy
        run: node tooling/data-integrity/migration-integrity-selftest.mjs
      - name: Cross-domain PostgreSQL integrity
        env:
          CROSS_DOMAIN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/profiles profile:cross-domain-selftest
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
