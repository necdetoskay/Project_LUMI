name: NPC Production Demo Repair Preflight

on:
  push:
    branches:
      - fix/npc-integrity-production-demo-backfill

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumi_demo_repair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumi_demo_repair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_demo_repair
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_demo_repair
    steps:
      - name: Checkout production-verified generation-1 baseline
        uses: actions/checkout@v4
        with:
          ref: 2c7bd2810f2082c54bc7bb9551ee3eebe14a2877
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap generation 1 exactly as PR 450 production
        env:
          VERCEL_ENV: production
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs

      - name: Seed legacy demo with pre-PR-452 writer
        env:
          NODE_ENV: test
          LUMI_DEMO_CONFIRM: lumi-demo-v1
          LUMI_DEMO_PARENT_PASSWORD: LumiDemoRepair-123!
        run: pnpm demo:seed

      - name: Prove legacy demo contains orphan NPC-owned rows
        shell: bash
        run: |
          snapshots=$(psql "$DATABASE_URL" -X -Atc "SELECT count(*) FROM npc_intelligence.npc_snapshots WHERE household_id='51000000-0000-4000-8000-000000000001'::uuid AND world_id='51000000-0000-4000-8000-000000000004'::uuid AND npc_id IN ('51000000-0000-4000-8000-000000000030'::uuid,'51000000-0000-4000-8000-000000000031'::uuid,'51000000-0000-4000-8000-000000000032'::uuid)")
          registries=$(psql "$DATABASE_URL" -X -Atc "SELECT count(*) FROM profile.world_npcs WHERE character_id IN ('51000000-0000-4000-8000-000000000030'::uuid,'51000000-0000-4000-8000-000000000031'::uuid,'51000000-0000-4000-8000-000000000032'::uuid)")
          test "$snapshots" = "3"
          test "$registries" = "0"
          echo "Legacy production shape reproduced: $snapshots snapshots, $registries typed registries."

      - name: Checkout production repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/npc-integrity-production-demo-backfill
          fetch-depth: 0
      - run: pnpm install --frozen-lockfile

      - name: Run exact managed production migration path
        env:
          VERCEL_ENV: production
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs

      - name: Verify canonical repair and migration ledgers
        shell: bash
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            character_count integer;
            registry_count integer;
            origin_count integer;
            generation_value integer;
          BEGIN
            SELECT count(*) INTO character_count
            FROM profile.lumi_characters
            WHERE id IN (
              '51000000-0000-4000-8000-000000000030'::uuid,
              '51000000-0000-4000-8000-000000000031'::uuid,
              '51000000-0000-4000-8000-000000000032'::uuid
            )
              AND household_id = '51000000-0000-4000-8000-000000000001'::uuid
              AND child_profile_id = '51000000-0000-4000-8000-000000000002'::uuid
              AND character_subtype = 'npc';

            SELECT count(*) INTO registry_count
            FROM profile.world_npcs
            WHERE character_id IN (
              '51000000-0000-4000-8000-000000000030'::uuid,
              '51000000-0000-4000-8000-000000000031'::uuid,
              '51000000-0000-4000-8000-000000000032'::uuid
            )
              AND world_id = '51000000-0000-4000-8000-000000000004'::uuid
              AND household_id = '51000000-0000-4000-8000-000000000001'::uuid
              AND child_profile_id = '51000000-0000-4000-8000-000000000002'::uuid;

            SELECT count(*) INTO origin_count
            FROM profile.character_origin_packages
            WHERE id IN (
              '51000000-0000-4000-8000-000000000033'::uuid,
              '51000000-0000-4000-8000-000000000034'::uuid,
              '51000000-0000-4000-8000-000000000035'::uuid
            )
              AND household_id = '51000000-0000-4000-8000-000000000001'::uuid
              AND child_profile_id = '51000000-0000-4000-8000-000000000002'::uuid;

            SELECT generation INTO generation_value
            FROM public.lumi_schema_generation
            WHERE singleton = TRUE;

            IF character_count <> 3 OR registry_count <> 3 OR origin_count <> 3 THEN
              RAISE EXCEPTION 'Canonical demo repair incomplete: characters %, registries %, origins %', character_count, registry_count, origin_count;
            END IF;
            IF generation_value <> 1 THEN
              RAISE EXCEPTION 'Schema generation changed unexpectedly: %', generation_value;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM public.lumi_schema_migrations
              WHERE scope='profiles' AND migration_file='0081_legacy_demo_npc_character_backfill.sql'
            ) THEN
              RAISE EXCEPTION 'Profile repair migration missing from central ledger';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM profile._world_migration_ledger
              WHERE filename='0016_legacy_demo_world_npc_backfill.sql'
            ) THEN
              RAISE EXCEPTION 'World repair migration missing from ledger';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM npc_intelligence._npc_intelligence_migration_ledger
              WHERE filename='9000_npc_referential_integrity_hardening.sql'
            ) THEN
              RAISE EXCEPTION 'NPC hardening migration missing from ledger';
            END IF;
          END
          $$;
          SQL

      - name: Run second managed pass to prove idempotency
        env:
          VERCEL_ENV: production
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs

      - name: Verify migration policy and repository quality gates
        run: |
          pnpm exec prettier --check packages/profiles/migrations/0081_legacy_demo_npc_character_backfill.sql packages/world/migrations/0016_legacy_demo_world_npc_backfill.sql
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish preflight result marker
        if: always()
        shell: bash
        env:
          PREFLIGHT_STATUS: ${{ job.status }}
          PREFLIGHT_SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin fix/npc-integrity-production-demo-backfill
          git checkout -B preflight-status origin/fix/npc-integrity-production-demo-backfill
          mkdir -p .preflight
          printf 'status=%s\nsource_sha=%s\n' "$PREFLIGHT_STATUS" "$PREFLIGHT_SOURCE_SHA" > .preflight/npc-production-demo-repair.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .preflight/npc-production-demo-repair.txt
          git commit -m 'ci: record NPC production demo repair preflight' || exit 0
          git push origin HEAD:fix/npc-integrity-production-demo-backfill
