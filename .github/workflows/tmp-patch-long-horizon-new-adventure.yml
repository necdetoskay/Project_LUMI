name: Patch long-horizon New Adventure locator
on:
  push:
    branches:
      - fix/long-horizon-new-adventure-strict
permissions:
  contents: write
jobs:
  patch:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch strict New Adventure locator
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts')
          s = p.read_text()
          old = 'page.getByRole("button", { name: "Yeni Macera" })'
          new = 'page.getByRole("button", { name: "Yeni Macera", exact: true }).first()'
          count = s.count(old)
          if count == 0:
            raise SystemExit('New Adventure locator not found')
          p.write_text(s.replace(old, new))
          print(f'patched {count} locator(s)')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts
          git commit -m "test(long-horizon): disambiguate New Adventure button"
          git push
