name: Temporary long-horizon story completion UI patch

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-long-horizon-playwright-pack
      - name: Add canonical story completion action to visible reader UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/components/story/story-reader-client.tsx')
          text = p.read_text()

          old = '''  const handleManualCheckpoint = useCallback(async () => {\n'''
          new = '''  const handleCompleteSession = useCallback(async () => {\n    if (!payload || !currentScene) {\n      return;\n    }\n\n    setSubmitting(true);\n    setError(null);\n    setInfo(null);\n\n    try {\n      await postAction(\n        `/api/stories/sessions/${encodeURIComponent(sessionId)}/complete`,\n        {\n          expectedVersion: sessionVersion,\n          idempotencyKey: newIdempotencyKey(),\n        },\n      );\n      setInfo("Hikâye tamamlandı.");\n      await loadReader();\n    } catch (nextError) {\n      setError(\n        nextError instanceof Error\n          ? nextError.message\n          : "Hikâye tamamlanamadı.",\n      );\n    } finally {\n      setSubmitting(false);\n    }\n  }, [currentScene, loadReader, payload, sessionId, sessionVersion]);\n\n  const handleManualCheckpoint = useCallback(async () => {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'handler insertion match count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        ) : (\n          <p className="mt-4 text-sm text-on-surface-variant">\n            Bu sahne icin kullanilabilir secim bulunmuyor.\n          </p>\n        )}\n'''
          new = '''        ) : payload?.playback.session.sessionStatus === "completed" ? (\n          <div className="mt-4 rounded-xl border border-primary/20 bg-primary-fixed/35 p-5">\n            <p className="font-semibold text-on-surface">Hikâye tamamlandı.</p>\n            {childProfileId ? (\n              <a\n                className="mt-4 inline-flex min-h-11 items-center rounded-xl bg-primary px-4 text-sm font-semibold text-on-primary"\n                href={`/app/profiles/${encodeURIComponent(childProfileId)}?tab=stories`}\n              >\n                Hikâyelere dön\n              </a>\n            ) : null}\n          </div>\n        ) : (\n          <div className="mt-4 rounded-xl border border-outline-variant bg-surface-container-low p-5">\n            <p className="text-sm text-on-surface-variant">\n              Bu sahne icin kullanilabilir secim bulunmuyor.\n            </p>\n            {currentScene ? (\n              <button\n                className="mt-4 inline-flex min-h-11 items-center rounded-xl bg-primary px-4 text-sm font-semibold text-on-primary disabled:opacity-50"\n                data-testid="complete-story"\n                disabled={submitting || checkpointSaving}\n                onClick={() => void handleCompleteSession()}\n                type="button"\n              >\n                {submitting ? "Tamamlanıyor..." : "Hikâyeyi Tamamla"}\n              </button>\n            ) : null}\n          </div>\n        )}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'completion UI match count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text)

          Path('.github/workflows/tmp-long-horizon-story-complete-ui.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(story): allow terminal stories to complete in reader UI"
          git push origin HEAD:agent/live-long-horizon-playwright-pack
