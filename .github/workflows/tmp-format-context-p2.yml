name: Temporary Format Context P2

on:
  push:
    branches:
      - agent/context-p2-compaction

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-p2-compaction
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/profiles/src/application/generation-context-compaction.ts packages/profiles/src/application/generation-context-compaction.test.ts packages/profiles/src/application/generation-context-assembler.ts packages/profiles/src/index.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profiles/src/application/generation-context-compaction.ts packages/profiles/src/application/generation-context-compaction.test.ts packages/profiles/src/application/generation-context-assembler.ts packages/profiles/src/index.ts
          git commit -m "style(context): format P2 compaction"
          git push origin HEAD:agent/context-p2-compaction
