name: Phase 6 Lockfile Repair

on:
  push:
    branches:
      - agent/story-context-production-authorities

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-context-production-authorities
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: synchronize pnpm lockfile"
          git push origin HEAD:agent/story-context-production-authorities
