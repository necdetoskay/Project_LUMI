name: Ops Age-6 Living World Bootstrap Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-age6-bootstrap-recovery.yml"

permissions:
  contents: read

jobs:
  recover-existing-age6:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://project-lumi-web.vercel.app
      CHILD_PROFILE_ID: c61ddfa0-c149-45a5-98af-71472d0e0ac5
      PARENT_EMAIL: ${{ secrets.LUMI_LONG_HORIZON_PARENT_EMAIL }}
      PARENT_PASSWORD: ${{ secrets.LUMI_LONG_HORIZON_PARENT_PASSWORD }}

    steps:
      - name: Guard recovery credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PARENT_EMAIL"
          test -n "$PARENT_PASSWORD"
          test -n "$CHILD_PROFILE_ID"
          echo "Recovery target: existing age-6 profile $CHILD_PROFILE_ID"

      - name: Login and resolve existing production scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          cookie="$RUNNER_TEMP/lumi-cookie.jar"
          login="$RUNNER_TEMP/login.json"
          onboarding="$RUNNER_TEMP/onboarding.json"
          profile="$RUNNER_TEMP/profile.json"
          characters="$RUNNER_TEMP/characters-before.json"
          cycle="$RUNNER_TEMP/cycle-before.json"

          jq -nc --arg email "$PARENT_EMAIL" --arg password "$PARENT_PASSWORD" \
            '{email:$email,password:$password}' > "$RUNNER_TEMP/login-request.json"

          curl --fail-with-body --silent --show-error \
            --cookie-jar "$cookie" --cookie "$cookie" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/login-request.json" \
            "$BASE_URL/api/auth/login" > "$login"
          jq -e '.parent.id' "$login" >/dev/null

          curl --fail-with-body --silent --show-error \
            --cookie "$cookie" \
            "$BASE_URL/api/onboarding" > "$onboarding"

          household_id="$(jq -r '.onboarding.householdId // empty' "$onboarding")"
          test -n "$household_id"

          curl --fail-with-body --silent --show-error \
            --cookie "$cookie" \
            "$BASE_URL/api/child-profiles/$CHILD_PROFILE_ID?householdId=$household_id" > "$profile"
          jq -e --arg id "$CHILD_PROFILE_ID" '.profile.id == $id' "$profile" >/dev/null

          curl --fail-with-body --silent --show-error \
            --cookie "$cookie" \
            "$BASE_URL/api/characters?householdId=$household_id&childProfileId=$CHILD_PROFILE_ID" > "$characters"

          existing_character_id="$(jq -r '.characters[0].id // empty' "$characters")"
          test -n "$existing_character_id"

          curl --fail-with-body --silent --show-error \
            --cookie "$cookie" \
            "$BASE_URL/api/character-creation/canonical?householdId=$household_id&childProfileId=$CHILD_PROFILE_ID" > "$cycle"

          jq -e '.cycle.status == "completed" and .cycle.currentStep == "completed"' "$cycle" >/dev/null
          committed_character_id="$(jq -r '.cycle.latestSummary.committedCharacterId // empty' "$cycle")"
          test -n "$committed_character_id"
          test "$committed_character_id" = "$existing_character_id"

          echo "household_id=$household_id" >> "$GITHUB_OUTPUT"
          echo "existing_character_id=$existing_character_id" >> "$GITHUB_OUTPUT"
          echo "cookie=$cookie" >> "$GITHUB_OUTPUT"
          echo "Pre-recovery completed cycle confirmed for existing character $existing_character_id"

      - name: Re-finalize existing character and trigger deferred bootstrap
        id: recover
        shell: bash
        env:
          HOUSEHOLD_ID: ${{ steps.scope.outputs.household_id }}
          EXISTING_CHARACTER_ID: ${{ steps.scope.outputs.existing_character_id }}
          COOKIE: ${{ steps.scope.outputs.cookie }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/finalize-request.json"
          response="$RUNNER_TEMP/finalize-response.json"

          jq -nc \
            --arg householdId "$HOUSEHOLD_ID" \
            --arg childProfileId "$CHILD_PROFILE_ID" \
            '{action:"finalize",householdId:$householdId,childProfileId:$childProfileId}' > "$request"

          curl --fail-with-body --silent --show-error \
            --cookie "$COOKIE" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request" \
            "$BASE_URL/api/character-creation/canonical" > "$response"

          recovered_character_id="$(jq -r '.characterId // empty' "$response")"
          test -n "$recovered_character_id"
          test "$recovered_character_id" = "$EXISTING_CHARACTER_ID"
          jq -e '.bootstrap.status == "pending" and .bootstrap.manifestStatus == "pending"' "$response" >/dev/null

          echo "character_id=$recovered_character_id" >> "$GITHUB_OUTPUT"
          echo "Recovery finalize reused existing character: $recovered_character_id"
          echo "Deferred Living World bootstrap accepted: pending"

      - name: Capture post-recovery product evidence
        shell: bash
        env:
          HOUSEHOLD_ID: ${{ steps.scope.outputs.household_id }}
          CHARACTER_ID: ${{ steps.recover.outputs.character_id }}
          COOKIE: ${{ steps.scope.outputs.cookie }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/finalize-response.json" "$RUNNER_TEMP/evidence/finalize-response.json"
          cp "$RUNNER_TEMP/cycle-before.json" "$RUNNER_TEMP/evidence/cycle-before.json"
          cp "$RUNNER_TEMP/characters-before.json" "$RUNNER_TEMP/evidence/characters-before.json"

          # Give the Next.js after() bootstrap enough time to materialize living-world state.
          sleep 20

          curl --fail-with-body --silent --show-error \
            --cookie "$COOKIE" \
            "$BASE_URL/api/characters?householdId=$HOUSEHOLD_ID&childProfileId=$CHILD_PROFILE_ID" \
            > "$RUNNER_TEMP/evidence/characters-after.json"

          curl --fail-with-body --silent --show-error \
            --cookie "$COOKIE" \
            "$BASE_URL/api/child-profiles/$CHILD_PROFILE_ID/world?householdId=$HOUSEHOLD_ID" \
            > "$RUNNER_TEMP/evidence/world-after.json"

          curl --fail-with-body --silent --show-error \
            --cookie "$COOKIE" \
            "$BASE_URL/api/child-profiles/$CHILD_PROFILE_ID/stories/adventure-candidates?householdId=$HOUSEHOLD_ID" \
            > "$RUNNER_TEMP/evidence/adventure-candidates-after.json"

          jq -n \
            --arg childProfileId "$CHILD_PROFILE_ID" \
            --arg householdId "$HOUSEHOLD_ID" \
            --arg characterId "$CHARACTER_ID" \
            '{childProfileId:$childProfileId,householdId:$householdId,characterId:$characterId,recovery:"finalize-reused-existing-character",bootstrapTrigger:"accepted"}' \
            > "$RUNNER_TEMP/evidence/recovery-summary.json"

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: age6-bootstrap-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
