name: Temporary Onboarding Validation
on:
  push:
    branches: [agent/character-onboarding-live-e2e]
    paths: [.github/workflows/tmp-onboarding-map.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format onboarding slice
        run: |
          pnpm exec prettier --write \
            packages/profiles/src/application/character-foundation-onboarding.service.ts \
            packages/profiles/src/application/character-first-identity-suggestion.service.ts \
            packages/profiles/src/application/character-creation-cycle.service.ts \
            packages/profiles/src/application/character-origin-suggestion.service.ts \
            packages/profiles/src/db/schema/profile/llm-task-model-settings.ts \
            packages/profiles/migrations/0065_character_foundation_onboarding.sql \
            apps/web/lib/character-onboarding/finalize-character-foundation.service.ts
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .
            git commit -m 'chore: format onboarding foundation slice'
            git push
          fi
      - name: Typecheck profiles
        run: pnpm --filter @lumi/profiles typecheck
      - name: Typecheck web
        run: pnpm --filter @lumi/web typecheck
