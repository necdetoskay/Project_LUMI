name: Temporary Onboarding Map
on:
  push:
    branches: [agent/character-onboarding-live-e2e]
    paths: [.github/workflows/tmp-onboarding-map.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Map canonical onboarding capabilities
        shell: bash
        run: |
          echo '=== PROMPT KEYS ==='
          grep -RIn 'character_onboarding\.' packages apps | head -n 400 || true
          echo '=== WORLD / REGION / SAGA SERVICES ==='
          grep -RInE '^export (async )?function.*(World|Region|Saga)|generate.*(World|Region|Saga)|select.*(World|Region|Saga)' packages/world/src packages/profiles/src/application 2>/dev/null | head -n 500 || true
          echo '=== CREATION SCHEMA ==='
          grep -RInE 'characterCreation(Cycles|Selections)|current_step|currentStep' packages/profiles/src packages/profiles/migrations | head -n 500 || true
          echo '=== AI TASK TYPES ==='
          grep -RInE 'character_(world|region|origin|saga|identity)|world_.*suggest' packages/profiles/src apps/web | head -n 500 || true
