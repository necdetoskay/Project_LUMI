name: Temporary Onboarding Validation
on:
  push:
    branches: [agent/character-onboarding-live-e2e]
    paths: [.github/workflows/tmp-onboarding-map.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair typed selection payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/profiles/src/application/character-foundation-onboarding.service.ts')
          s=p.read_text()
          s=s.replace('selectionPayload: input.suggestion,', 'selectionPayload: { ...input.suggestion },')
          p.write_text(s)
          PY
      - name: Format onboarding slice
        run: |
          pnpm exec prettier --write \
            packages/profiles/src/application/character-foundation-onboarding.service.ts \
            packages/profiles/src/application/character-first-identity-suggestion.service.ts \
            packages/profiles/src/application/character-creation-cycle.service.ts \
            packages/profiles/src/application/character-origin-suggestion.service.ts \
            packages/profiles/src/db/schema/profile/llm-task-model-settings.ts \
            apps/web/lib/character-onboarding/finalize-character-foundation.service.ts
      - name: Commit repairs if needed
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .
            git commit -m 'fix: type onboarding selection payloads'
            git push
          fi
      - name: Typecheck profiles
        run: pnpm --filter @lumi/profiles typecheck
      - name: Typecheck web
        run: pnpm --filter @lumi/web typecheck
