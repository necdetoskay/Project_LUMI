name: Temporary Onboarding Map
on:
  push:
    branches: [agent/character-onboarding-live-e2e]
    paths: [.github/workflows/tmp-onboarding-map.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Map wizard and services
        shell: bash
        run: |
          echo '=== WIZARD FILES ==='
          find 'apps/web/app/app/profiles/[childProfileId]/characters/new' -type f -maxdepth 4 -print | sort
          echo '=== API ROUTES ==='
          find apps/web/app/api/character-creation -type f -print | sort
          echo '=== STEP / ROUTE REFERENCES ==='
          grep -RInE 'currentStep|stepKey|router\.push|characters/new/' 'apps/web/app/app/profiles/[childProfileId]/characters/new' packages/profiles/src/application apps/web/app/api/character-creation | head -n 500 || true
          echo '=== CHARACTER CREATION SERVICES ==='
          ls -1 packages/profiles/src/application/*character*{suggestion,creation-cycle}* 2>/dev/null || true
          echo '=== ORIGIN EXPORTS ==='
          grep -RInE '^export (async )?function|^export const|^export type' packages/profiles/src/application/character-origin-suggestion.service.ts packages/profiles/src/application/character-identity-suggestion.service.ts packages/profiles/src/application/character-bootstrap.service.ts | head -n 300 || true
