name: Social Genesis Format Diff

on:
  push:
    branches:
      - agent/social-genesis-relationship-graph

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier --write apps/web/app/api/settings/test-lab/genesis/social/route.ts
          git diff -- apps/web/app/api/settings/test-lab/genesis/social/route.ts
          exit 1
