name: Temporary Landing Asset Recovery

on:
  push:
    branches:
      - fix/landing-webp-binary-assets
    paths:
      - .github/workflows/tmp-landing-asset-recovery.yml
      - apps/web/app/api/landing-art/_exact/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-landing-asset-recovery.yml
      - apps/web/app/api/landing-art/_exact/**

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Rebuild approved mockup and create inspection crops
        shell: python
        run: |
          from __future__ import annotations

          import base64
          import hashlib
          import re
          from pathlib import Path

          from PIL import Image, ImageDraw

          root = Path("apps/web/app/api/landing-art/_exact")
          payload = []
          for path in sorted(root.glob("part*.ts")):
              match = re.search(r'export default "([A-Za-z0-9+/=]+)";', path.read_text())
              if not match:
                  raise SystemExit(f"cannot parse {path}")
              payload.append(match.group(1))

          raw = base64.b64decode("".join(payload))
          expected = "faaae7ea715f4e2d8538a01fffd9429514f4f01601c17b9d7d4885349c5b3648"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"mockup sha mismatch: {actual}")

          out = Path("tmp-landing-recovery")
          out.mkdir(exist_ok=True)
          source = out / "approved-mockup.webp"
          source.write_bytes(raw)

          image = Image.open(source).convert("RGB")
          print("approved mockup:", image.size, actual)

          annotated = image.copy()
          draw = ImageDraw.Draw(annotated)
          for x in range(0, image.width, 100):
              draw.line((x, 0, x, image.height), fill=(255, 255, 255), width=1)
              draw.text((x + 3, 3), str(x), fill=(255, 255, 255))
          for y in range(0, image.height, 100):
              draw.line((0, y, image.width, y), fill=(255, 255, 255), width=1)
              draw.text((3, y + 3), str(y), fill=(255, 255, 255))

          # Broad inspection candidates only. Final crop values will be chosen
          # after visual review of this artifact.
          candidates = {
              "hero": (600, 95, 1290, 610),
              "card-story": (250, 690, 430, 965),
              "card-explore": (665, 690, 845, 965),
              "card-grow": (1075, 690, 1255, 965),
          }
          colors = [(255, 80, 80), (80, 255, 120), (80, 190, 255), (255, 210, 80)]
          for (name, box), color in zip(candidates.items(), colors, strict=True):
              draw.rectangle(box, outline=color, width=4)
              draw.text((box[0] + 6, box[1] + 6), name, fill=color)
              image.crop(box).save(out / f"candidate-{name}.png")

          annotated.save(out / "approved-mockup-grid.png")

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-asset-recovery-inspection
          path: tmp-landing-recovery/
          if-no-files-found: error
          retention-days: 2
