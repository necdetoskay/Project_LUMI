name: Temporary Landing Asset Recovery

on:
  push:
    branches:
      - fix/landing-webp-binary-assets
    paths:
      - .github/workflows/tmp-landing-asset-recovery.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-landing-asset-recovery.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect historical packed hero segments
        shell: bash
        run: |
          set -euo pipefail
          old_head='a2ee679f0a96143e8b6a34aa8e6fd80b376da7c1'
          mkdir -p tmp-landing-recovery
          git show "$old_head:apps/web/public/landing/packed/hero-world.part0.b64" > tmp-landing-recovery/hero-world.part0.b64
          git show "$old_head:apps/web/public/landing/packed/hero-world.part1.b64" > tmp-landing-recovery/hero-world.part1.b64
          python - <<'PY'
          from pathlib import Path
          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n \t")
          for index in (0, 1):
              path = Path(f"tmp-landing-recovery/hero-world.part{index}.b64")
              text = path.read_text()
              invalid = [(i, repr(ch), ord(ch)) for i, ch in enumerate(text) if ch not in allowed]
              print(f"part{index}: chars={len(text)} mod4={len(text.strip()) % 4} invalid_count={len(invalid)}")
              print(f"part{index}: prefix={text[:24]!r} suffix={text[-48:]!r}")
              print(f"part{index}: first_invalid={invalid[:8]}")
          PY

      - name: Recover historical packed hero
        shell: python
        run: |
          import base64
          from pathlib import Path

          out = Path("tmp-landing-recovery")
          decoded = []
          for index in (0, 1):
              text = (out / f"hero-world.part{index}.b64").read_text()
              compact = "".join(text.split())
              decoded.append(base64.b64decode(compact, validate=True))
          (out / "hero-world.webp").write_bytes(b"".join(decoded))

      - name: Validate recovered hero
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          from PIL import Image

          path = Path("tmp-landing-recovery/hero-world.webp")
          raw = path.read_bytes()
          if raw[:4] != b"RIFF" or raw[8:12] != b"WEBP":
              raise SystemExit("historical packed hero is not RIFF/WEBP")
          with Image.open(path) as image:
              image.verify()
          with Image.open(path) as image:
              print("hero dimensions:", image.size)
          print("hero bytes:", len(raw))
          print("hero sha256:", hashlib.sha256(raw).hexdigest())

      - name: Upload recovered hero
        uses: actions/upload-artifact@v4
        with:
          name: landing-recovered-hero
          path: tmp-landing-recovery/hero-world.webp
          if-no-files-found: error
          retention-days: 2
