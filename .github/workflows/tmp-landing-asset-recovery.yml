name: Temporary Landing Asset Recovery

on:
  push:
    branches:
      - fix/landing-webp-binary-assets
    paths:
      - .github/workflows/tmp-landing-asset-recovery.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-landing-asset-recovery.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Recover historical packed hero
        shell: bash
        run: |
          set -euo pipefail
          old_head='a2ee679f0a96143e8b6a34aa8e6fd80b376da7c1'
          mkdir -p tmp-landing-recovery
          git show "$old_head:apps/web/public/landing/packed/hero-world.part0.b64" | base64 --decode > tmp-landing-recovery/hero-world.part0.bin
          git show "$old_head:apps/web/public/landing/packed/hero-world.part1.b64" | base64 --decode > tmp-landing-recovery/hero-world.part1.bin
          cat tmp-landing-recovery/hero-world.part0.bin tmp-landing-recovery/hero-world.part1.bin > tmp-landing-recovery/hero-world.webp
          wc -c tmp-landing-recovery/hero-world.part0.bin tmp-landing-recovery/hero-world.part1.bin tmp-landing-recovery/hero-world.webp

      - name: Validate recovered hero
        shell: python
        run: |
          from __future__ import annotations
          import hashlib
          from pathlib import Path
          from PIL import Image

          path = Path("tmp-landing-recovery/hero-world.webp")
          raw = path.read_bytes()
          if raw[:4] != b"RIFF" or raw[8:12] != b"WEBP":
              raise SystemExit("historical packed hero is not RIFF/WEBP")
          with Image.open(path) as image:
              image.verify()
          with Image.open(path) as image:
              print("hero dimensions:", image.size)
              if image.size != (1000, 563):
                  raise SystemExit(f"unexpected hero dimensions: {image.size}")
          print("hero bytes:", len(raw))
          print("hero sha256:", hashlib.sha256(raw).hexdigest())

      - name: Upload recovered hero
        uses: actions/upload-artifact@v4
        with:
          name: landing-recovered-hero
          path: tmp-landing-recovery/hero-world.webp
          if-no-files-found: error
          retention-days: 2
