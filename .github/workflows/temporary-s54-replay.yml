name: Temporary Sprint 54 Replay

on:
  push:
    branches:
      - feat/asset-storage-foundation-current

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/asset-storage-foundation-current
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch source Sprint 54 branch
        run: git fetch origin feat/asset-storage-foundation:refs/remotes/origin/feat/asset-storage-foundation
      - name: Replay Sprint 54 files only
        shell: bash
        run: |
          git checkout origin/feat/asset-storage-foundation -- \
            '.github/workflows/ultef-s54-r2-storage.yml' \
            'apps/web/app/api/assets/characters/[characterId]/content/[assetId]/route.ts' \
            'apps/web/app/api/assets/characters/[characterId]/route.ts' \
            'apps/web/lib/assets/character-visual-storage.ts' \
            'apps/web/lib/assets/s3-compatible-object-storage.ts' \
            'apps/web/scripts/db-latency-observe.mjs' \
            'apps/web/tests/ultef-s54-r2-character-visual-storage.integration.test.ts' \
            'docs/07-delivery/lumi/SAAS_PORTABILITY_ASSET_PLATFORM_ROADMAP.md' \
            'docs/07-delivery/lumi/sprint-54/SPRINT_SPEC.md'
      - name: Normalize replayed files
        run: pnpm exec prettier --write '.github/workflows/ultef-s54-r2-storage.yml' 'apps/web/app/api/assets/characters/[characterId]/content/[assetId]/route.ts' 'apps/web/app/api/assets/characters/[characterId]/route.ts' 'apps/web/lib/assets/character-visual-storage.ts' 'apps/web/lib/assets/s3-compatible-object-storage.ts' 'apps/web/scripts/db-latency-observe.mjs' 'apps/web/tests/ultef-s54-r2-character-visual-storage.integration.test.ts' 'docs/07-delivery/lumi/SAAS_PORTABILITY_ASSET_PLATFORM_ROADMAP.md' 'docs/07-delivery/lumi/sprint-54/SPRINT_SPEC.md'
      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-s54-replay.yml
      - name: Commit replay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(s54): replay portable asset storage on current main"
          git push
