name: Visual Style Format Fix

on:
  push:
    branches:
      - agent/visual-style-ci-stabilization

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-style-ci-stabilization
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format visual style files
        run: >-
          pnpm exec prettier --write
          apps/web/app/api/assets/items/batch/route.ts
          apps/web/lib/assets/item-state-grid.ts
          apps/web/tests/item-state-grid.test.ts
          apps/web/tests/visual-style-item-generation.contract.test.ts
          packages/media/src/application/index.ts
          packages/media/src/domain/index.ts
          packages/media/src/domain/item-visual-state.ts
          packages/media/src/domain/visual-style.ts
          packages/media/tests/application/visual-prompt-compiler.test.ts
          packages/media/tests/domain/visual-style.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web packages/media
          git commit -m "style: format visual style pipeline"
          git push origin HEAD:agent/visual-style-ci-stabilization
