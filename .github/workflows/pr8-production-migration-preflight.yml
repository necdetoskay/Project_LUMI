name: PR-8 Production Migration Preflight

on:
  push:
    branches:
      - fix/pr8-production-cross-domain-migrations

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumi_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumi_integrity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create production dependency fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d lumi_integrity -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA profile;
          CREATE TABLE profile.households (
            id uuid PRIMARY KEY
          );
          CREATE TABLE profile.child_profiles (
            id uuid PRIMARY KEY,
            household_id uuid NOT NULL,
            UNIQUE (id, household_id)
          );
          CREATE TABLE profile.worlds (
            id uuid PRIMARY KEY,
            household_id uuid NOT NULL,
            UNIQUE (id, household_id)
          );
          SQL

      - name: Run production cross-domain migrations
        env:
          VERCEL_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: node apps/web/scripts/vercel-production-cross-domain-migrate.mjs

      - name: Re-run production cross-domain migrations idempotently
        env:
          VERCEL_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: node apps/web/scripts/vercel-production-cross-domain-migrate.mjs

      - name: Verify migration ledgers and integrity objects
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d lumi_integrity -Atc "SELECT count(*) FROM privacy._privacy_migration_ledger WHERE filename = '0002_scope_and_status_integrity.sql'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d lumi_integrity -Atc "SELECT count(*) FROM media._media_migration_ledger WHERE filename = '0003_scope_and_numeric_integrity.sql'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d lumi_integrity -Atc "SELECT count(*) FROM prompts._prompt_migration_ledger WHERE filename = '0002_prompt_integrity.sql'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d lumi_integrity -Atc "SELECT count(*) FROM pg_constraint WHERE conname IN ('privacy_consent_child_scope_fk','privacy_export_child_scope_fk','privacy_consent_status_time_check','media_assets_child_scope_fk','media_assets_world_scope_fk','media_assets_dimensions_check','media_generation_cost_check','prompt_version_state_check','prompt_activation_registry_household_fk','prompt_activation_version_registry_fk')")" = "10"
          test "$(psql -h 127.0.0.1 -U postgres -d lumi_integrity -Atc "SELECT count(*) FROM pg_trigger WHERE tgname = 'trg_protect_published_prompt_version' AND NOT tgisinternal")" = "1"

      - name: Validate migration integrity policy
        run: node tooling/data-integrity/check-migrations.mjs
      - name: Self-test migration integrity policy
        run: node tooling/data-integrity/migration-integrity-selftest.mjs
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
