name: Temporary finalize long-horizon stats 233

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-long-horizon-playwright-pack

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final evidence patch
        run: python3 scripts/tmp-finalize-long-horizon-stats-233.py

      - name: Format changed file
        run: pnpm exec prettier --write apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts

      - name: Run long-horizon contract tests
        run: pnpm --filter @lumi/web exec vitest run tests/long-horizon-playwright.contract.test.ts

      - name: Typecheck web package
        run: pnpm --filter @lumi/web typecheck

      - name: Commit verified statistics changes and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/tmp-finalize-long-horizon-stats-233.yml
          rm scripts/tmp-finalize-long-horizon-stats-233.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(e2e): capture final long-horizon statistics"
          git push origin HEAD:agent/live-long-horizon-playwright-pack
