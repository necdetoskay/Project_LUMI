name: S35 Format Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'codex/sprint-35-outbox-worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/worker/src/outbox-runner.ts services/worker/tests/ultef-s35-outbox-worker.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/src/outbox-runner.ts services/worker/tests/ultef-s35-outbox-worker.integration.test.ts
          git commit -m "style(s35): format worker outbox changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
