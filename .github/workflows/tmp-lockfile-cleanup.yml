name: One-shot Lockfile Cleanup

on:
  push:
    branches:
      - agent/story-visual-asset-sheet-planner

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore minimal lockfile diff
        run: |
          git checkout origin/main -- pnpm-lock.yaml
          python - <<'PY'
          from pathlib import Path
          p = Path('pnpm-lock.yaml')
          text = p.read_text()
          marker = "      '@lumi/logger':\n        specifier: workspace:*\n        version: link:../../packages/logger\n"
          insert = marker + "      '@lumi/media':\n        specifier: workspace:*\n        version: link:../../packages/media\n"
          if "      '@lumi/media':\n        specifier: workspace:*\n        version: link:../../packages/media\n" not in text:
              if marker not in text:
                  raise SystemExit('apps/web logger marker not found')
              text = text.replace(marker, insert, 1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): minimize media dependency lockfile update"
            git push
          fi
      - run: pnpm install --frozen-lockfile
