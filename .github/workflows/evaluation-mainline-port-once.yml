name: Evaluation Mainline Port Once

on:
  push:
    branches:
      - agent/test-lab-evaluation-mainline-v2
    paths:
      - .github/workflows/evaluation-mainline-port-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-lab-evaluation-mainline-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply evaluation mainline patch
        run: node tooling/port-evaluation-mainline.mjs
      - name: Format touched files
        run: pnpm exec prettier --write apps/web/app/api/settings/test-lab/evaluations/route.ts apps/web/app/app/settings/test-lab/test-lab-client.tsx
      - name: Remove one-shot files
        run: rm tooling/port-evaluation-mainline.mjs .github/workflows/evaluation-mainline-port-once.yml
      - name: Commit evaluation mainline port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(test-lab): complete evaluation mainline port"
          git push origin HEAD:agent/test-lab-evaluation-mainline-v2
