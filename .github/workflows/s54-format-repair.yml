name: S54 Temporary Format Repair

on:
  push:
    branches: [feat/asset-storage-foundation]

permissions:
  contents: write

jobs:
  format-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/asset-storage-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format affected files
        run: |
          pnpm exec prettier --write \
            apps/web/lib/assets/character-visual-storage.ts \
            apps/web/lib/assets/s3-compatible-object-storage.ts \
            apps/web/scripts/db-latency-observe.mjs
      - name: Remove temporary workflow and commit repair
        run: |
          rm .github/workflows/s54-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(s54): format portable storage foundation"
          git push origin HEAD:feat/asset-storage-foundation
