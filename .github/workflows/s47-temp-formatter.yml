name: S47 Temporary Formatter

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s47/memory-aware-npc-decision-production
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format S47 files
        run: |
          pnpm exec prettier --write \
            packages/npc-intelligence/src/application/memory-aware-decision.service.ts \
            packages/npc-intelligence/src/application/memory-aware-utility.service.ts \
            packages/npc-intelligence/src/application/memory-decision-evidence-builder.service.ts \
            packages/npc-intelligence/tests/application/memory-aware-decision.service.test.ts \
            packages/npc-intelligence/tests/application/memory-aware-utility.service.test.ts \
            packages/npc-intelligence/tests/application/memory-decision-evidence-builder.service.test.ts \
            packages/npc-intelligence/tests/integration/s47-memory-aware-decision.integration.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/npc-intelligence
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(s47): format memory decision files"
            git push origin HEAD:s47/memory-aware-npc-decision-production
          fi
