name: NPC Write Path Audit

on:
  push:
    branches:
      - fix/npc-referential-integrity-hardening

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List direct NPC intelligence SQL writes
        shell: bash
        run: |
          echo '=== DIRECT SQL WRITES ==='
          git grep -nEi '(insert[[:space:]]+into|update|delete[[:space:]]+from)[[:space:]]+(["`]?npc_intelligence["`]?\.)?(npc_snapshots|beliefs|worker_npc_decisions|decision_traces|decision_events|opportunity_inbox|memories|memory_usages)' -- apps packages services tooling scripts || true
      - name: List Drizzle NPC table writes
        shell: bash
        run: |
          echo '=== DRIZZLE TABLE WRITES ==='
          git grep -nE '\.(insert|update|delete)\((npcSnapshots|npcBeliefs|beliefs|workerNpcDecisions|decisionTraces|decisionEvents|opportunityInbox|memories|memoryUsages)\)' -- apps packages services tooling scripts || true
      - name: List NPC snapshot and belief repository writers
        shell: bash
        run: |
          echo '=== REPOSITORY / UPSERT WRITERS ==='
          git grep -nE '(DrizzleNpcSnapshotRepository|DrizzleBeliefSourceRepository|\.snapshots\.upsert|beliefRepository\.)' -- apps packages services tooling scripts || true
