name: Temporary Phase 10 Gate D Rerun Monitor

on:
  pull_request:
    paths:
      - .ops/250-gate-d-rerun-monitor.trigger

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Discover Gate D rerun
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh run list --repo "$GH_REPO" --workflow "Temporary Phase 10 Gate D Fresh Age-6 Rerun" --branch ops/250-gate-d-rerun --limit 1 --json databaseId,status,conclusion,createdAt,headSha)"
          echo "LUMI_250_D_RERUN_DISCOVERY=$payload"
          run_id="$(printf '%s' "$payload" | jq -r '.[0].databaseId // empty')"
          test -n "$run_id"
          echo "LUMI_250_D_RERUN_ID=$run_id"
