name: Temporary Login Dashboard V2 Format

on:
  push:
    branches:
      - agent/login-dashboard-canonical-ui

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/login-dashboard-canonical-ui

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm exec prettier --write .

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format login dashboard v2"
          git push origin HEAD:agent/login-dashboard-canonical-ui

      - name: Verify formatting
        run: pnpm format:check
