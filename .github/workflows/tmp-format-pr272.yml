name: Format PR272
on:
  push:
    branches:
      - fix/long-horizon-dashboard-a11y-names
permissions:
  contents: write
jobs:
  format:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(long-horizon): format dashboard locators"
          git push
