name: Temporary PR 268 Prettier

on:
  push:
    branches:
      - codex/issue-249-genesis-phase-9

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-249-genesis-phase-9
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/profiles/src/application/legacy-character-foundation-backfill.service.ts
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-pr268-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profiles/src/application/legacy-character-foundation-backfill.service.ts .github/workflows/tmp-pr268-prettier.yml
          git commit -m "style(genesis): apply canonical prettier"
          git push
