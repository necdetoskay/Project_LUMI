name: Temporary 250 Compatibility Preflight

on:
  push:
    branches:
      - fix/250-compatibility-progressable-suggestions
    paths:
      - .github/workflows/temporary-250-compatibility-preflight.yml

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_onboarding_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_onboarding_browser_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_onboarding_browser_test
      PROFILE_DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_onboarding_browser_test
      STORY_TEST_DATABASE_URL: postgresql://lumi:lumi_test_only@127.0.0.1:5432/lumi_onboarding_browser_test
      LUMI_SETTINGS_ENCRYPTION_KEY: lumi-m7-playwright-encryption-key
      NODE_ENV: test
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record preflight identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment 250 --repo "$GITHUB_REPOSITORY"
          --body "Compatibility preflight started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (head $GITHUB_SHA). No production or paid model call is used."
      - name: Check changed-file formatting
        run: >-
          pnpm exec prettier --check
          apps/web/app/api/character-creation/canonical/route.ts
          apps/web/lib/character-onboarding/compatibility-suggestions.ts
          apps/web/tests/compatibility-suggestions.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Run compatibility unit regression
        run: >-
          pnpm --filter @lumi/web exec vitest run
          tests/compatibility-suggestions.test.ts
      - name: Apply migrations
        run: |
          pnpm --filter @lumi/web auth:migrate
          pnpm --filter @lumi/profiles profile:migrate
          pnpm --filter @lumi/world world:migrate
          pnpm --filter @lumi/story story:migrate
          pnpm --filter @lumi/npc-intelligence npc:migrate
      - name: Install Chromium
        run: pnpm --filter @lumi/web exec playwright install --with-deps chromium
      - name: Run canonical M7 browser journey
        run: >-
          pnpm --filter @lumi/web exec playwright test
          --config playwright.m7.config.ts
          tests/e2e/character-onboarding-m7.spec.ts
      - name: Record final preflight status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: >-
          gh issue comment 250 --repo "$GITHUB_REPOSITORY"
          --body "Compatibility preflight finished **$JOB_STATUS**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
