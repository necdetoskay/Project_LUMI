name: ULTEF S53 Compose Cold Start

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEB_PORT: 3001
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      PLAYWRIGHT_REUSE_EXISTING_SERVER: "true"
      AUTH_COOKIE_SECURE: "false"
      LUMI_SETTINGS_ENCRYPTION_KEY: "ultef-s53-compose-only-not-production"
      LUMI_DEMO_CONFIRM: lumi-demo-v1
      LUMI_DEMO_PARENT_PASSWORD: lumi-demo-local-only-2026
      DATABASE_URL: ${{ secrets.LUMI_DEV_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install browser test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @lumi/web exec playwright install --with-deps chromium

      - name: Ensure clean Docker state and fresh database volume
        working-directory: infra/compose
        run: docker compose down -v --remove-orphans || true

      - name: Build and start complete Compose stack from fresh volume
        working-directory: infra/compose
        run: docker compose up -d --build

      - name: Show Compose state
        working-directory: infra/compose
        run: docker compose ps -a

      - name: Verify schema migration job completed successfully
        working-directory: infra/compose
        run: |
          container_id="$(docker compose ps -a -q schema-migrate)"
          test -n "${container_id}"
          exit_code="$(docker inspect "${container_id}" --format '{{.State.ExitCode}}')"
          echo "schema-migrate exit code: ${exit_code}"
          test "${exit_code}" = "0"
          docker compose logs --no-color schema-migrate

      - name: Verify canonical schemas and Sprint 53 tables exist
        working-directory: infra/compose
        run: |
          check_table() {
            table="$1"
            result="$(docker compose run --rm --no-deps schema-migrate psql "${DATABASE_URL}" -tAc "SELECT to_regclass('${table}') IS NOT NULL")"
            echo "${table}: ${result}"
            test "${result}" = "t"
          }
          check_table public.parent_accounts
          check_table profile.households
          check_table profile.character_visual_generation_jobs
          check_table profile.character_visual_assets
          check_table profile.character_visual_canons

      - name: Wait for web health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              echo "web health passed on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "web health never became ready" >&2
          docker compose -f infra/compose/docker-compose.yml logs --no-color web >&2
          exit 1

      - name: Prepare canonical demo through the real Compose web artifact
        run: |
          headers=$(mktemp)
          curl --fail --silent --show-error -D "$headers" -o /dev/null \
            -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'action=prepare' http://127.0.0.1:3001/api/demo-control
          cat "$headers"
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' "$headers" | tail -1)
          echo "Redirect: $location"
          echo "$location" | grep -q 'result=success'

      - name: Verify Asset Management in a real browser against Compose
        run: pnpm --filter @lumi/web exec playwright test tests/e2e/ultef-s53-assets-compose.spec.ts

      - name: Verify worker stays running and healthy
        working-directory: infra/compose
        run: |
          container_id="$(docker compose ps -q worker)"
          test -n "${container_id}"
          for attempt in $(seq 1 45); do
            running="$(docker inspect "${container_id}" --format '{{.State.Running}}')"
            health="$(docker inspect "${container_id}" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
            echo "worker attempt ${attempt}: running=${running} health=${health}"
            if [ "${running}" = "true" ] && [ "${health}" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a >&2
          docker compose logs --no-color worker >&2
          exit 1

      - name: Re-run all schema migrations to prove idempotency
        working-directory: infra/compose
        run: docker compose run --rm schema-migrate

      - name: Restart web and prove migrated state survives restart
        working-directory: infra/compose
        run: |
          docker compose restart web
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color web >&2
          exit 1

      - name: Verify Sprint 53 table after migration replay and restart
        working-directory: infra/compose
        run: |
          result="$(docker compose run --rm --no-deps schema-migrate psql "${DATABASE_URL}" -tAc "SELECT to_regclass('profile.character_visual_canons') IS NOT NULL")"
          test "${result}" = "t"

      - name: Dump Compose diagnostics on failure
        if: failure()
        working-directory: infra/compose
        run: |
          docker compose ps -a || true
          docker compose logs --no-color schema-migrate web worker || true

      - name: Tear down Compose stack
        if: always()
        working-directory: infra/compose
        run: docker compose down -v --remove-orphans || true
