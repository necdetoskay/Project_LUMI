name: Temporary 250 Candidate Resilience Monitor

on:
  push:
    branches:
      - fix/250-adventure-candidate-poll-resilience
    paths:
      - .github/workflows/temporary-250-candidate-resilience-monitor.yml

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Report format-preflight run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow temporary-250-candidate-resilience-format-preflight.yml \
            --branch fix/250-adventure-candidate-poll-resilience \
            --event push --limit 1 \
            --json databaseId,status,conclusion,headSha,url)"
          gh issue comment 250 --repo "$GITHUB_REPOSITORY" \
            --body "Candidate resilience format-preflight monitor: \`$result\`"
