name: Temporary S55 Asset UI Patch

on:
  push:
    branches:
      - s55/generic-asset-management-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s55/generic-asset-management-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reframe Asset Management surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/app/assets/assets-client-page.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
            'Görsel Kütüphanesi',
            'Asset Management',
          )
          text = text.replace(
            'Mevcut karakter verilerinden yeni görseller üretin, adayları\n                karşılaştırın ve hikâyelerde kullanılacak kalıcı görünümü seçin.\n                Üretim karakter oluşturma işleminden bağımsızdır.',
            'Karakter, NPC, konum, eşya ve hikâye sahnesi görsellerini tek bir\n                varlık kütüphanesinde yönetin. Karakter üretim akışı bugün aktif;\n                diğer subject türleri generic asset çekirdeğine hazırdır ve üretim\n                yetenekleri Sprint 56 ile açılacaktır.',
          )
          needle = '        </header>\n\n        {characters.length === 0 ? ('
          block = '''        </header>\n\n        <section className="rounded-[2rem] border border-outline-variant/70 bg-white/85 p-6 shadow-sm md:p-7">\n          <p className="text-xs font-extrabold uppercase tracking-[0.14em] text-primary">\n            Varlık türleri\n          </p>\n          <div className="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-5">\n            {[\n              ["Karakter", "Aktif"],\n              ["NPC", "Core hazır"],\n              ["Konum", "Core hazır"],\n              ["Eşya", "Core hazır"],\n              ["Hikâye sahnesi", "Core hazır"],\n            ].map(([label, state]) => (\n              <div\n                className="rounded-2xl border border-outline-variant bg-surface-container-low px-4 py-4"\n                key={label}\n              >\n                <p className="font-extrabold text-on-surface">{label}</p>\n                <p className="mt-1 text-xs font-bold text-on-surface-variant">\n                  {state}\n                </p>\n              </div>\n            ))}\n          </div>\n          <p className="mt-4 text-sm leading-6 text-on-surface-variant">\n            Sprint 55 metadata, lifecycle, provenance ve canon modelini tüm varlık\n            türleri için ortaklaştırır. Yeni görsel üretim sağlayıcıları, batch/grid\n            üretim ve bütçe politikası Sprint 56 kapsamındadır.\n          </p>\n        </section>\n\n        {characters.length === 0 ? ('''
          if needle not in text:
              raise SystemExit('S55 UI insertion point not found')
          text = text.replace(needle, block, 1)
          path.write_text(text, encoding='utf-8')
          PY
          pnpm exec prettier --write apps/web/app/app/assets/assets-client-page.tsx
          rm .github/workflows/s55-ui-patch.yml
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/assets/assets-client-page.tsx .github/workflows/s55-ui-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(s55): reframe Asset Management around generic subjects"
          git push
