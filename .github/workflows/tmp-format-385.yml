name: Temporary Format 385

on:
  push:
    branches:
      - agent/385-memory-seeds-origin-threads
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.head_ref == 'agent/385-memory-seeds-origin-threads' || github.ref_name == 'agent/385-memory-seeds-origin-threads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/385-memory-seeds-origin-threads
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format issue 385 files and remove temporary helpers
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/web/app/api/settings/test-lab/genesis/memory-threads/route.ts \
            apps/web/app/app/settings/test-lab/memory-thread-genesis-test-panel.tsx \
            packages/profiles/src/application/memory-thread-genesis-context-projection.test.ts \
            packages/profiles/src/application/memory-thread-genesis.service.test.ts \
            packages/profiles/src/domain/memory-thread-genesis.test.ts \
            packages/profiles/src/domain/memory-thread-genesis.ts
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- package.json
          rm .github/workflows/tmp-format-385.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json \
            .github/workflows/tmp-format-385.yml \
            apps/web/app/api/settings/test-lab/genesis/memory-threads/route.ts \
            apps/web/app/app/settings/test-lab/memory-thread-genesis-test-panel.tsx \
            packages/profiles/src/application/memory-thread-genesis-context-projection.test.ts \
            packages/profiles/src/application/memory-thread-genesis.service.test.ts \
            packages/profiles/src/domain/memory-thread-genesis.test.ts \
            packages/profiles/src/domain/memory-thread-genesis.ts
          git commit -m "style(genesis): format memory thread implementation"
          git push origin HEAD:agent/385-memory-seeds-origin-threads
