name: Temporary S55 Compose Test Format Fix

on:
  push:
    branches:
      - s55/generic-asset-management-core

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s55/generic-asset-management-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/web/tests/e2e/ultef-s53-assets-compose.spec.ts
          rm .github/workflows/s55-compose-test-format-fix.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/ultef-s53-assets-compose.spec.ts .github/workflows/s55-compose-test-format-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(s55): format Compose asset contract"
          git push
