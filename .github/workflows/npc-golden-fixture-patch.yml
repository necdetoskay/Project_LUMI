name: NPC Golden Fixture Patch

on:
  push:
    branches:
      - fix/npc-referential-integrity-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npc-referential-integrity-hardening
      - name: Patch golden journey canonical NPC fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/tests/ultef-golden-headless.integration.test.ts")
          text = path.read_text()
          import_anchor = 'import { writeScenarioArtifacts } from "../../../tooling/ultef/src/artifacts.mjs";\n'
          import_line = 'import { seedCanonicalNpcFixture } from "./helpers/canonical-npc-fixture";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("golden import anchor missing")
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          seed_anchor = "      await seedStoryFixture(pool, fixture);\n"
          seed_block = '''      await seedCanonicalNpcFixture(pool, {\n        householdId: fixture.householdId,\n        childProfileId: fixture.childProfileId,\n        characterId: fixture.characterId,\n        worldId: fixture.worldId,\n        fixtureKey: `golden-headless-${fixture.householdId}`,\n        npcs: [\n          { id: sourceNpcId, name: "Mira" },\n          { id: targetNpcId, name: "Bora" },\n        ],\n      });\n'''
          if seed_block not in text:
              if seed_anchor not in text:
                  raise SystemExit("golden seed anchor missing")
              text = text.replace(seed_anchor, seed_anchor + seed_block, 1)
          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/ultef-golden-headless.integration.test.ts
          git commit -m "test: canonicalize golden journey NPC fixture"
          git push origin HEAD:fix/npc-referential-integrity-hardening
