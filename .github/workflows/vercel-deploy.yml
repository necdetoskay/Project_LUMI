# Main pushes deploy the current main SHA to Vercel production.
name: Vercel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_pCUTUf6ShnPxUoJ0hcxWZjHw
      VERCEL_PROJECT_ID: prj_Drfoxs3E6ioX234IVDCUMuHfgIOd
      VERCEL_PROJECT_NAME: project-lumi-web
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is required."
            exit 1
          fi

      - name: Verify Vercel project access
        run: |
          curl --fail-with-body --silent --show-error \
            --output /dev/null \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.target }}" = "production" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve deployment source
        id: source
        shell: bash
        run: |
          if [ "${{ steps.target.outputs.environment }}" = "production" ]; then
            git fetch --no-tags origin main
            deployment_ref="main"
            deployment_sha="$(git rev-parse origin/main)"
          else
            deployment_ref="$GITHUB_REF_NAME"
            deployment_sha="$GITHUB_SHA"
          fi

          if [ -z "$deployment_sha" ]; then
            echo "Unable to resolve deployment SHA."
            exit 1
          fi

          echo "ref=$deployment_ref" >> "$GITHUB_OUTPUT"
          echo "sha=$deployment_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved deployment source: $deployment_ref@$deployment_sha"

      - name: Create deployment request
        id: request
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.target.outputs.environment }}
          DEPLOYMENT_REF: ${{ steps.source.outputs.ref }}
          DEPLOYMENT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          request="$RUNNER_TEMP/vercel-deployment-request.json"
          response="$RUNNER_TEMP/vercel-deployment-response.json"

          jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg ref "$DEPLOYMENT_REF" \
            --arg sha "$DEPLOYMENT_SHA" \
            --arg remoteUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            '{
              name: $name,
              project: $project,
              gitSource: {
                type: "github",
                org: $org,
                repo: $repo,
                ref: $ref,
                sha: $sha
              },
              gitMetadata: {
                remoteUrl: $remoteUrl,
                commitRef: $ref,
                commitSha: $sha,
                dirty: false,
                ci: true,
                ciType: "github-actions",
                rootDirectory: "apps/web"
              }
            }' > "$request"

          if [ "$DEPLOYMENT_ENVIRONMENT" = "production" ]; then
            jq '. + {target: "production"}' "$request" > "$request.tmp"
            mv "$request.tmp" "$request"
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --output "$response" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$request" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID"

          deployment_id="$(jq -r '.id // empty' "$response")"
          deployment_url="$(jq -r '.url // empty' "$response")"
          deployment_target="$(jq -r '.target // empty' "$response")"
          deployment_state="$(jq -r '.readyState // .status // empty' "$response")"
          deployment_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' "$response")"

          if [ -z "$deployment_id" ] || [ -z "$deployment_url" ]; then
            echo "Vercel did not return a deployment id/url."
            jq '{error, id, url, target, readyState, status}' "$response"
            exit 1
          fi

          if [ "$DEPLOYMENT_ENVIRONMENT" = "preview" ] && [ "$deployment_target" = "production" ]; then
            echo "Safety check failed: preview request created a production deployment."
            exit 1
          fi

          if [ "$DEPLOYMENT_ENVIRONMENT" = "production" ] && [ -n "$deployment_sha" ] && [ "$deployment_sha" != "$DEPLOYMENT_SHA" ]; then
            echo "Safety check failed: Vercel created deployment for $deployment_sha instead of $DEPLOYMENT_SHA."
            exit 1
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=https://$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployment_target=${deployment_target:-preview}" >> "$GITHUB_OUTPUT"
          echo "deployment_state=${deployment_state:-unknown}" >> "$GITHUB_OUTPUT"

          echo "Deployment created: $deployment_id"
          echo "URL: https://$deployment_url"
          echo "Requested environment: $DEPLOYMENT_ENVIRONMENT"
          echo "Source: $DEPLOYMENT_REF@$DEPLOYMENT_SHA"
          echo "Vercel target: ${deployment_target:-preview}"
          echo "Initial state: ${deployment_state:-unknown}"

      - name: Deployment summary
        run: |
          echo "### Vercel deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ steps.target.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ref: ${{ steps.source.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment ID: ${{ steps.request.outputs.deployment_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ steps.request.outputs.deployment_target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Initial state: ${{ steps.request.outputs.deployment_state }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.request.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
