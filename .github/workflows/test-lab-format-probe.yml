name: Test Lab Format Probe

on:
  pull_request:
    paths:
      - ".github/workflows/test-lab-format-probe.yml"
      - "packages/ai/**"

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format known base files
        run: |
          pnpm exec prettier --write \
            apps/web/app/app/profiles/profiles-client-page.tsx \
            apps/web/components/profile/delete-profile-button.tsx \
            packages/profiles/src/db/repositories/drizzle/drizzle-child-profile.repository.ts \
            packages/profiles/tests/integration/profile-repository.integration.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-formatted-base-files
          path: |
            apps/web/app/app/profiles/profiles-client-page.tsx
            apps/web/components/profile/delete-profile-button.tsx
            packages/profiles/src/db/repositories/drizzle/drizzle-child-profile.repository.ts
            packages/profiles/tests/integration/profile-repository.integration.test.ts
          if-no-files-found: error
