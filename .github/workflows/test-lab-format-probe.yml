name: Test Lab Format Probe

on:
  pull_request:
    paths:
      - ".github/workflows/test-lab-format-probe.yml"
      - "packages/ai/**"

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit exact Prettier output
        run: |
          files=(
            apps/web/app/app/profiles/profiles-client-page.tsx
            apps/web/components/profile/delete-profile-button.tsx
            packages/profiles/src/db/repositories/drizzle/drizzle-child-profile.repository.ts
            packages/profiles/tests/integration/profile-repository.integration.test.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "__FORMAT_FILE_BEGIN__${file}"
            base64 -w0 "$file"
            echo
            echo "__FORMAT_FILE_END__${file}"
          done
