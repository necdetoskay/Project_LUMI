name: Test Lab Formatter Probe

on:
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format remaining Test Lab files
        run: |
          pnpm exec prettier --write \
            packages/ai/src/test-lab/infrastructure/drizzle-test-lab-repository.ts \
            packages/ai/tests/integration/drizzle-test-lab.repository.test.ts \
            packages/profiles/src/application/character-onboarding-test-lab-adapter.service.ts
      - uses: actions/upload-artifact@v4
        with:
          name: test-lab-prettier-final
          path: |
            packages/ai/src/test-lab/infrastructure/drizzle-test-lab-repository.ts
            packages/ai/tests/integration/drizzle-test-lab.repository.test.ts
            packages/profiles/src/application/character-onboarding-test-lab-adapter.service.ts
