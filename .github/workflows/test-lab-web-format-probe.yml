name: Test Lab Web Formatter Probe

on:
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format web Test Lab composition
        run: |
          pnpm exec prettier --write \
            apps/web/lib/ai/character-onboarding-test-lab-adapter.ts \
            apps/web/tests/character-onboarding-test-lab-adapter.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: test-lab-web-prettier
          path: |
            apps/web/lib/ai/character-onboarding-test-lab-adapter.ts
            apps/web/tests/character-onboarding-test-lab-adapter.test.ts
