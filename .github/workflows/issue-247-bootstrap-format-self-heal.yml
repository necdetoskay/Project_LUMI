name: Issue 247 bootstrap format self-heal

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'codex/issue-247-genesis-phase-7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format bootstrap integration
        run: |
          pnpm exec prettier --write apps/web/lib/character-onboarding/living-world-bootstrap.service.ts
          git rm .github/workflows/issue-247-bootstrap-format-self-heal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/lib/character-onboarding/living-world-bootstrap.service.ts
          git commit -m 'style(genesis): format initial opportunity bootstrap'
          git push origin HEAD:${{ github.head_ref }}
