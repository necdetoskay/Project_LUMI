name: PR-9 Branch Preflight

on:
  push:
    branches:
      - agent/legacy-character-contract-pr9

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier patch
        shell: bash
        run: |
          pnpm exec prettier --write \
            packages/profiles/scripts/legacy-character-contract-db-selftest.mjs \
            tooling/data-integrity/character-consumer-contract.mjs
          git diff -- \
            packages/profiles/scripts/legacy-character-contract-db-selftest.mjs \
            tooling/data-integrity/character-consumer-contract.mjs
          exit 1
