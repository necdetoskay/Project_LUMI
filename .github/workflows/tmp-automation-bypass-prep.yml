name: Temporary Automation Bypass Prep

on:
  push:
    branches:
      - agent/live-long-horizon-fix-prep

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: pnpm exec prettier --write apps/web/playwright.long-horizon-live.config.ts

      - name: Format check
        run: pnpm exec prettier --check apps/web/playwright.long-horizon-live.config.ts apps/web/tests/e2e/long-horizon/baseline-onboarding.live.spec.ts apps/web/app/app/profiles/[childProfileId]/child-dashboard-client-page.tsx

      - name: Web typecheck
        run: pnpm --filter @lumi/web typecheck

      - name: Commit verified formatted source
        shell: bash
        run: |
          if git diff --quiet -- apps/web/playwright.long-horizon-live.config.ts; then
            echo "Prettier produced no source diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/playwright.long-horizon-live.config.ts
          git commit -m "style(e2e): format Vercel automation bypass config"
          git push origin "HEAD:$GITHUB_REF_NAME"
