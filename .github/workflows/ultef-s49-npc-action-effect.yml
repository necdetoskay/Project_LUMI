name: ULTEF S49 NPC Action Effect

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-action-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_ultef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_ultef_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_ultef_test
      NODE_ENV: test
      ULTEF_SCENARIO: PX-LUMI-S49-NPC-ACTION-EFFECT-001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare world schema
        run: pnpm --filter @lumi/world world:migrate
      - name: Prepare story schema
        run: pnpm --filter @lumi/story story:migrate
      - name: Run S49 DB-backed NPC action effect evidence
        run: pnpm --filter @lumi/worker ultef:s49-npc-action-effect
