name: Profiles Safe Route Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/profiles-canonical-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profiles-canonical-ui
          fetch-depth: 0
      - name: Restore canonical safe profile route composer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/app/profiles/profiles-client-page.tsx')
          text = path.read_text()
          old_href = 'href={`/app/profiles/${encodeURIComponent(profile.id)}`}'
          new_href = 'href={composeChildProfileSafeDetailPath(profile.id)}'
          if old_href not in text:
              raise SystemExit('profile href target not found')
          text = text.replace(old_href, new_href, 1)
          marker = '\nfunction ProfileCard({' 
          helper = '''\nfunction composeChildProfileSafeDetailPath(childProfileId: string) {\n  return `/app/profiles/${encodeURIComponent(childProfileId)}`;\n}\n'''
          if marker not in text:
              raise SystemExit('ProfileCard marker not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/app/profiles/profiles-client-page.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/profiles/profiles-client-page.tsx
          git commit -m "fix(profiles): preserve canonical safe profile handoff"
          git push origin HEAD:agent/profiles-canonical-ui
