name: Temporary Fix Empty Personalization

on:
  push:
    branches:
      - agent/context-trace-persistence

permissions:
  contents: write

jobs:
  patch:
    # One-shot semantic repair; bot-authored repair commits do not recurse.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-trace-persistence
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply semantic fix and regression coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const assemblerPath = 'packages/profiles/src/application/generation-context-assembler.ts';
          let assembler = fs.readFileSync(assemblerPath, 'utf8');
          const helperNeedle = `function hasMeaningfulValue(value: unknown): boolean {\n  if (value == null) return false;\n  if (typeof value === "string") return value.trim().length > 0;\n  if (typeof value === "number") return Number.isFinite(value);\n  if (typeof value === "boolean") return true;\n  if (Array.isArray(value)) return value.some(hasMeaningfulValue);\n  if (typeof value === "object") {\n    return Object.values(value as Record<string, unknown>).some(\n      hasMeaningfulValue,\n    );\n  }\n  return false;\n}\n`;
          const helperReplacement = `${helperNeedle}\nfunction isMissingRequiredSourceValue(value: unknown): boolean {\n  if (value == null) return true;\n  if (typeof value === "string") return value.trim().length === 0;\n  if (typeof value === "number") return !Number.isFinite(value);\n  return false;\n}\n`;
          if (!assembler.includes(helperNeedle)) throw new Error('assembler helper needle not found');
          assembler = assembler.replace(helperNeedle, helperReplacement);
          const conditionNeedle = `    let value = result.value;\n    if (!hasMeaningfulValue(value)) {\n      if (sectionPolicy.priority === "required") {\n        throw new Error(\n          \`GENERATION_CONTEXT_REQUIRED_SOURCE_MISSING:\${sectionPolicy.section}\`,\n        );\n      }\n      continue;\n    }\n`;
          const conditionReplacement = `    let value = result.value;\n    const sourceValueMissing =\n      sectionPolicy.priority === "required"\n        ? isMissingRequiredSourceValue(value)\n        : !hasMeaningfulValue(value);\n    if (sourceValueMissing) {\n      if (sectionPolicy.priority === "required") {\n        throw new Error(\n          \`GENERATION_CONTEXT_REQUIRED_SOURCE_MISSING:\${sectionPolicy.section}\`,\n        );\n      }\n      continue;\n    }\n`;
          if (!assembler.includes(conditionNeedle)) throw new Error('assembler condition needle not found');
          assembler = assembler.replace(conditionNeedle, conditionReplacement);
          fs.writeFileSync(assemblerPath, assembler);

          const testPath = 'packages/profiles/src/application/generation-context-assembler.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const testNeedle = `  it("rejects a required section when its canonical value is missing", () => {\n    expect(() =>\n      assembleGenerationContext(context("story_generation")),\n    ).toThrow("GENERATION_CONTEXT_REQUIRED_SOURCE_MISSING:character_state");\n  });\n`;
          const testAddition = `${testNeedle}\n  it("keeps a required structured personalization source when its collections are empty", () => {\n    const source = context("character_onboarding");\n    source.child.interests = [];\n    source.child.customInterests = [];\n    source.child.developmentGoals = [];\n\n    const assembled = assembleGenerationContext(source);\n    const promptContext = toPromptGenerationContext(assembled);\n\n    expect(promptContext.child_personalization).toEqual({\n      interests: [],\n      customInterests: [],\n      developmentGoals: [],\n    });\n  });\n`;
          if (!test.includes(testNeedle)) throw new Error('assembler test needle not found');
          test = test.replace(testNeedle, testAddition);
          fs.writeFileSync(testPath, test);
          NODE
          pnpm exec prettier --write packages/profiles/src/application/generation-context-assembler.ts packages/profiles/src/application/generation-context-assembler.test.ts
          pnpm --filter @lumi/profiles typecheck
          pnpm --filter @lumi/profiles test
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profiles/src/application/generation-context-assembler.ts packages/profiles/src/application/generation-context-assembler.test.ts
          git commit -m "fix(context): allow empty structured personalization"
          git push origin HEAD:agent/context-trace-persistence
