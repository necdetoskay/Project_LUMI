name: TMP Visual Library v3 Preflight

on:
  push:
    branches:
      - agent/visual-library-v3-character-home

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @lumi/web lint
      - run: pnpm --filter @lumi/web typecheck
      - run: pnpm --filter @lumi/web test
      - run: pnpm --filter @lumi/web build
