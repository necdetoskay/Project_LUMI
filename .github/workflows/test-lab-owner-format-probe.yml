name: Test Lab Owner Formatter Probe

on:
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/api/settings/test-lab/route.ts
      - uses: actions/upload-artifact@v4
        with:
          name: test-lab-owner-prettier
          path: apps/web/app/api/settings/test-lab/route.ts
