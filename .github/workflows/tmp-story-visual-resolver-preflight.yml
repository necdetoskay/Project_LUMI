name: One-shot Story Visual Resolver Preflight

on:
  push:
    branches:
      - agent/story-visual-asset-resolver

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --check packages/media/src/domain/story-visual-asset-resolver.ts packages/media/src/domain/index.ts packages/media/tests/domain/story-visual-asset-resolver.test.ts
      - run: pnpm --filter @lumi/media lint
      - run: pnpm --filter @lumi/media typecheck
      - run: pnpm --filter @lumi/media test
