name: Test Lab Character Type Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Character Type workbench changes
        run: python3 tooling/temp/test-lab-character-type-apply.py
      - name: Format changed source
        run: pnpm exec prettier --write apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx
      - name: Verify Character Type contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync(
            'apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx',
            'utf8',
          );
          const required = [
            'const CHARACTER_TYPE_PHASE_ID = "character_type"',
            '{ key: "human", label: "İnsan" }',
            '{ key: "animal", label: "Hayvan" }',
            '{ key: "fantastic", label: "Fantastik" }',
            '{ key: "synthetic", label: "Sentetik" }',
            'characterType: { key: characterType }',
            'selectionPhase ||',
            'Karakter tipi seçimi',
            'LLM üretim aşaması',
          ];
          for (const needle of required) {
            if (!source.includes(needle)) {
              throw new Error(`Missing contract: ${needle}`);
            }
          }
          const defaultBlock = source.slice(
            source.indexOf('const DEFAULT_STATE'),
            source.indexOf('const LAST_HOUSEHOLD_KEY'),
          );
          if (defaultBlock.includes('characterType: { key: "fantastic" }')) {
            throw new Error('Character type is still hard-coded in DEFAULT_STATE');
          }
          console.log('Character Type Test Lab contract: PASS');
          NODE
      - name: Commit implementation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "No implementation changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/onboarding-test-runner.tsx
          git commit -m "feat(test-lab): make character type a real selection stage"
          git push origin HEAD:"$HEAD_BRANCH"
