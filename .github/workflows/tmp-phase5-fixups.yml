name: Temporary Phase 5 Fixups

on:
  push:
    branches:
      - agent/character-genesis-phase5-onboarding-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/character-genesis-phase5-onboarding-foundation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply targeted Phase 5 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/profiles/src/application/onboarding-foundation-commit.service.ts')
          text = path.read_text()
          old = '''  return {
    genesis: mapTrace("character_origin_suggestions", "character_genesis"),
    saga: mapTrace("character_core_saga", "saga_foundation"),
  };
'''
          new = '''  const genesis = mapTrace("character_origin_suggestions", "character_genesis");
  const saga = mapTrace("character_core_saga", "saga_foundation");
  return {
    ...(genesis ? { genesis } : {}),
    ...(saga ? { saga } : {}),
  };
'''
          if old not in text:
              raise SystemExit('provenance return block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('packages/profiles/src/application/character-foundation-finalization.service.ts')
          text = path.read_text()
          old = '''  await db.transaction(async (tx) => {
    await tx.insert(characterCreationSelections).values({
      id: crypto.randomUUID(),
      cycleId: input.cycleId,
      childProfileId: input.childProfileId,
      householdId: input.householdId,
      stepKey: "final_review",
      selectionKey: "commit",
      selectionPayload: {
        characterId: input.characterId,
        worldId: input.worldId,
        sagaKey: input.sagaKey,
      },
      selectedBy: "user",
    });
    await tx
      .update(characterCreationCycles)
      .set({
        status: "completed",
        currentStep: "completed",
        latestSummary: {
          ...summary,
          foundationCommitState: "committed",
          committedWorldId: input.worldId,
        },
        completedAt: new Date(),
        updatedAt: new Date(),
      })
      .where(
        and(
          eq(characterCreationCycles.id, input.cycleId),
          eq(characterCreationCycles.status, "draft"),
        ),
      );
  });
'''
          new = '''  await db.transaction(async (tx) => {
    const [claimed] = await tx
      .update(characterCreationCycles)
      .set({
        status: "completed",
        currentStep: "completed",
        latestSummary: {
          ...summary,
          foundationCommitState: "committed",
          committedWorldId: input.worldId,
        },
        completedAt: new Date(),
        updatedAt: new Date(),
      })
      .where(
        and(
          eq(characterCreationCycles.id, input.cycleId),
          eq(characterCreationCycles.status, "draft"),
        ),
      )
      .returning({ id: characterCreationCycles.id });
    if (!claimed) return;

    await tx.insert(characterCreationSelections).values({
      id: crypto.randomUUID(),
      cycleId: input.cycleId,
      childProfileId: input.childProfileId,
      householdId: input.householdId,
      stepKey: "final_review",
      selectionKey: "commit",
      selectionPayload: {
        characterId: input.characterId,
        worldId: input.worldId,
        sagaKey: input.sagaKey,
      },
      selectedBy: "user",
    });
  });
'''
          if old not in text:
              raise SystemExit('finalization transaction block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('apps/web/app/app/profiles/[childProfileId]/characters/new/wizard/canonical-character-wizard-client.tsx')
          text = path.read_text()
          old = '''function formatSummary(value: unknown): string {
  if (typeof value === "string") return value;
  if (!value || typeof value !== "object") return "—";
  const record = value as Record<string, unknown>;
  return String(
    record.name ??
      record.title ??
      record.characterType ??
      record.classification ??
      record.key ??
      "Seçildi",
  );
}'''
          new = '''function formatSummary(value: unknown): string {
  if (typeof value === "string") return value;
  if (!value || typeof value !== "object") return "—";
  const record = value as Record<string, unknown>;
  const primary = String(
    record.name ??
      record.title ??
      record.characterType ??
      record.classification ??
      record.key ??
      "Seçildi",
  );
  const details = [
    record.identity,
    record.description,
    record.origin,
    record.storyHook,
    record.premise,
    record.longTermGoal,
  ]
    .filter((item): item is string => typeof item === "string" && item.trim().length > 0)
    .filter((item) => item !== primary);
  return [primary, ...details].join(" — ");
}'''
          if old not in text:
              raise SystemExit('wizard formatSummary block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm format
      - name: Commit fixups
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix(genesis): complete phase 5 onboarding integration"
          git push origin HEAD:agent/character-genesis-phase5-onboarding-foundation
