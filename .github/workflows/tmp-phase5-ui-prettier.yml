name: Temporary Phase 5 UI Prettier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only the Test Lab client
        run: pnpm exec prettier --write apps/web/app/app/settings/test-lab/test-lab-client.tsx
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet -- apps/web/app/app/settings/test-lab/test-lab-client.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/settings/test-lab/test-lab-client.tsx
          git commit -m "style(test-lab): format phase5 client"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
