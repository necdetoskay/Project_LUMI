name: Temporary Phase 5 UI Prettier

on:
  pull_request:
    branches:
      - main

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write apps/web/app/app/settings/test-lab/test-lab-client.tsx
          git diff --no-ext-diff -- apps/web/app/app/settings/test-lab/test-lab-client.tsx
          exit 1
