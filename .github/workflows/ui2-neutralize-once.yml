name: UI2 Neutralize Once

on:
  push:
    branches:
      - agent/test-lab-canonical-ui-2
    paths:
      - .github/workflows/ui2-neutralize-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-lab-canonical-ui-2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply UI2 neutral state
        run: node tooling/ui2-neutralize-dashboard.mjs
      - name: Format UI2 files
        run: pnpm exec prettier --write apps/web/app/app/settings/test-lab/canonical-dashboard.tsx apps/web/app/app/settings/test-lab/page.tsx apps/web/lib/ai/test-lab-dashboard-data.ts apps/web/lib/ai/test-lab-dashboard-view-model.ts apps/web/lib/ai/test-lab-dashboard-view-model.test.ts
      - name: Remove one-shot files
        run: rm tooling/ui2-neutralize-dashboard.mjs .github/workflows/ui2-neutralize-once.yml
      - name: Commit UI2 neutral state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(test-lab): keep future-phase dashboard data neutral"
          git push origin HEAD:agent/test-lab-canonical-ui-2
