name: ULTEF Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  db-backed-ultef:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi_test_only
          POSTGRES_DB: lumi_ultef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumi -d lumi_ultef_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_ultef_test
      STORY_TEST_DATABASE_URL: postgresql://lumi:lumi_test_only@localhost:5432/lumi_ultef_test
      STORY_TEST_ENABLE_DESTRUCTIVE: "true"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare profile schema
        run: pnpm --filter @lumi/profiles profile:migrate
      - name: Prepare world schema
        run: pnpm --filter @lumi/world world:migrate
      - name: Prepare NPC intelligence schema
        run: pnpm --filter @lumi/npc-intelligence npc:migrate
      - name: Prepare story schema
        run: pnpm --filter @lumi/story story:migrate
      - name: Prepare auth schema
        run: pnpm --filter @lumi/web auth:migrate
      - name: Run ULTEF DB integration profile
        run: pnpm ultef:integration
      - name: Run L6 Golden Headless Journey
        run: pnpm ultef:golden
      - name: Run L9 deterministic long-horizon state journey
        run: pnpm ultef:l9-long-horizon
      - name: Run L9 DB-backed ten-session long-horizon journey
        run: pnpm ultef:l9-long-horizon-db
      - name: Run L9 commit recovery journey
        run: pnpm ultef:l9-commit-recovery
      - name: Run L9 concurrent tenant isolation journey
        run: pnpm ultef:l9-concurrency
      - name: Run L9 crash restart recovery journey
        run: pnpm ultef:l9-crash-recovery
      - name: Run L9 DB-backed load baseline
        run: pnpm ultef:l9-load
      - name: Run L9 observability production contract
        run: pnpm ultef:l9-observability
      - name: Run L9 PostgreSQL backup restore recovery
        env:
          ULTEF_SCENARIO: L9-BACKUP-RESTORE-001
        run: pnpm --filter @lumi/story exec vitest run --config vitest.integration.config.ts tests/integration/ultef-l9-backup-restore.integration.test.ts
      - name: Run L9 container deployment rollback recovery
        run: pnpm ultef:l9-deployment-rollback
      - name: Run L9 dependency outage recovery
        run: pnpm ultef:l9-dependency-outage
      - name: Run Sprint 01 household isolation matrix
        run: pnpm ultef:isolation
      - name: Run Sprint 01 session negative scenarios
        run: pnpm ultef:session-negative
      - name: Run Sprint 01 session idempotency scenario
        run: pnpm ultef:session-idempotency
      - name: Run Sprint 01 single active session guard
        run: pnpm ultef:session-single-active
      - name: Run Sprint 01 invalid outcome rejection
        run: pnpm ultef:outcome-rejection
      - name: Run Sprint 01 atomic outcome rollback
        run: pnpm ultef:outcome-atomic-rollback
      - name: Run Sprint 01 indirect propagation retry
        run: pnpm ultef:indirect-retry
      - name: Run Sprint 01 terminal indirect propagation failure
        run: pnpm ultef:indirect-terminal-failure
      - name: Run Sprint 01 choice branch divergence
        run: pnpm ultef:choice-divergence
      - name: Run Sprint 01 choice-derived world divergence
        run: pnpm ultef:choice-world-divergence
      - name: Run Sprint 01 continuity context divergence
        run: pnpm ultef:continuity-divergence
      - name: Run Sprint 01 continuity context to generated story
        run: pnpm ultef:context-to-story
      - name: Print human-readable ULTEF summary
        if: always()
        run: |
          if [ -f artifacts/ultef/latest/integration-summary.md ]; then
            cat artifacts/ultef/latest/integration-summary.md
          else
            echo "ULTEF integration summary was not produced."
          fi
          GOLDEN_FILE=$(find artifacts/ultef/runs -name 'L6-GOLDEN-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$GOLDEN_FILE" ]; then
            echo
            echo "===== L6 GOLDEN HEADLESS JOURNEY ====="
            cat "$GOLDEN_FILE"
          else
            echo "L6 Golden Journey evidence was not produced."
          fi
          L9_FILE=$(find artifacts/ultef/runs -name 'L9-LONG-HORIZON-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$L9_FILE" ]; then
            echo
            echo "===== L9 LONG HORIZON ====="
            cat "$L9_FILE"
          else
            echo "L9 long-horizon evidence was not produced."
          fi
          RECOVERY_FILE=$(find artifacts/ultef/runs -name 'L9-COMMIT-RECOVERY-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$RECOVERY_FILE" ]; then
            echo
            echo "===== L9 COMMIT RECOVERY ====="
            cat "$RECOVERY_FILE"
          else
            echo "L9 commit-recovery evidence was not produced."
          fi
          CONCURRENCY_FILE=$(find artifacts/ultef/runs -name 'L9-CONCURRENCY-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$CONCURRENCY_FILE" ]; then
            echo
            echo "===== L9 CONCURRENCY ====="
            cat "$CONCURRENCY_FILE"
          else
            echo "L9 concurrency evidence was not produced."
          fi
          CRASH_FILE=$(find artifacts/ultef/runs -name 'L9-CRASH-RECOVERY-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$CRASH_FILE" ]; then
            echo
            echo "===== L9 CRASH RESTART RECOVERY ====="
            cat "$CRASH_FILE"
          else
            echo "L9 crash-recovery evidence was not produced."
          fi
          LOAD_FILE=$(find artifacts/ultef/runs -name 'L9-LOAD-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$LOAD_FILE" ]; then
            echo
            echo "===== L9 DB-BACKED LOAD BASELINE ====="
            cat "$LOAD_FILE"
          else
            echo "L9 load evidence was not produced."
          fi
          OBS_FILE=$(find artifacts/ultef/runs -name 'L9-OBSERVABILITY-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$OBS_FILE" ]; then
            echo
            echo "===== L9 OBSERVABILITY CONTRACT ====="
            cat "$OBS_FILE"
          else
            echo "L9 observability evidence was not produced."
          fi
          BACKUP_FILE=$(find artifacts/ultef/runs -name 'L9-BACKUP-RESTORE-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$BACKUP_FILE" ]; then
            echo
            echo "===== L9 BACKUP RESTORE ====="
            cat "$BACKUP_FILE"
          else
            echo "L9 backup-restore evidence was not produced."
          fi
          DEPLOY_FILE=$(find artifacts/ultef/runs -name 'L9-DEPLOY-ROLLBACK-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$DEPLOY_FILE" ]; then
            echo
            echo "===== L9 DEPLOYMENT ROLLBACK ====="
            cat "$DEPLOY_FILE"
          else
            echo "L9 deployment rollback evidence was not produced."
          fi
          OUTAGE_FILE=$(find artifacts/ultef/runs -name 'L9-DEPENDENCY-OUTAGE-001.md' -type f 2>/dev/null | sort | tail -n 1)
          if [ -n "$OUTAGE_FILE" ]; then
            echo
            echo "===== L9 DEPENDENCY OUTAGE ====="
            cat "$OUTAGE_FILE"
          else
            echo "L9 dependency-outage evidence was not produced."
          fi
      - name: Upload ULTEF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultef-db-integration-evidence
          path: artifacts/ultef/
          if-no-files-found: warn
          retention-days: 14
