name: Temporary Dashboard V2 Type Fix

on:
  push:
    branches:
      - agent/login-dashboard-canonical-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore(ci): fix dashboard v2 exact optional types'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/login-dashboard-canonical-ui
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact optional type fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/app/dashboard-v2-client.tsx')
          text = path.read_text()
          text = text.replace('detail?: string;', 'detail?: string | undefined;')
          text = text.replace('className={styles.characterImage}', 'className={styles.characterImage!}')
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/app/app/dashboard-v2-client.tsx
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/dashboard-v2-client.tsx
          git commit -m "fix(dashboard): satisfy exact optional property types"
          git push origin HEAD:agent/login-dashboard-canonical-ui
