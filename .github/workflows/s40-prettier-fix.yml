name: S40 Prettier Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prettier-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository prettier output
        run: |
          pnpm exec prettier --write \
            apps/web/app/forgot-password/page.tsx \
            apps/web/app/login/page.tsx \
            apps/web/app/page.tsx \
            apps/web/app/register/page.tsx \
            apps/web/app/storybook.css \
            apps/web/components/layout/app-footer.tsx \
            apps/web/tests/e2e/s40-public-auth.spec.ts
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/forgot-password/page.tsx \
            apps/web/app/login/page.tsx \
            apps/web/app/page.tsx \
            apps/web/app/register/page.tsx \
            apps/web/app/storybook.css \
            apps/web/components/layout/app-footer.tsx \
            apps/web/tests/e2e/s40-public-auth.spec.ts
          git commit -m "style(s40): apply repository prettier output"
          git push origin HEAD:${{ github.head_ref }}
