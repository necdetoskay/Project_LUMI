name: Temporary home add child link patch

on:
  push:
    branches:
      - agent/live-long-horizon-playwright-pack

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-long-horizon-playwright-pack
      - name: Patch home add child links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("apps/web/app/app/page.tsx")
          text = p.read_text()
          old = '<Link className="storybook-button" href="/app/onboarding">'
          if text.count(old) != 1:
              raise SystemExit(f"primary CTA count: {text.count(old)}")
          text = text.replace(
              old,
              '<Link\n                  className="storybook-button"\n                  href={state.hasHousehold ? "/app/onboarding?addProfile=1" : "/app/onboarding"}\n                >',
              1,
          )
          old = '<Link className="storybook-button mt-6" href="/app/onboarding">'
          if text.count(old) != 1:
              raise SystemExit(f"empty CTA count: {text.count(old)}")
          text = text.replace(
              old,
              '<Link\n                className="storybook-button mt-6"\n                href={state.hasHousehold ? "/app/onboarding?addProfile=1" : "/app/onboarding"}\n              >',
              1,
          )
          p.write_text(text)
          Path(".github/workflows/tmp-home-add-child-link.yml").unlink()
          PY
      - name: Format and commit
        run: |
          corepack enable
          pnpm exec prettier --write apps/web/app/app/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): route existing households to child creation"
          git push origin HEAD:agent/live-long-horizon-playwright-pack
