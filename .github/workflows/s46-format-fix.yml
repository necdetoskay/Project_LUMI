name: S46 Temporary Format Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s46/memory-to-story-production-wiring
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format S46 files
        run: >-
          pnpm exec prettier --write
          apps/web/lib/story/canonical-memory-usage.service.ts
          apps/web/tests/ultef-s46-memory-story-production.v3.integration.test.ts
          packages/npc-intelligence/src/db/schema/npc-intelligence/memories.ts
          packages/story/tests/application/story-scene-generation.service.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/web/lib/story/canonical-memory-usage.service.ts \
              apps/web/tests/ultef-s46-memory-story-production.v3.integration.test.ts \
              packages/npc-intelligence/src/db/schema/npc-intelligence/memories.ts \
              packages/story/tests/application/story-scene-generation.service.test.ts
            git commit -m "style(s46): format memory story production files"
            git push origin HEAD:s46/memory-to-story-production-wiring
          fi
