name: One-shot Visual Library v2 Preflight

on:
  push:
    branches:
      - agent/visual-library-v2-shell

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format visual library files
        run: |
          pnpm prettier --write apps/web/app/app/assets/visual-library-v2.tsx apps/web/app/app/assets/page.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/app/app/assets/visual-library-v2.tsx apps/web/app/app/assets/page.tsx
            git commit -m "style(web): format visual library v2"
            git push
          fi
      - run: pnpm prettier --check apps/web/app/app/assets/visual-library-v2.tsx apps/web/app/app/assets/page.tsx
      - run: pnpm --filter @lumi/web lint
      - run: pnpm --filter @lumi/web typecheck
      - run: pnpm --filter @lumi/web test
      - run: pnpm --filter @lumi/web build
