name: Temporary Profiles Card ID Patcher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-profiles-card-id-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'add temporary profile card id patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profiles-canonical-ui
          fetch-depth: 0
      - name: Restore profile automation id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/app/profiles/profiles-client-page.tsx')
          text = path.read_text()
          old = '<article className={styles.profileCard}>'
          new = '<article className={styles.profileCard} data-profile-id={profile.id}>'
          if old not in text:
              raise SystemExit('profile card marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/profiles/profiles-client-page.tsx
          git commit -m "fix(profiles): restore profile automation id"
          git push origin HEAD:agent/profiles-canonical-ui
