name: NPC Referential Integrity Preflight

on:
  push:
    branches:
      - fix/npc-referential-integrity-hardening

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumi_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumi_integrity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate migration integrity policy
        run: node tooling/data-integrity/check-migrations.mjs
      - name: Self-test migration integrity policy
        run: node tooling/data-integrity/migration-integrity-selftest.mjs
      - name: Bootstrap production schema from zero
        env:
          VERCEL_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs
      - name: Verify production schema second pass is idempotent
        env:
          VERCEL_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: node apps/web/scripts/vercel-production-schema-migrate.mjs
      - name: Run NPC referential integrity regression
        env:
          NPC_INTEGRITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumi_integrity
        run: pnpm --filter @lumi/npc-intelligence test:db:referential-integrity
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
