openapi: 3.1.0
info:
  title: LUMI API
  version: 1.0.0
servers:
  - url: /api/v1

paths:
  /me:
    get:
      summary: Return authenticated user
      responses:
        "200":
          description: Authenticated user
        "401":
          description: Unauthenticated

  /households:
    post:
      summary: Create household
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: Household created
        "401":
          description: Unauthenticated
        "422":
          description: Validation error

components:
  schemas:
    CreateHouseholdRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"

    ApiError:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          type: object
          required:
            - requestId
          properties:
            requestId:
              type: string
